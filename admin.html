<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - LMS</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    margin:0;
}

nav{
    background:#1a1a2e;
    color:white;
    padding:15px;
}

.container{
    max-width:900px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px;
    background:#667eea;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<nav>
🎓 Admin Instructor Panel
</nav>

<div class="container">

<h2>Create Course</h2>

<input id="title" placeholder="Course Title">
<textarea id="desc" placeholder="Course Description"></textarea>
<input id="level" placeholder="Level (SS1, SS2...)">

<button onclick="createCourse()">Create Course</button>

<hr>

<h2>Add Lesson</h2>

<input id="courseId" placeholder="Course ID">
<input id="lessonTitle" placeholder="Lesson Title">
<textarea id="lessonContent" placeholder="Lesson Content"></textarea>

<button onclick="addLesson()">Add Lesson</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* =======================
   ADMIN CHECK
======================= */
auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();

    if (!doc.exists || doc.data().role !== "admin") {
        alert("Access denied!");
        window.location.href = "dashboard.html";
    }
});

/* =======================
   CREATE COURSE
======================= */
async function createCourse(){

    const title = document.getElementById("title").value;
    const desc = document.getElementById("desc").value;
    const level = document.getElementById("level").value;

    const courseRef = await db.collection("courses").add({
        title,
        description: desc,
        level,
        createdAt: new Date()
    });

    alert("Course created: " + courseRef.id);
}

/* =======================
   ADD LESSON
======================= */
async function addLesson(){

    const courseId = document.getElementById("courseId").value;
    const title = document.getElementById("lessonTitle").value;
    const content = document.getElementById("lessonContent").value;

    await db.collection("courses")
        .doc(courseId)
        .collection("lessons")
        .add({
            title,
            content,
            order: Date.now()
        });

    alert("Lesson added!");
}
</script>

</body>
</html>
