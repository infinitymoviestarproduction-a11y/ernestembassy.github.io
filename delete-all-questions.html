<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete All Questions - Batch Mode</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #eb3349; margin-bottom: 20px; }
        button {
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-danger { background: #eb3349; color: white; }
        .btn-success { background: #11998e; color: white; }
        .btn-info { background: #3498db; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            width: 0%;
            transition: width 0.3s;
            border-radius: 10px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status { margin: 10px 0; padding: 10px; border-radius: 8px; }
        .status-info { background: #3498db20; color: #3498db; }
        .status-success { background: #11998e20; color: #11998e; }
        .status-error { background: #eb334920; color: #eb3349; }
        .status-warning { background: #f39c1220; color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Delete All Questions - Batch Mode</h1>
        <p>Deletes in small batches to avoid "Transaction too big" errors</p>
        
        <div>
            <button class="btn-info" onclick="countQuestions()">📊 Count Questions</button>
            <button class="btn-warning" onclick="deleteIndividualOnly()">🗑️ Delete Individual Questions Only</button>
            <button class="btn-danger" onclick="deleteAllBatch()">⚠️ Delete EVERYTHING (Batch Mode)</button>
        </div>
        
        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="result" class="result">
            Click a button above to begin...
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
            authDomain: "ernest-embassy-lms.firebaseapp.com",
            projectId: "ernest-embassy-lms",
            storageBucket: "ernest-embassy-lms.firebasestorage.app",
            messagingSenderId: "204896421221",
            appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const resultDiv = document.getElementById('result');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        
        function showMessage(msg, type) {
            const statusClass = type === 'error' ? 'status-error' : (type === 'warning' ? 'status-warning' : 'status-success');
            resultDiv.innerHTML += `<div class="status ${statusClass}">${msg}</div>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }
        
        function clearResult() {
            resultDiv.innerHTML = '';
        }
        
        async function countQuestions() {
            clearResult();
            showMessage("📊 Counting documents...", "info");
            
            try {
                const snapshot = await db.collection("questions").get();
                
                if (snapshot.size === 0) {
                    showMessage("✅ Your 'questions' collection is EMPTY!", "success");
                    return;
                }
                
                let subjectDocs = 0;
                let individualDocs = 0;
                let totalQuestions = 0;
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    if (data.questions && Array.isArray(data.questions)) {
                        subjectDocs++;
                        totalQuestions += data.questions.length;
                    } else {
                        individualDocs++;
                    }
                }
                
                showMessage(`📊 SUMMARY:`, "info");
                showMessage(`   Total Documents: ${snapshot.size}`, "info");
                showMessage(`   ✅ Subject Documents: ${subjectDocs} (contains ${totalQuestions} questions total)`, "success");
                showMessage(`   ⚠️ Individual Question Docs: ${individualDocs}`, "warning");
                
                if (individualDocs > 0) {
                    showMessage(`💡 Tip: Click "Delete Individual Questions Only" first to remove the ${individualDocs} individual question documents.`, "warning");
                }
                
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, "error");
            }
        }
        
        async function deleteIndividualOnly() {
            clearResult();
            
            if (!confirm("⚠️ This will delete ONLY individual question documents (not the subject documents).\n\nContinue?")) {
                showMessage("Deletion cancelled.", "warning");
                return;
            }
            
            showMessage("🔍 Finding individual question documents...", "info");
            
            try {
                const snapshot = await db.collection("questions").get();
                const individualDocs = [];
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    if (!data.questions || !Array.isArray(data.questions)) {
                        individualDocs.push(doc);
                    }
                }
                
                if (individualDocs.length === 0) {
                    showMessage("✅ No individual question documents found!", "success");
                    return;
                }
                
                showMessage(`📊 Found ${individualDocs.length} individual question documents to delete.`, "info");
                
                // Delete in batches of 50
                const BATCH_SIZE = 50;
                let deleted = 0;
                
                for (let i = 0; i < individualDocs.length; i += BATCH_SIZE) {
                    const batch = db.batch();
                    const batchDocs = individualDocs.slice(i, i + BATCH_SIZE);
                    
                    batchDocs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    
                    await batch.commit();
                    deleted += batchDocs.length;
                    showMessage(`   ✅ Deleted batch ${Math.floor(i/BATCH_SIZE) + 1}: ${batchDocs.length} documents (Total: ${deleted}/${individualDocs.length})`, "success");
                }
                
                showMessage(`✅ SUCCESS! Deleted ${deleted} individual question documents!`, "success");
                showMessage(`💡 Your subject documents (with questions arrays) are still there.`, "info");
                
                await countQuestions();
                
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, "error");
            }
        }
        
        async function deleteAllBatch() {
            clearResult();
            
            if (!confirm("⚠️⚠️⚠️ DANGER: This will delete EVERYTHING in your 'questions' collection!\n\nContinue?")) {
                showMessage("Deletion cancelled.", "warning");
                return;
            }
            
            const confirmText = prompt("Type 'DELETE ALL' to confirm deletion:");
            if (confirmText !== "DELETE ALL") {
                showMessage("Deletion cancelled - incorrect confirmation.", "warning");
                return;
            }
            
            showMessage("🔍 Fetching all documents...", "info");
            
            try {
                const snapshot = await db.collection("questions").get();
                
                if (snapshot.size === 0) {
                    showMessage("✅ No documents found. Collection is already empty!", "success");
                    return;
                }
                
                const allDocs = snapshot.docs;
                const totalDocs = allDocs.length;
                const BATCH_SIZE = 50;
                let deleted = 0;
                
                progressBar.style.display = "block";
                
                showMessage(`📊 Found ${totalDocs} documents to delete.`, "info");
                showMessage(`🔄 Deleting in batches of ${BATCH_SIZE}...`, "info");
                
                for (let i = 0; i < allDocs.length; i += BATCH_SIZE) {
                    const batch = db.batch();
                    const batchDocs = allDocs.slice(i, i + BATCH_SIZE);
                    
                    batchDocs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    
                    await batch.commit();
                    deleted += batchDocs.length;
                    
                    const percent = (deleted / totalDocs) * 100;
                    progressFill.style.width = `${percent}%`;
                    
                    showMessage(`   ✅ Batch ${Math.floor(i/BATCH_SIZE) + 1}: Deleted ${batchDocs.length} documents (Total: ${deleted}/${totalDocs})`, "success");
                }
                
                progressBar.style.display = "none";
                showMessage(`✅✅✅ COMPLETE! Deleted ${deleted} documents from your "questions" collection!`, "success");
                showMessage(`💡 Your database is now clean. Use the Bulk Uploader to add subjects correctly.`, "info");
                
                await countQuestions();
                
            } catch (error) {
                progressBar.style.display = "none";
                showMessage(`❌ Error: ${error.message}`, "error");
            }
        }
    </script>
</body>
</html>
