<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Ernest Embassy LMS</title>
    
    <!-- Use the COMPAT version of Firebase (no modules needed) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2d3748;
        }
        
        /* Animated gradient background */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        nav { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 0; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .nav-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        
        .logo { 
            font-size: 1.4rem; 
            font-weight: bold; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-links { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .nav-links a { 
            color: #4a5568; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 0.9rem; 
            padding: 8px 0;
            transition: all 0.3s ease;
        }
        .nav-links a:hover { color: #667eea; transform: translateY(-2px); }
        
        .hero { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center; 
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.1)" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x bottom;
            opacity: 0.3;
        }
        
        .hero h1 { 
            font-size: 2.5rem; 
            color: white; 
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
        }
        
        .hero p { 
            color: rgba(255,255,255,0.95); 
            font-size: 1.1rem; 
            position: relative;
        }
        
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        .quiz-section { 
            background: white; 
            border-radius: 20px; 
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .quiz-section:hover {
            transform: translateY(-5px);
        }
        
        .btn { 
            padding: 12px 25px; 
            border: none; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 1rem; 
            margin: 5px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .btn-success { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white; 
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
        }
        
        .btn-success:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary { 
            background: #e2e8f0;
            color: #4a5568;
        }
        
        .btn-secondary:hover { 
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        
        .status-message { 
            text-align: center; 
            font-size: 1.1rem; 
            color: #718096; 
            padding: 40px 0; 
        }
        
        .loading-spinner { 
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .option-item { 
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            color: #2d3748;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .option-item:hover:not([disabled]) { 
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        .option-item.correct { 
            background: linear-gradient(135deg, #11998e20 0%, #38ef7d20 100%);
            border-color: #11998e;
            color: #11998e;
            font-weight: bold;
        }
        
        .option-item.incorrect { 
            background: linear-gradient(135deg, #eb334920 0%, #f45c4320 100%);
            border-color: #eb3349;
            color: #eb3349;
        }
        
        .option-item:disabled { 
            cursor: not-allowed; 
            opacity: 0.8;
        }
        
        .question-text { 
            font-size: 1.35rem;
            margin: 25px 0;
            color: #2d3748;
            line-height: 1.6;
            font-weight: 600;
        }
        
        .quiz-meta { 
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            color: #718096;
            font-weight: 500;
        }
        
        .error-box { 
            background: linear-gradient(135deg, #eb334910 0%, #f45c4310 100%);
            border: 2px solid #eb3349;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            color: #eb3349;
        }
        
        .success-box { 
            background: linear-gradient(135deg, #11998e10 0%, #38ef7d10 100%);
            border: 2px solid #11998e;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            color: #11998e;
        }
        
        .debug-panel { 
            background: #f7fafc;
            border-radius: 12px;
            padding: 12px;
            margin-top: 25px;
            font-size: 11px;
            color: #718096;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid #e2e8f0;
        }
        
        .score-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="#" class="logo">⚡ Ernest Embassy LMS</a>
        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Courses</a>
            <a href="#">Resources</a>
        </div>
    </div>
</nav>

<div class="hero">
    <h1>🎯 Quiz Challenge Arena</h1>
    <p>Test your knowledge and earn amazing scores! 🌟</p>
</div>

<div class="container">
    <div class="quiz-section" id="quizInterface">
        <div class="status-message">
            <div class="loading-spinner"></div>
            <p style="margin-top: 20px;">🎮 Loading your quiz adventure...</p>
        </div>
    </div>
</div>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
        authDomain: "ernest-embassy-lms.firebaseapp.com",
        projectId: "ernest-embassy-lms",
        storageBucket: "ernest-embassy-lms.firebasestorage.app",
        messagingSenderId: "204896421221",
        appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
    };
    
    // Global variables
    let db;
    let loadedQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let debugLogs = [];
    
    // Debug function
    function debug(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        debugLogs.unshift(logEntry);
        console.log(`[DEBUG] ${message}`);
        
        if (debugLogs.length > 20) debugLogs.pop();
        
        const debugPanel = document.getElementById("debugPanel");
        if (debugPanel) {
            debugPanel.innerHTML = debugLogs.map(log => `<div>✨ ${log}</div>`).join('');
        }
    }
    
    // Initialize Firebase
    async function initFirebase() {
        debug("🎯 Initializing Quiz Arena...");
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            debug("✅ Connected to Quiz Database!");
            return true;
        } catch (error) {
            debug("❌ Connection error: " + error.message);
            return false;
        }
    }
    
    // Create sample questions
    async function createSampleQuestions() {
        debug("📝 Creating awesome quiz questions...");
        
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div class="status-message">
                <div class="loading-spinner"></div>
                <p style="margin-top: 20px;">🎨 Crafting your quiz questions...</p>
            </div>
        `;
        
        const sampleQuestions = [
            { question: "What is the value of 2 + 2?", optionA: "3", optionB: "4", optionC: "5", optionD: "6", answer: "B" },
            { question: "What is 5 × 6?", optionA: "30", optionB: "35", optionC: "40", optionD: "45", answer: "A" },
            { question: "Solve: 10 ÷ 2 = ?", optionA: "2", optionB: "3", optionC: "4", optionD: "5", answer: "D" },
            { question: "What is 9 - 4?", optionA: "3", optionB: "4", optionC: "5", optionD: "6", answer: "C" },
            { question: "What is 8 + 7?", optionA: "13", optionB: "14", optionC: "15", optionD: "16", answer: "C" },
            { question: "What is 12 × 12?", optionA: "144", optionB: "124", optionC: "134", optionD: "154", answer: "A" },
            { question: "Simplify: 15 - 7", optionA: "6", optionB: "7", optionC: "8", optionD: "9", answer: "C" },
            { question: "What is 100 ÷ 4?", optionA: "20", optionB: "25", optionC: "30", optionD: "35", answer: "B" },
            { question: "What is 3 + 5 × 2?", optionA: "13", optionB: "16", optionC: "10", optionD: "11", answer: "A" },
            { question: "What is the square root of 81?", optionA: "7", optionB: "8", optionC: "9", optionD: "10", answer: "C" }
        ];
        
        try {
            await db.collection("questions").doc("mathematics-ss1").set({
                questions: sampleQuestions,
                totalQuestions: sampleQuestions.length,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            debug("✅ 10 questions created successfully!");
            alert("🎉 Success! 10 quiz questions have been added!\nClick OK to start your quiz adventure!");
            location.reload();
        } catch (error) {
            debug("❌ Error: " + error.message);
            interfaceDiv.innerHTML = `
                <div class="error-box">
                    <strong>⚠️ Oops! Something went wrong</strong><br>
                    ${error.message}<br><br>
                    <button class="btn btn-primary" onclick="location.reload()">🔄 Try Again</button>
                </div>
                <div class="debug-panel" id="debugPanel"></div>
            `;
        }
    }
    
    // Load questions
    async function loadQuestions() {
        debug("📚 Loading your quiz questions...");
        const interfaceDiv = document.getElementById("quizInterface");
        
        try {
            const docRef = db.collection("questions").doc("mathematics-ss1");
            const docSnap = await docRef.get();
            
            if (!docSnap.exists) {
                interfaceDiv.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin: 20px;">📚</div>
                        <h2 style="color: #667eea;">Ready for a Challenge?</h2>
                        <p style="margin: 20px 0; color: #718096;">Your quiz database is empty. Let's create some questions!</p>
                        <button class="btn btn-success" onclick="createSampleQuestions()" style="font-size: 1.1rem; padding: 15px 30px;">
                            🚀 Create Quiz Questions (10)
                        </button>
                        <p style="margin-top: 20px; font-size: 12px; color: #a0aec0;">
                            Click to generate exciting math questions automatically
                        </p>
                    </div>
                    <div class="debug-panel" id="debugPanel"></div>
                `;
                return false;
            }
            
            const data = docSnap.data();
            loadedQuestions = data.questions || [];
            debug(`✅ Loaded ${loadedQuestions.length} questions`);
            return true;
        } catch (error) {
            debug("❌ Error: " + error.message);
            return false;
        }
    }
    
    // Start quiz
    function startQuiz() {
        debug("🎮 Starting quiz adventure!");
        currentIndex = 0;
        score = 0;
        showQuestion();
    }
    
    // Display question
    function showQuestion() {
        const q = loadedQuestions[currentIndex];
        const interfaceDiv = document.getElementById("quizInterface");
        
        interfaceDiv.innerHTML = `
            <div class="quiz-meta">
                <span>📖 Mathematics SS1</span>
                <span class="score-badge">⭐ Question ${currentIndex + 1}/${loadedQuestions.length}</span>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options-list">
                <button class="option-item" onclick="checkAnswer('A')"><strong>A.</strong> ${q.optionA}</button>
                <button class="option-item" onclick="checkAnswer('B')"><strong>B.</strong> ${q.optionB}</button>
                <button class="option-item" onclick="checkAnswer('C')"><strong>C.</strong> ${q.optionC}</button>
                <button class="option-item" onclick="checkAnswer('D')"><strong>D.</strong> ${q.optionD}</button>
            </div>
            <div id="nextBtn" style="display:none; margin-top: 20px; text-align: center;">
                <button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>
            </div>
            <div class="debug-panel" id="debugPanel"></div>
        `;
        
        const debugPanel = document.getElementById("debugPanel");
        if (debugPanel) {
            debugPanel.innerHTML = debugLogs.map(log => `<div>✨ ${log}</div>`).join('');
        }
    }
    
    // Check answer
    function checkAnswer(selected) {
        const q = loadedQuestions[currentIndex];
        const correct = q.answer;
        
        const buttons = document.querySelectorAll('.option-item');
        buttons.forEach(btn => btn.disabled = true);
        
        buttons.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${correct}'`)) {
                btn.classList.add('correct');
            }
        });
        
        if (selected === correct) {
            const selectedBtn = Array.from(buttons).find(btn => 
                btn.getAttribute('onclick').includes(`'${selected}'`)
            );
            if (selectedBtn) selectedBtn.classList.add('correct');
            score++;
            debug(`🎉 Correct! Score: ${score}/${currentIndex + 1}`);
        } else {
            const selectedBtn = Array.from(buttons).find(btn => 
                btn.getAttribute('onclick').includes(`'${selected}'`)
            );
            if (selectedBtn) selectedBtn.classList.add('incorrect');
            debug(`💡 The correct answer was ${correct}`);
        }
        
        document.getElementById('nextBtn').style.display = 'block';
    }
    
    // Next question
    function nextQuestion() {
        currentIndex++;
        if (currentIndex < loadedQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }
    
    // Show results
    function showResults() {
        const percent = Math.round((score / loadedQuestions.length) * 100);
        let gradeMessage = "";
        let gradeColor = "";
        let emoji = "";
        
        if (percent >= 80) {
            gradeMessage = "Outstanding Performance! You're a Star! 🌟";
            gradeColor = "#11998e";
            emoji = "🏆";
        } else if (percent >= 60) {
            gradeMessage = "Great Job! Keep Shining! ⭐";
            gradeColor = "#667eea";
            emoji = "🎉";
        } else if (percent >= 40) {
            gradeMessage = "Good Effort! Practice Makes Perfect! 💪";
            gradeColor = "#f39c12";
            emoji = "📚";
        } else {
            gradeMessage = "Keep Learning! You'll Crush It Next Time! 🚀";
            gradeColor = "#eb3349";
            emoji = "💪";
        }
        
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <div style="font-size: 5rem;">${emoji}</div>
                <h2 style="color: #667eea; margin: 20px 0;">Quiz Complete!</h2>
                <div style="font-size: 4rem; color: ${gradeColor}; margin: 20px; font-weight: bold;">
                    ${percent}%
                </div>
                <p style="font-size: 1.3rem; margin: 10px 0;">
                    Score: ${score} out of ${loadedQuestions.length}
                </p>
                <p style="margin: 20px 0; color: #718096; font-size: 1.1rem;">${gradeMessage}</p>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                    <button class="btn btn-success" onclick="startQuiz()" style="font-size: 1.1rem;">
                        🔄 Play Again
                    </button>
                </div>
            </div>
            <div class="debug-panel" id="debugPanel"></div>
        `;
        
        const debugPanel = document.getElementById("debugPanel");
        if (debugPanel) {
            debugPanel.innerHTML = debugLogs.map(log => `<div>✨ ${log}</div>`).join('');
        }
        
        debug(`🏁 Quiz completed! Final score: ${score}/${loadedQuestions.length} (${percent}%)`);
    }
    
    // Initialize
    async function init() {
        debug("🎯 Welcome to Quiz Arena!");
        const initialized = await initFirebase();
        
        if (initialized) {
            const hasQuestions = await loadQuestions();
            if (hasQuestions && loadedQuestions.length > 0) {
                const interfaceDiv = document.getElementById("quizInterface");
                interfaceDiv.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin: 20px;">🎯</div>
                        <h2 style="color: #667eea; margin: 20px 0;">Ready to Challenge Yourself?</h2>
                        <p style="margin: 15px 0; color: #718096; font-size: 1.1rem;">
                            📚 ${loadedQuestions.length} exciting questions await!
                        </p>
                        <button class="btn btn-success" onclick="startQuiz()" style="font-size: 1.2rem; padding: 15px 40px; margin-top: 20px;">
                            🚀 Start Quiz Now
                        </button>
                        <p style="margin-top: 20px; font-size: 12px; color: #a0aec0;">
                            ✨ Test your knowledge and earn amazing scores ✨
                        </p>
                    </div>
                    <div class="debug-panel" id="debugPanel"></div>
                `;
            }
        }
    }
    
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
