<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy Classroom</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI;
}

body{
    background:#eef2f7;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:25px;
    text-align:center;
}

/* DASHBOARD */
.dashboard{
    max-width:1000px;
    margin:20px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.02);
}

.card h2{
    color:#333;
}

.card p{
    color:#777;
}

/* QUIZ AREA */
.quiz-box{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* QUESTION */
.question{
    font-weight:bold;
    margin:10px 0;
}

/* OPTION */
.option{
    background:#f1f1f1;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    cursor:pointer;
}

.option.correct{background:#c8f7c5;}
.option.wrong{background:#ffcccc;}

.nav-btn{
    margin:10px 5px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.next{background:#667eea;color:white;}
.prev{background:#555;color:white;}
.home{background:#000;color:white;}

.pagination{
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎓 Ernest Embassy Classroom</h1>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

    <div class="card" onclick="openFreeTest()">
        <h2>🟢 Free Test Mode</h2>
        <p>Practice with 5 questions per page</p>
    </div>

    <div class="card" onclick="openChallenge()">
        <h2>🔴 Challenge Quiz (₦100)</h2>
        <p>Win ₦10,000 monthly draw</p>
    </div>

    <div class="card">
        <h2>📚 Educational Resources</h2>
        <p>Study notes and explanations (coming soon)</p>
    </div>

</div>

<!-- FREE TEST -->
<div id="freeTest" class="quiz-box" style="display:none;"></div>

<!-- CHALLENGE -->
<div id="challenge" style="display:none;" class="quiz-box">
    <h2>Challenge Quiz Coming Soon...</h2>
</div>

<script>

/* SAMPLE QUESTIONS (replace with JSON later) */
const questions = [
    {q:"What is a computer?", o:["A cooking tool","A machine that processes data","A car","A pen"], a:1, exp:"A computer processes data."},
    {q:"CPU stands for?", o:["Central Processing Unit","Car Power Unit","Control Panel","None"], a:0, exp:"CPU is the brain of computer."},
    {q:"Keyboard is?", o:["Output","Input","Software","Game"], a:1, exp:"Keyboard is input device."},
    {q:"RAM is?", o:["Storage","Temporary memory","Printer","Screen"], a:1, exp:"RAM is temporary memory."},
    {q:"Monitor is?", o:["Input","Output","CPU","Cable"], a:1, exp:"Monitor shows output."},
    {q:"Mouse is?", o:["Input","Output","Power","Memory"], a:0, exp:"Mouse is input device."},
    {q:"Data becomes?", o:["Information","Noise","Light","Sound"], a:0, exp:"Processed data is information."}
];

let page = 0;
const perPage = 5;

/* DASHBOARD NAV */
function openFreeTest(){
    document.getElementById("dashboard").style.display="none";
    document.getElementById("freeTest").style.display="block";
    renderPage();
}

function openChallenge(){
    alert("Challenge quiz loading (₦100 system)");
}

/* FREE TEST RENDER */
function renderPage(){

    let start = page * perPage;
    let end = start + perPage;

    let html = "";

    let slice = questions.slice(start,end);

    slice.forEach((q,i)=>{

        html += `<div>
        <div class="question">${q.q}</div>`;

        q.o.forEach((opt,idx)=>{
            html += `<div class="option"
            onclick="check(this,${idx},${q.a},'${q.exp}')">${opt}</div>`;
        });

        html += `<div class="ex"></div></div><hr>`;
    });

    html += `
    <div class="pagination">
        <button class="nav-btn prev" onclick="prevPage()">⬅ Prev</button>
        <button class="nav-btn next" onclick="nextPage()">Next ➡</button>
        <button class="nav-btn home" onclick="backHome()">🏠 Home</button>
    </div>`;

    document.getElementById("freeTest").innerHTML = html;
}

/* CHECK ANSWER */
function check(el,selected,correct,exp){

    if(selected===correct){
        el.classList.add("correct");
    }else{
        el.classList.add("wrong");
    }

    let parent = el.parentElement;
    let all = parent.querySelectorAll(".option");

    all.forEach((o,i)=>{
        if(i===correct){
            o.classList.add("correct");
        }
    });

    let ex = parent.querySelector(".ex");
    ex.innerHTML = `<p>📖 ${exp}</p>`;
}

/* PAGINATION */
function nextPage(){
    if((page+1)*perPage < questions.length){
        page++;
        renderPage();
    }
}

function prevPage(){
    if(page>0){
        page--;
        renderPage();
    }
}

/* BACK HOME */
function backHome(){
    document.getElementById("dashboard").style.display="block";
    document.getElementById("freeTest").style.display="none";
}

</script>

</body>
</html>
