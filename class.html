<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ernest Embassy LMS Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
text-align:center;
position:relative;
}

.header h1{
margin:0;
font-size:24px;
}

.user-info{
margin-top:5px;
font-size:14px;
}

/* LOGOUT */
.logout-btn{
position:absolute;
right:20px;
top:20px;
background:black;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* DASHBOARD */
.dashboard{
max-width:1000px;
margin:20px auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

.card h2{
margin:0;
color:#333;
}

.card p{
color:#777;
}

/* SCORE BOX */
.score-box{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:20px;
text-align:center;
font-size:18px;
font-weight:bold;
color:#667eea;
}
</style>
</head>

<body>

<div class="header">
<h1>🎓 Ernest Embassy LMS</h1>
<div class="user-info" id="userInfo">Loading user...</div>

<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

<div class="score-box">
Score: <span id="score">0</span>
</div>

<div class="card" onclick="openFreeTest()">
<h2>🟢 Free Test Mode</h2>
<p>Practice with 5 questions per page</p>
</div>

<div class="card">
<h2>📚 Educational Resources</h2>
<p>Study notes and learning materials (coming soon)</p>
</div>

<div class="card">
<h2>🔴 Paid Quiz (₦100)</h2>
<p>Compete for ₦10,000 monthly reward</p>
</div>

</div>

<script>

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   AUTH PROTECTION
========================= */
auth.onAuthStateChanged(async (user)=>{

if(!user){
window.location.href = "login.html";
return;
}

/* LOAD USER PROFILE */
let doc = await db.collection("users").doc(user.uid).get();

if(doc.exists){

let data = doc.data();

/* SHOW USER INFO */
document.getElementById("userInfo").innerHTML =
`Welcome, <b>${data.name}</b>`;

/* SHOW SCORE */
document.getElementById("score").innerText =
data.score || 0;

}

});

/* =========================
   LOGOUT
========================= */
function logout(){
auth.signOut().then(()=>{
window.location.href = "login.html";
});
}

/* =========================
   NAVIGATION
========================= */
function openFreeTest(){
window.location.href = "test-quiz.html";
}

</script>

</body>
</html>
