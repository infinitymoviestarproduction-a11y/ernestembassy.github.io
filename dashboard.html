<script>
/* =========================
   LOAD USER SESSION
========================= */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "login.html";
}

/* =========================
   DISPLAY USER NAME
========================= */
document.getElementById("userName").innerText =
    user?.name || "Student";

/* =========================
   SHOW ADMIN BUTTON (IF ADMIN)
========================= */
if (user.role === "admin") {
    const nav = document.querySelector(".user-area");

    const adminBtn = document.createElement("button");
    adminBtn.innerText = "Admin Panel";
    adminBtn.style.background = "#28a745";
    adminBtn.style.color = "white";
    adminBtn.style.border = "none";
    adminBtn.style.padding = "10px 18px";
    adminBtn.style.borderRadius = "8px";
    adminBtn.style.cursor = "pointer";

    adminBtn.onclick = () => {
        window.location.href = "admin.html";
    };

    nav.insertBefore(adminBtn, nav.children[0]);
}

/* =========================
   LOGOUT FUNCTION
========================= */
function logout() {
    localStorage.removeItem("currentUser");
    localStorage.removeItem("userLoggedIn");

    // optional firebase logout safety (if auth exists)
    if (window.firebase && firebase.auth) {
        firebase.auth().signOut();
    }

    window.location.href = "login.html";
}
</script>
