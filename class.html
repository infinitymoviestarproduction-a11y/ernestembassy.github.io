<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy Classroom - Quiz Arena</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #eef2f7;
    color: #333;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 30px;
    text-align: center;
}

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* SUBJECT SELECT */
select, button {
    padding: 12px;
    margin: 10px 0;
    width: 100%;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

button {
    background: #667eea;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #5a67d8;
}

/* QUIZ BOX */
.quiz-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* QUESTION */
.question {
    font-size: 18px;
    margin-bottom: 15px;
    font-weight: bold;
}

/* OPTIONS */
.option {
    background: #f4f4f4;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.option:hover {
    background: #e0e7ff;
}

/* CORRECT / WRONG */
.correct {
    background: #c6f6d5 !important;
}

.wrong {
    background: #fed7d7 !important;
}

/* SCORE */
.score {
    font-size: 20px;
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎓 Ernest Embassy Quiz Arena</h1>
    <p>Select a subject and start learning</p>
</div>

<div class="container">

    <select id="subjectSelect">
        <option value="">-- Select Subject --</option>
    </select>

    <button onclick="startQuiz()">Start Quiz</button>

    <div id="quizBox" class="quiz-box" style="display:none;">
        <div id="question" class="question"></div>
        <div id="options"></div>
        <div id="score" class="score"></div>
        <button onclick="nextQuestion()">Next</button>
    </div>

</div>

<script>

let coursesData = {};
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let selectedSubject = "";

/* LOAD JSON */
fetch('courses.json')
.then(res => res.json())
.then(data => {
    coursesData = data;

    const select = document.getElementById("subjectSelect");

    data.subjects.forEach(sub => {
        let option = document.createElement("option");
        option.value = sub.id;
        option.textContent = `${sub.icon} ${sub.name} (${sub.level})`;
        select.appendChild(option);
    });
});

/* START QUIZ */
function startQuiz() {

    selectedSubject = document.getElementById("subjectSelect").value;

    if (!selectedSubject) {
        alert("Please select a subject");
        return;
    }

    let subject = coursesData.subjects.find(s => s.id === selectedSubject);

    currentQuestions = subject.quizQuestions;
    currentIndex = 0;
    score = 0;

    document.getElementById("quizBox").style.display = "block";

    showQuestion();
}

/* SHOW QUESTION */
function showQuestion() {

    let q = currentQuestions[currentIndex];

    document.getElementById("question").innerText =
        (currentIndex + 1) + ". " + q.text;

    let optionsHtml = "";

    q.options.forEach(opt => {
        optionsHtml += `
            <div class="option" onclick="selectAnswer(this, '${opt}', '${q.correct}')">
                ${opt}
            </div>
        `;
    });

    document.getElementById("options").innerHTML = optionsHtml;

    document.getElementById("score").innerText =
        "Score: " + score;
}

/* SELECT ANSWER */
function selectAnswer(el, selected, correct) {

    let options = document.querySelectorAll(".option");

    options.forEach(opt => opt.style.pointerEvents = "none");

    if (selected === correct) {
        el.classList.add("correct");
        score++;
    } else {
        el.classList.add("wrong");
    }

    document.getElementById("score").innerText =
        "Score: " + score;
}

/* NEXT */
function nextQuestion() {

    currentIndex++;

    if (currentIndex >= currentQuestions.length) {
        document.getElementById("quizBox").innerHTML = `
            <h2>🎉 Quiz Completed</h2>
            <p>Your Final Score: ${score} / ${currentQuestions.length}</p>
            <button onclick="location.reload()">Restart</button>
        `;
        return;
    }

    showQuestion();
}

</script>

</body>
</html>
