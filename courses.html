<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Ernest Embassy LMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .nav-links a {
            color: #4a5568;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-links a:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 1.1rem;
            opacity: 0.95;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .course-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .course-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .course-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }
        .course-description {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-start:hover {
            transform: scale(1.05);
        }
        .home-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 24px;
            border: none;
        }
        .home-button:hover {
            transform: scale(1.1);
        }
        .badge-new {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
        }
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; }
            .courses-grid { grid-template-columns: 1fr; }
            .home-button { width: 50px; height: 50px; font-size: 20px; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo" onclick="goToPage('index.html')">⚡ Ernest Embassy LMS</div>
            <div class="nav-links">
                <a href="#" onclick="goToPage('dashboard.html')">Dashboard</a>
                <a href="#" onclick="goToPage('courses.html')">Courses</a>
                <a href="#" onclick="goToPage('resources.html')">Resources</a>
                <a href="#" onclick="goToPage('education.html')">🎓 Education Hub</a>
            </div>
        </div>
    </nav>
    
    <div class="hero">
        <h1>📚 Our Courses</h1>
        <p>Select a subject to start learning and testing your knowledge</p>
    </div>
    
    <div class="container">
        <div class="courses-grid" id="coursesGrid">
            <!-- Courses will be loaded dynamically -->
        </div>
    </div>
    
    <button class="home-button" onclick="goToPage('index.html')">🏠</button>
    
    <script>
        function goToPage(page) {
            window.location.href = page;
        }
        
        function startQuiz(subject) {
            window.location.href = `class.html?subject=${subject}`;
        }
        
        // UPDATED COURSES ARRAY: ADDED BIOLOGY AND LITERATURE
        const courses = [
            { 
                id: 'physics', 
                name: 'Physics', 
                icon: '⚛️', 
                description: 'Explore the laws of nature, motion, energy, electricity, and modern physics concepts.',
                featured: true
            },
            { 
                id: 'chemistry', 
                name: 'Chemistry', 
                icon: '🧪', 
                description: 'Study atomic structure, chemical bonding, organic chemistry, reactions, and periodic table.',
                featured: true
            },
            { 
                id: 'mathematics', 
                name: 'Mathematics', 
                icon: '📐', 
                description: 'Master algebra, geometry, calculus, statistics, and trigonometry for exams.',
                featured: true
            },
            { 
                id: 'biology', 
                name: 'Biology', 
                icon: '🔬', 
                description: 'Learn about cells, genetics, human anatomy, ecology, plants, and life processes.',
                featured: true,
                isNew: true
            },
            { 
                id: 'english', 
                name: 'English Language', 
                icon: '📖', 
                description: 'Improve grammar, comprehension, essay writing, and verbal reasoning skills.',
                featured: true
            },
            { 
                id: 'literature', 
                name: 'Literature-in-English', 
                icon: '📚', 
                description: 'Explore prose, drama, poetry, literary criticism, and African literary works.',
                featured: true,
                isNew: true
            },
            { 
                id: 'digital-technology', 
                name: 'Digital Technology', 
                icon: '💻', 
                description: 'Learn about computers, networks, programming basics, and ICT concepts.',
                featured: false
            },
            { 
                id: 'igbo', 
                name: 'Igbo Language', 
                icon: '🗣️', 
                description: 'Study Igbo language, grammar, oral literature, proverbs, and cultural heritage.',
                featured: false
            }
        ];
        
        // Sort courses: featured first, then alphabetically
        const sortedCourses = [...courses].sort((a, b) => {
            if (a.featured && !b.featured) return -1;
            if (!a.featured && b.featured) return 1;
            return a.name.localeCompare(b.name);
        });
        
        function loadCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = sortedCourses.map(course => `
                <div class="course-card" onclick="startQuiz('${course.id}')">
                    <div class="course-icon">${course.icon}</div>
                    <div class="course-title">
                        ${course.name}
                        ${course.isNew ? '<span class="badge-new">NEW</span>' : ''}
                    </div>
                    <div class="course-description">${course.description}</div>
                    <button class="btn-start">Start Quiz →</button>
                </div>
            `).join('');
        }
        
        loadCourses();
    </script>
</body>
</html>
