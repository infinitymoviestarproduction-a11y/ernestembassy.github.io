<script>
/* =========================================
   🔐 LMS LOGIN PROTECTION
========================================= */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "login.html";
}

/* =========================================
   DISPLAY USER
========================================= */
document.getElementById("userName").innerText =
    user.name || "Student";

/* =========================================
   PROFESSIONAL COURSE DATA
========================================= */
const course = {
    title: "Digital Technology SS1",

    lessons: [

        {
            title: "Introduction to Computer",

            content: `
A computer is an electronic device that accepts data, processes it, stores it, and produces useful information.

Computers are used in schools, hospitals, banks, offices, airports, and homes.

Characteristics of a Computer:
1. Speed
2. Accuracy
3. Storage Capacity
4. Automation
5. Reliability

Types of Computers:
- Desktop Computers
- Laptop Computers
- Tablets
- Smartphones
- Supercomputers

Uses of Computers:
- Education
- Communication
- Banking
- Entertainment
- Medical Services
- Security Operations

A computer system consists of hardware and software working together.
            `
        },

        {
            title: "Input Devices",

            content: `
Input devices are hardware components used to enter data into a computer system.

Examples of Input Devices:
1. Keyboard
2. Mouse
3. Scanner
4. Microphone
5. Webcam
6. Joystick
7. Light Pen

Functions of Input Devices:
- Enter text
- Control movement
- Capture sound
- Capture images
- Scan documents

Keyboard:
Used for typing letters, numbers, and commands.

Mouse:
Used for clicking, dragging, selecting, and navigating.

Scanner:
Converts paper documents into digital format.
            `
        },

        {
            title: "Output Devices",

            content: `
Output devices are hardware devices that display processed information to users.

Examples:
1. Monitor
2. Printer
3. Speaker
4. Projector
5. Plotter

Monitor:
Displays visual information on screen.

Printer:
Produces hard copies on paper.

Speakers:
Produce sound output.

Projector:
Displays computer output on large screens.

Soft Copy:
Information displayed electronically.

Hard Copy:
Information printed on paper.
            `
        },

        {
            title: "Storage Devices",

            content: `
Storage devices are used to save data and information for future use.

Types of Storage:
1. Primary Storage
2. Secondary Storage

Primary Storage:
- RAM
- ROM

Secondary Storage:
- Hard Disk
- Flash Drive
- CD/DVD
- Memory Card

RAM:
Temporary memory used while computer is running.

Permanent memory containing startup instructions.

Hard Disk:
Stores operating systems, files, and applications.

Flash Drive:
Portable storage device connected through USB.
            `
        }

    ]
};

/* =========================================
   COURSE PLAYER
========================================= */
let currentIndex = 0;

function loadLessons() {

    const list = document.getElementById("lessonList");

    list.innerHTML = "";

    course.lessons.forEach((lesson, index) => {

        list.innerHTML += `
            <div class="lesson"
                 onclick="openLesson(${index})">

                ${index + 1}. ${lesson.title}

            </div>
        `;
    });
}

/* =========================================
   OPEN LESSON
========================================= */
function openLesson(index) {

    currentIndex = index;

    document.getElementById("lessonTitle").innerText =
        course.lessons[index].title;

    document.getElementById("lessonContent").innerText =
        course.lessons[index].content;

    highlightLesson(index);

    saveProgress(index);
}

/* =========================================
   ACTIVE LESSON HIGHLIGHT
========================================= */
function highlightLesson(index){

    const items = document.querySelectorAll(".lesson");

    items.forEach((el, i) => {
        el.classList.toggle("active", i === index);
    });
}

/* =========================================
   NEXT LESSON
========================================= */
function nextLesson() {

    if (currentIndex < course.lessons.length - 1) {

        currentIndex++;

        openLesson(currentIndex);

    } else {

        alert("🎉 Congratulations! Course Completed.");
    }
}

/* =========================================
   SAVE LEARNING PROGRESS
========================================= */
function saveProgress(index){

    localStorage.setItem(
        "digitalTechProgress",
        index
    );
}

/* =========================================
   LOAD SAVED PROGRESS
========================================= */
function loadSavedProgress(){

    const saved =
        localStorage.getItem("digitalTechProgress");

    if(saved !== null){

        currentIndex = parseInt(saved);

    }

    openLesson(currentIndex);
}

/* =========================================
   LOGOUT
========================================= */
function logout(){

    localStorage.removeItem("currentUser");

    window.location.href = "login.html";
}

/* =========================================
   INITIALIZE LMS
========================================= */
loadLessons();
loadSavedProgress();

</script>
