<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Ernest Embassy LMS</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <script src="auth.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        nav { background: #000; padding: 1rem 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #ffd700; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.3rem; font-weight: bold; color: #ffd700; text-decoration: none; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 15px; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.85rem; }
        .nav-links a:hover { color: #ffd700; }
        .hero { background: linear-gradient(135deg, #111 0%, #1c1a12 100%); border-bottom: 1px solid #222; text-align: center; padding: 50px 20px; }
        .hero h1 { font-size: 2rem; color: #ffd700; margin-bottom: 15px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .quiz-section { background: #111; border: 1px solid #222; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .quiz-header h2 { font-size: 1.6rem; color: #ffd700; margin-bottom: 10px; }
        
        /* Payment Modal Specific Styles */
        .payment-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .payment-content { background: #151515; border: 2px solid #ffd700; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        .payment-amount { font-size: 2.5rem; color: #28a745; margin: 15px 0; font-weight: bold; }
        .payment-details { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; font-size: 0.9rem; line-height: 1.6; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-secondary { background: #444; color: white; }
        .btn-secondary:hover { background: #555; }
        
        .status-message { text-align: center; font-size: 1.2rem; color: #aaa; padding: 40px 0; }
        .loading-spinner { border: 4px solid rgba(255,215,0,0.1); border-top: 4px solid #ffd700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="dashboard.html" class="logo">⚡ Ernest Embassy LMS</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="resources.html">Resources</a>
        </div>
    </div>
</nav>

<div class="hero">
    <h1 id="quizTitle">Live Database Challenge Arena</h1>
    <p id="quizSubtitle">Complete consecutive stages to top the leaderboard metrics</p>
</div>

<div class="container">
    <div class="quiz-section" id="quizInterface">
        <div class="status-message">
            <div class="loading-spinner"></div>
            Syncing collection files with server database...
        </div>
    </div>
</div>

<script>
    // Payment verified info mapping 
    const PAYMENT_DETAILS = {
        opayNumber: "08032607809",
        bankName: "First Bank Plc",
        bankAccountNumber: "3113254386",
        accountName: "Damian Anielozie Okafor"
    };

    // Global properties to hold active setup
    let currentSubjectId = "";
    let currentQuizMode = "free";
    let loadedQuestions = [];

    // Parse URL values
    function getUrlParameters() {
        const params = new URLSearchParams(window.location.search);
        currentSubjectId = params.get('subject') || 'mathematics-ss1';
        currentQuizMode = params.get('mode') || 'free';
    }

    // Convert keys to clean text layouts
    function formatSubjectTitle(id) {
        return id.split('-')
                 .map(word => word.toUpperCase() === 'SS1' ? 'SS1' : word.charAt(0).toUpperCase() + word.slice(1))
                 .join(' ');
    }

    // Initialize Page Flow
    async function initQuizArena() {
        getUrlParameters();
        
        // Update headers dynamically
        const titleText = formatSubjectTitle(currentSubjectId);
        document.getElementById("quizTitle").innerText = `${titleText} Challenge Arena`;
        
        if (currentQuizMode === "paid") {
            showPremiumGate(titleText);
        } else {
            await fetchQuestionsFromFirestore();
        }
    }

    // Render Gate for Paid Quizzes
    function showPremiumGate(title) {
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div class="quiz-header">
                <h2>🔒 Premium ${title} Entry</h2>
                <p style="margin-top:10px; color:#aaa; margin-bottom: 25px;">This assessment tracks dynamic score updates directly to your profile records.</p>
                <button class="btn btn-success" style="font-size:1.1rem; padding:15px;" onclick="showPaymentModal()">🎟️ Unlock Quiz Arena (₦100)</button>
            </div>
        `;
    }

    // Fetch matching JSON assets out of Firestore
    async function fetchQuestionsFromFirestore() {
        const interfaceDiv = document.getElementById("quizInterface");
        
        try {
            // Target the specific document uploaded by uploader
            const docRef = db.collection("questions").doc(currentSubjectId);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                showComingSoon();
                return;
            }

            const data = docSnap.data();
            loadedQuestions = data.questions || [];

            if (loadedQuestions.length === 0) {
                showComingSoon();
                return;
            }

            // Success: Build your quiz start terminal display here
            interfaceDiv.innerHTML = `
                <div class="quiz-header">
                    <h2>📝 Practice Mode Ready</h2>
                    <p style="margin-top:10px; color:#aaa; margin-bottom: 20px;">
                        Subject contains <strong>${loadedQuestions.length}</strong> active curriculum validation questions.
                    </p>
                    <button class="btn btn-success" onclick="startQuizEngine()">🚀 Start Countdown Practice</button>
                </div>
            `;

        } catch (error) {
            console.error("Firestore retrieval error: ", error);
            interfaceDiv.innerHTML = `<div class="status-message" style="color: #ff4d4d;">⚠️ Server sync failed. Please check network connection logs.</div>`;
        }
    }

    function showComingSoon() {
        document.getElementById("quizInterface").innerHTML = `
            <div class="status-message">
                <h2>📖 Questions Coming Soon</h2>
                <p style="font-size: 0.95rem; margin-top: 10px; color: #777;">The academic materials for this framework tier are currently processing.</p>
                <a href="dashboard.html" class="btn btn-secondary" style="display: inline-block; width: auto; margin-top: 20px; text-decoration: none; text-align: center;">Back to Dashboard</a>
            </div>
        `;
    }

    function startQuizEngine() {
        alert(`Initializing engine array with ${loadedQuestions.length} entries! Replace this alert with your active question-by-question countdown loop logic.`);
    }

    /* ====================================
       PAYMENT ENGINE INFRASTRUCTURE
    ==================================== */
    function showPaymentModal() {
        const modal = document.createElement('div');
        modal.className = 'payment-modal';
        modal.innerHTML = `
            <div class="payment-content">
                <h2>💰 Challenge Quiz Payment</h2>
                <div class="payment-amount">₦100</div>
                <div class="payment-details">
                    <p><strong>📱 Opay / Palmpay</strong><br>Number: <strong>${PAYMENT_DETAILS.opayNumber}</strong></p>
                    <p><strong>🏦 ${PAYMENT_DETAILS.bankName}</strong><br>Account: <strong>${PAYMENT_DETAILS.bankAccountNumber}</strong></p>
                    <p><strong>Name:</strong> ${PAYMENT_DETAILS.accountName}</p>
                </div>
                <button class="btn btn-success" onclick="processPayment()">✅ I Have Paid</button>
                <button class="btn btn-secondary" onclick="this.closest('.payment-modal').remove()">Cancel</button>
                <p style="margin-top: 15px; font-size: 0.75rem; color: #aaa;">After payment, click "I Have Paid" to activate your quiz.</p>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function processPayment() {
        alert("Thank you! Your payment verification notification has been sent to processing.");
    }

    // Run when DOM structure binds safely
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initQuizArena);
    } else {
        initQuizArena();
    }
</script>
</body>
</html>
