<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Ernest Embassy Digital Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: #333;
        }

        nav {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 0.65rem;
            color: rgba(255, 215, 0, 0.8);
            display: block;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 0;
            font-size: 0.85rem;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .welcome-card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1a1a2e;
        }

        .appointments-list {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .appointment-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .appointment-item:last-child {
            border-bottom: none;
        }

        .appointment-info h4 {
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .appointment-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .appointment-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-upcoming {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .nav-links {
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .appointment-item {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="logo">
            <span class="logo-icon">👤</span>
            <div>
                <span class="logo-text">Ernest Embassy</span>
                <span class="logo-sub">Digital Solutions</span>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="about.html">📖 About</a>
            <a href="services.html">⚙️ Services</a>
            <a href="webdev.html">💻 Web Dev</a>
            <a href="visa.html">✈️ Visa</a>
            <a href="movie.html">🎬 Movie Studio</a>
            <a href="portfolio.html">🎨 Portfolio</a>
            <a href="teaching.html">📚 Teaching</a>
            <a href="tutoring.html">💻 Tutoring</a>
            <a href="education.html">🎓 Education</a>
            <a href="booking.html">📅 Book</a>
            <a href="contact.html">📞 Contact</a>
            <a href="dashboard.html">👤 Dashboard</a>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="dashboardContent">
        <!-- Content loaded dynamically -->
    </div>
</div>

<footer>
    <div class="container">
        <p>&copy; 2026 Ernest Embassy Digital Solutions. All rights reserved.</p>
    </div>
</footer>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    // Your Firebase configuration - REPLACE WITH YOUR ACTUAL CONFIG
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // Check authentication state
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        
        currentUser = user;
        
        // Get user data from Firestore
        const userDoc = await db.collection('users').doc(user.uid).get();
        const userData = userDoc.data();
        
        displayDashboard(user, userData);
    });

    function displayDashboard(user, userData) {
        const dashboardDiv = document.getElementById('dashboardContent');
        
        dashboardDiv.innerHTML = `
            <div class="welcome-card">
                <h1>Welcome back, ${userData?.fullName || user.displayName || 'Valued Client'}!</h1>
                <p>Manage your appointments and account settings from here.</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="upcomingCount">0</div>
                    <div class="stat-label">Upcoming Appointments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed Sessions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total Appointments</div>
                </div>
            </div>
            
            <h2 class="section-title">📅 My Appointments</h2>
            <div class="appointments-list" id="appointmentsList">
                <div style="padding: 40px; text-align: center; color: #666;">Loading your appointments...</div>
            </div>
        `;
        
        loadAppointments();
    }
    
    async function loadAppointments() {
        // This is sample data. In production, you would fetch from your booking system
        // For now, showing sample appointments
        const sampleAppointments = [
            {
                id: 1,
                service: 'Visa Consultation',
                date: '2026-05-25',
                time: '10:00 AM',
                status: 'upcoming',
                meetingLink: 'https://meet.google.com/visa-ernest'
            },
            {
                id: 2,
                service: 'Web Development Consultation',
                date: '2026-05-20',
                time: '2:00 PM',
                status: 'completed',
                meetingLink: 'https://meet.google.com/webdev-ernest'
            }
        ];
        
        const upcomingCount = sampleAppointments.filter(a => a.status === 'upcoming').length;
        const completedCount = sampleAppointments.filter(a => a.status === 'completed').length;
        
        document.getElementById('upcomingCount').innerText = upcomingCount;
        document.getElementById('completedCount').innerText = completedCount;
        document.getElementById('totalCount').innerText = sampleAppointments.length;
        
        const appointmentsList = document.getElementById('appointmentsList');
        
        if (sampleAppointments.length === 0) {
            appointmentsList.innerHTML = '<div style="padding: 40px; text-align: center; color: #666;">No appointments yet. <a href="booking.html">Book your first appointment</a></div>';
            return;
        }
        
        appointmentsList.innerHTML = sampleAppointments.map(app => `
            <div class="appointment-item">
                <div class="appointment-info">
                    <h4>${app.service}</h4>
                    <p>📅 ${app.date} | ⏰ ${app.time}</p>
                    ${app.meetingLink ? `<p>🔗 <a href="${app.meetingLink}" target="_blank">Join Meeting</a></p>` : ''}
                </div>
                <span class="appointment-status status-${app.status}">${app.status.toUpperCase()}</span>
            </div>
        `).join('');
    }

    function logout() {
        auth.signOut().then(() => {
            window.location.href = 'login.html';
        });
    }
</script>

</body>
</html>
