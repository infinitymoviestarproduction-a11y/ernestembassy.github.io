<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy Classroom</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI;
}

body{
    background:#eef2f7;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:25px;
    text-align:center;
}

/* DASHBOARD */
.dashboard{
    max-width:1000px;
    margin:20px auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.02);
}

.quiz-box{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
}

/* QUESTIONS */
.question{
    font-weight:bold;
    margin:10px 0;
}

.option{
    background:#f1f1f1;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    cursor:pointer;
}

.option.correct{background:#c8f7c5;}
.option.wrong{background:#ffcccc;}

.nav-btn{
    margin:10px 5px;
    padding:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.next{background:#667eea;color:white;}
.prev{background:#555;color:white;}
.home{background:#000;color:white;}

.pagination{
    text-align:center;
    margin-top:10px;
}

/* RESOURCES */
pre{
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎓 Ernest Embassy Classroom</h1>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

    <div class="card" onclick="openResources()">
        <h2>📚 Educational Resources</h2>
        <p>Subject notes, explanations & downloads</p>
    </div>

    <div class="card" onclick="openFreeTest()">
        <h2>🟢 Free Test Mode</h2>
        <p>Practice with 5 questions per page</p>
    </div>

    <div class="card" onclick="openChallenge()">
        <h2>🔴 Challenge Quiz (₦100)</h2>
        <p>Win ₦10,000 monthly draw</p>
    </div>

</div>

<!-- FREE TEST -->
<div id="freeTest" class="quiz-box" style="display:none;"></div>

<!-- RESOURCES -->
<div id="resources" class="quiz-box" style="display:none;"></div>

<!-- CHALLENGE -->
<div id="challenge" class="quiz-box" style="display:none;"></div>

<script>

/* =========================
   NAVIGATION STATE
========================= */
let page = 0;
const perPage = 5;

/* =========================
   QUESTIONS (SAMPLE)
========================= */
const questions = [
    {q:"What is a computer?", o:["Cooking tool","Data processor","Car","Pen"], a:1, exp:"A computer processes data."},
    {q:"CPU stands for?", o:["Central Processing Unit","Car Unit","Control Panel","None"], a:0, exp:"CPU is brain of computer."},
    {q:"Keyboard is?", o:["Output","Input","Software","Game"], a:1, exp:"Keyboard is input device."},
    {q:"RAM is?", o:["Storage","Temporary memory","Printer","Screen"], a:1, exp:"RAM is temporary memory."},
    {q:"Monitor is?", o:["Input","Output","CPU","Cable"], a:1, exp:"Monitor shows output."},
    {q:"Mouse is?", o:["Input","Output","Power","Memory"], a:0, exp:"Mouse is input device."}
];

/* =========================
   DASHBOARD NAVIGATION
========================= */
function openFreeTest(){
    hideAll();
    document.getElementById("freeTest").style.display="block";
    renderPage();
}

function openResources(){
    hideAll();
    document.getElementById("resources").style.display="block";

    const data = {
        Math:[
            {t:"Basic Algebra",c:"Algebra uses letters like x.\nExample: x+2=5"},
            {t:"Fractions",c:"1/2 + 1/2 = 1"}
        ],
        English:[
            {t:"Noun",c:"Name of person, place or thing"},
            {t:"Verb",c:"Action words like run, eat"}
        ],
        ICT:[
            {t:"Computer",c:"Processes data into information"},
            {t:"Input Device",c:"Keyboard, Mouse"}
        ]
    };

    let html = "<h2>📚 Educational Resources</h2><button class='nav-btn home' onclick='backHome()'>🏠 Back</button>";

    for(let subject in data){
        html += `<h3 style="margin-top:15px;">${subject}</h3>`;

        data[subject].forEach((item,i)=>{
            html += `
            <div class="card">
                <strong onclick="toggle(this)">📖 ${item.t}</strong>
                <div style="display:none;margin-top:10px;">
                    <pre>${item.c}</pre>
                    <button class="nav-btn next" onclick="downloadNote('${item.t}','${item.c}')">📄 Download</button>
                </div>
            </div>`;
        });
    }

    document.getElementById("resources").innerHTML = html;
}

function openChallenge(){
    alert("Challenge Quiz Coming Soon (₦100 System)");
}

/* =========================
   FREE TEST SYSTEM
========================= */
function renderPage(){

    let start = page * perPage;
    let slice = questions.slice(start,start+perPage);

    let html = "";

    slice.forEach((q,i)=>{
        html += `<div class="question">${q.q}</div>`;

        q.o.forEach((opt,idx)=>{
            html += `<div class="option" onclick="check(this,${idx},${q.a},'${q.exp}')">${opt}</div>`;
        });

        html += `<hr>`;
    });

    html += `
    <div class="pagination">
        <button class="nav-btn prev" onclick="prev()">⬅ Prev</button>
        <button class="nav-btn next" onclick="next()">Next ➡</button>
        <button class="nav-btn home" onclick="backHome()">🏠 Home</button>
    </div>`;

    document.getElementById("freeTest").innerHTML = html;
}

function check(el,selected,correct,exp){

    let parent = el.parentElement;
    let options = parent.querySelectorAll(".option");

    options.forEach((o,i)=>{
        if(i===correct) o.classList.add("correct");
    });

    if(selected===correct){
        el.classList.add("correct");
    }else{
        el.classList.add("wrong");
    }

    parent.innerHTML += `<p>📖 ${exp}</p>`;
}

/* =========================
   NAVIGATION CONTROLS
========================= */
function next(){
    if((page+1)*perPage < questions.length){
        page++;
        renderPage();
    }
}

function prev(){
    if(page>0){
        page--;
        renderPage();
    }
}

/* =========================
   BACK HOME
========================= */
function backHome(){
    hideAll();
    document.getElementById("dashboard").style.display="block";
}

function hideAll(){
    document.getElementById("dashboard").style.display="none";
    document.getElementById("freeTest").style.display="none";
    document.getElementById("resources").style.display="none";
    document.getElementById("challenge").style.display="none";
}

/* =========================
   DOWNLOAD SYSTEM
========================= */
function downloadNote(title,content){
    const file = new Blob([title+"\n\n"+content],{type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = title+".txt";
    a.click();
}

function toggle(el){
    let next = el.nextElementSibling;
    next.style.display = next.style.display==="block"?"none":"block";
}

</script>

</body>
</html>
