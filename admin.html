<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{font-family:Segoe UI;background:#111;color:#fff;padding:20px}
input,textarea{width:100%;padding:10px;margin:5px 0}
button{padding:10px;margin:5px;cursor:pointer}
.card{background:#222;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<h1>⚙️ LMS Admin Panel</h1>

<h2>Add Question</h2>
<input id="q">
<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">
<input id="ans" placeholder="Correct index (0-3)">
<textarea id="exp" placeholder="Explanation"></textarea>

<button onclick="saveQ()">Save Question</button>

<h2>Add Lesson</h2>
<input id="title" placeholder="Title">
<textarea id="content" placeholder="Content"></textarea>
<button onclick="saveL()">Save Lesson</button>

<script>

/* QUESTIONS */
function saveQ(){
let db = JSON.parse(localStorage.getItem("questions_db")) || [];

db.push({
q: q.value,
o: [o1.value,o2.value,o3.value,o4.value],
a: parseInt(ans.value),
exp: exp.value
});

localStorage.setItem("questions_db",JSON.stringify(db));
alert("Question saved!");
}

/* LESSONS */
function saveL(){
let db = JSON.parse(localStorage.getItem("lessons_db")) || [];

db.push({
title:title.value,
content:content.value
});

localStorage.setItem("lessons_db",JSON.stringify(db));
alert("Lesson saved!");
}

</script>

</body>
</html>
