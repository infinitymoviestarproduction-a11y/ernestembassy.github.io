<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Ernest Embassy LMS</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; font-size: 3rem; margin-bottom: 10px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 30px; }
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .error { background: #fee; color: #eb3349; display: block; }
        .success { background: #e8f5e9; color: #11998e; display: block; }
        .nav-links { text-align: center; margin-top: 20px; }
        .nav-links a { color: #667eea; text-decoration: none; margin: 0 10px; }
        @media (max-width: 600px) {
            .row { grid-template-columns: 1fr; gap: 0; }
            .container { padding: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎓</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join the learning platform today</p>
        
        <input type="text" id="fullName" placeholder="Full Name *" required>
        <input type="email" id="email" placeholder="Email Address *" required>
        
        <div class="row">
            <input type="tel" id="phone" placeholder="Phone Number">
            <input type="text" id="school" placeholder="School / Institution">
        </div>
        
        <div class="row">
            <select id="level">
                <option value="">Select Level / Class</option>
                <option value="primary">Primary School</option>
                <option value="jss1">JSS 1</option>
                <option value="jss2">JSS 2</option>
                <option value="jss3">JSS 3</option>
                <option value="ss1">SS 1</option>
                <option value="ss2">SS 2</option>
                <option value="ss3">SS 3</option>
                <option value="undergraduate">Undergraduate</option>
                <option value="graduate">Graduate</option>
                <option value="other">Other</option>
            </select>
            <select id="referralSource">
                <option value="">How did you hear about us?</option>
                <option value="social_media">Social Media</option>
                <option value="friend">Friend / Family</option>
                <option value="search_engine">Search Engine</option>
                <option value="advertisement">Advertisement</option>
                <option value="school">School</option>
                <option value="other">Other</option>
            </select>
        </div>
        
        <input type="password" id="password" placeholder="Password (min 6 chars) *" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password *" required>
        
        <button class="btn" onclick="registerStudent()">📝 Create Account</button>
        
        <div class="nav-links">
            <a href="#" onclick="goToLogin()">Already have an account? Login here</a>
            <a href="index.html">🏠 Home</a>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
            authDomain: "ernest-embassy-lms.firebaseapp.com",
            projectId: "ernest-embassy-lms",
            storageBucket: "ernest-embassy-lms.firebasestorage.app",
            messagingSenderId: "204896421221",
            appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = msg;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
                msgDiv.className = 'message';
            }, 5000);
        }
        
        async function registerStudent() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const school = document.getElementById('school').value.trim();
            const level = document.getElementById('level').value;
            const referralSource = document.getElementById('referralSource').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!fullName || !email || !password) {
                showMessage('Please fill all required fields (*)', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            try {
                // Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Complete student document schema
                const studentData = {
                    uid: user.uid,
                    fullName: fullName,
                    email: email,
                    phone: phone || '',
                    school: school || '',
                    level: level || '',
                    referralSource: referralSource || '',
                    dateRegistered: firebase.firestore.FieldValue.serverTimestamp(),
                    accountStatus: "active",
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    loginCount: 1,
                    totalAttempts: 0,
                    totalPaid: 0,
                    quizScores: {},
                    paidQuizzes: [],
                    certificates: [],
                    isActive: true,
                    isPremium: false
                };
                
                await db.collection('students').doc(user.uid).set(studentData);
                
                // Log registration activity
                await db.collection('login_logs').add({
                    userId: user.uid,
                    userEmail: email,
                    userName: fullName,
                    loginTime: firebase.firestore.FieldValue.serverTimestamp(),
                    ipAddress: await getClientIP(),
                    deviceInfo: navigator.userAgent,
                    type: 'registration'
                });
                
                showMessage('✅ Registration successful! Redirecting to dashboard...', 'success');
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 2000);
                
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    showMessage('Email already registered. Please login instead.', 'error');
                } else if (error.code === 'auth/weak-password') {
                    showMessage('Password is too weak. Use at least 6 characters.', 'error');
                } else {
                    showMessage(error.message, 'error');
                }
            }
        }
        
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'IP not available';
            }
        }
        
        function goToLogin() {
            window.location.href = 'login.html';
        }
        
        auth.onAuthStateChanged(user => {
            if (user) {
                // Update login count when user is already logged in
                const studentRef = db.collection('students').doc(user.uid);
                studentRef.get().then(doc => {
                    if (doc.exists) {
                        const currentCount = doc.data().loginCount || 0;
                        studentRef.update({
                            lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                            loginCount: currentCount + 1
                        });
                    }
                });
                window.location.href = 'student-dashboard.html';
            }
        });
    </script>
</body>
</html>
