        function convertToJSON() {
            const text = document.getElementById('input').value;
            const lines = text.split('\n');
            const questions = [];
            
            let currentQuestion = null;
            let currentOptions = [];
            let currentAnswer = '';
            let currentNumber = 0;
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                // Match question number: "1." or "1."
                const qMatch = line.match(/^(\d+)\.\s+(.+)/);
                if (qMatch) {
                    // Save previous question
                    if (currentQuestion && currentOptions.length === 4) {
                        questions.push({
                            question: currentQuestion,
                            optionA: currentOptions[0] || "",
                            optionB: currentOptions[1] || "",
                            optionC: currentOptions[2] || "",
                            optionD: currentOptions[3] || "",
                            answer: currentAnswer,
                            explanation: explanations[currentNumber] || ""
                        });
                    }
                    currentNumber = parseInt(qMatch[1]);
                    currentQuestion = qMatch[2];
                    currentOptions = [];
                    currentAnswer = '';
                }
                
                // Match options: A) Text or A. Text
                const optMatch = line.match(/^([A-D])[\.\)]\s+(.+)/);
                if (optMatch && currentOptions.length < 4) {
                    currentOptions.push(optMatch[2]);
                }
                
                // Match answer: **Answer: X** or Answer: X
                let ansMatch = line.match(/\*\*Answer:\s*([A-D])/i);
                if (!ansMatch) ansMatch = line.match(/Answer:\s*([A-D])/i);
                if (ansMatch) {
                    currentAnswer = ansMatch[1].toUpperCase();
                }
            }
            
            // Save last question
            if (currentQuestion && currentOptions.length === 4) {
                questions.push({
                    question: currentQuestion,
                    optionA: currentOptions[0] || "",
                    optionB: currentOptions[1] || "",
                    optionC: currentOptions[2] || "",
                    optionD: currentOptions[3] || "",
                    answer: currentAnswer,
                    explanation: explanations[currentNumber] || ""
                });
            }
            
            if (questions.length === 0) {
                document.getElementById('output').innerHTML = '<span style="color: red;">❌ No questions found!</span>';
                return;
            }
            
            const jsonOutput = JSON.stringify(questions, null, 2);
            document.getElementById('output').innerHTML = `<pre style="white-space:pre-wrap; word-wrap:break-word;">${jsonOutput}</pre>`;
            document.getElementById('copyBtn').style.display = 'inline-block';
            window.currentJSON = jsonOutput;
            
            let hasExplanations = questions.filter(q => q.explanation).length;
            document.getElementById('output').innerHTML += `<br><span class="success">✅ Converted ${questions.length} questions! (${hasExplanations} have explanations)</span>`;
        }
        
        function copyJSON() {
            if (window.currentJSON) {
                navigator.clipboard.writeText(window.currentJSON);
                alert("✅ JSON copied! Now paste into Bulk Uploader.");
            }
