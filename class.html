<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Ernest Embassy LMS</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        
        nav { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #ffd700; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.3rem; font-weight: bold; color: #ffd700; text-decoration: none; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.85rem; padding: 8px 0; }
        .nav-links a:hover { color: #ffd700; }
        
        .hero { background: linear-gradient(135deg, #111 0%, #1c1a12 100%); border-bottom: 1px solid #222; text-align: center; padding: 50px 20px; }
        .hero h1 { font-size: 2rem; color: #ffd700; margin-bottom: 15px; }
        .hero p { color: #aaa; font-size: 1rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        .quiz-section { background: #111; border: 1px solid #222; padding: 30px; border-radius: 15px; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin: 5px; }
        .btn-success { background: #28a745; color: white; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-secondary { background: #444; color: white; }
        
        .status-message { text-align: center; font-size: 1.2rem; color: #aaa; padding: 40px 0; }
        .loading-spinner { border: 4px solid rgba(255,215,0,0.1); border-top: 4px solid #ffd700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .option-item { background: #1a1a1a; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; width: 100%; text-align: left; color: #ddd; }
        .option-item:hover { background: #222; border-color: #ffd700; }
        .option-item.correct { background: rgba(40, 167, 69, 0.3); border-color: #28a745; color: #28a745; }
        .option-item.incorrect { background: rgba(220, 53, 69, 0.3); border-color: #dc3545; color: #dc3545; }
        
        .question-text { font-size: 1.25rem; margin: 20px 0; color: #fff; }
        .quiz-meta { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #222; color: #888; }
        
        .error-box { background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; padding: 15px; border-radius: 8px; margin: 20px 0; color: #dc3545; }
        .success-box { background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; padding: 15px; border-radius: 8px; margin: 20px 0; color: #28a745; }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="#" class="logo">⚡ Ernest Embassy LMS</a>
        <div class="nav-links">
            <a href="#">Dashboard</a>
            <a href="#">Courses</a>
            <a href="#">Resources</a>
        </div>
    </div>
</nav>

<div class="hero">
    <h1 id="quizTitle">Quiz Challenge Arena</h1>
    <p id="quizSubtitle">Test your knowledge</p>
</div>

<div class="container">
    <div class="quiz-section" id="quizInterface">
        <div class="status-message">
            <div class="loading-spinner"></div>
            Connecting to Firebase...
            <div id="debugInfo" style="font-size: 12px; margin-top: 20px; color: #666;"></div>
        </div>
    </div>
</div>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
        authDomain: "ernest-embassy-lms.firebaseapp.com",
        projectId: "ernest-embassy-lms",
        storageBucket: "ernest-embassy-lms.firebasestorage.app",
        messagingSenderId: "204896421221",
        appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
    };
    
    let db;
    let loadedQuestions = [];
    let currentIndex = 0;
    let score = 0;
    
    // Debug function
    function debug(message) {
        console.log("[DEBUG]", message);
        const debugDiv = document.getElementById("debugInfo");
        if (debugDiv) {
            debugDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
        }
    }
    
    // Initialize Firebase
    async function initFirebase() {
        debug("Initializing Firebase...");
        try {
            // Initialize Firebase
            const app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore(app);
            debug("Firebase initialized successfully!");
            return true;
        } catch (error) {
            debug("Firebase initialization error: " + error.message);
            console.error("Firebase init error:", error);
            return false;
        }
    }
    
    // Create sample questions
    async function createSampleQuestions() {
        debug("Creating sample questions...");
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div class="status-message">
                <div class="loading-spinner"></div>
                Creating sample questions in Firebase...
                <div id="debugInfo" style="font-size: 12px; margin-top: 20px; color: #666;"></div>
            </div>
        `;
        
        const sampleQuestions = [
            { question: "What is 2 + 2?", optionA: "3", optionB: "4", optionC: "5", optionD: "6", answer: "B" },
            { question: "What is 5 × 6?", optionA: "30", optionB: "35", optionC: "40", optionD: "25", answer: "A" },
            { question: "What is 10 ÷ 2?", optionA: "2", optionB: "3", optionC: "4", optionD: "5", answer: "D" },
            { question: "What is 9 - 4?", optionA: "3", optionB: "4", optionC: "5", optionD: "6", answer: "C" },
            { question: "What is 8 + 7?", optionA: "13", optionB: "14", optionC: "15", optionD: "16", answer: "C" }
        ];
        
        try {
            await db.collection("questions").doc("mathematics-ss1").set({
                questions: sampleQuestions,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            debug("Sample questions created successfully!");
            alert("Success! 5 sample questions added. Click OK to refresh.");
            location.reload();
        } catch (error) {
            debug("Error creating questions: " + error.message);
            interfaceDiv.innerHTML = `
                <div class="error-box">
                    <strong>Error:</strong> ${error.message}<br><br>
                    <button class="btn btn-primary" onclick="location.reload()">Retry</button>
                </div>
            `;
        }
    }
    
    // Load questions from Firestore
    async function loadQuestions() {
        debug("Loading questions from Firestore...");
        const interfaceDiv = document.getElementById("quizInterface");
        
        try {
            const docRef = db.collection("questions").doc("mathematics-ss1");
            const docSnap = await docRef.get();
            debug("Document exists: " + docSnap.exists);
            
            if (!docSnap.exists) {
                interfaceDiv.innerHTML = `
                    <div class="status-message">
                        <h2>📚 No Questions Found</h2>
                        <p style="margin: 20px 0;">No quiz data found in your database.</p>
                        <button class="btn btn-success" onclick="createSampleQuestions()">
                            📝 Create Sample Questions
                        </button>
                        <p style="margin-top: 20px; font-size: 12px; color: #666;">
                            This will add 5 sample math questions to your Firestore database.
                        </p>
                        <div id="debugInfo" style="font-size: 12px; margin-top: 20px;"></div>
                    </div>
                `;
                return false;
            }
            
            const data = docSnap.data();
            loadedQuestions = data.questions || [];
            debug(`Loaded ${loadedQuestions.length} questions`);
            
            if (loadedQuestions.length === 0) {
                interfaceDiv.innerHTML = `
                    <div class="status-message">
                        <h2>Empty Questions Array</h2>
                        <button class="btn btn-primary" onclick="createSampleQuestions()">Create Sample Questions</button>
                    </div>
                `;
                return false;
            }
            
            return true;
        } catch (error) {
            debug("Error loading: " + error.message);
            interfaceDiv.innerHTML = `
                <div class="error-box">
                    <strong>Connection Error:</strong><br>
                    ${error.message}<br><br>
                    <button class="btn btn-primary" onclick="location.reload()">Retry</button>
                </div>
            `;
            return false;
        }
    }
    
    // Start the quiz
    function startQuiz() {
        currentIndex = 0;
        score = 0;
        showQuestion();
    }
    
    // Display current question
    function showQuestion() {
        const q = loadedQuestions[currentIndex];
        const interfaceDiv = document.getElementById("quizInterface");
        
        interfaceDiv.innerHTML = `
            <div class="quiz-meta">
                <span>Mathematics SS1</span>
                <span>Question ${currentIndex + 1} of ${loadedQuestions.length}</span>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options-list">
                <button class="option-item" onclick="checkAnswer('A')"><strong>A.</strong> ${q.optionA}</button>
                <button class="option-item" onclick="checkAnswer('B')"><strong>B.</strong> ${q.optionB}</button>
                <button class="option-item" onclick="checkAnswer('C')"><strong>C.</strong> ${q.optionC}</button>
                <button class="option-item" onclick="checkAnswer('D')"><strong>D.</strong> ${q.optionD}</button>
            </div>
            <div id="nextBtn" style="display:none; margin-top: 20px;">
                <button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>
            </div>
        `;
    }
    
    // Check user's answer
    function checkAnswer(selected) {
        const q = loadedQuestions[currentIndex];
        const correct = q.answer;
        
        const buttons = document.querySelectorAll('.option-item');
        buttons.forEach(btn => btn.disabled = true);
        
        buttons.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${correct}'`)) {
                btn.classList.add('correct');
            }
        });
        
        if (selected === correct) {
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${selected}'`)) {
                    btn.classList.add('correct');
                }
            });
            score++;
        } else {
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${selected}'`)) {
                    btn.classList.add('incorrect');
                }
            });
        }
        
        document.getElementById('nextBtn').style.display = 'block';
    }
    
    // Move to next question
    function nextQuestion() {
        currentIndex++;
        if (currentIndex < loadedQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }
    
    // Show final results
    function showResults() {
        const percent = Math.round((score / loadedQuestions.length) * 100);
        const interfaceDiv = document.getElementById("quizInterface");
        
        interfaceDiv.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <h2 style="color: #ffd700;">🏁 Quiz Complete!</h2>
                <div style="font-size: 4rem; color: ${percent >= 60 ? '#28a745' : '#ffd700'}; margin: 20px;">
                    ${percent}%
                </div>
                <p style="font-size: 1.2rem;">Score: ${score}/${loadedQuestions.length}</p>
                <p style="margin: 20px 0;">${percent >= 70 ? 'Excellent! 🎉' : percent >= 50 ? 'Good job! 👍' : 'Keep practicing! 💪'}</p>
                <button class="btn btn-success" onclick="startQuiz()">Restart Quiz</button>
            </div>
        `;
    }
    
    // Main initialization
    async function init() {
        debug("App starting...");
        const initialized = await initFirebase();
        if (initialized) {
            debug("Firebase ready, loading questions...");
            const hasQuestions = await loadQuestions();
            if (hasQuestions) {
                debug("Questions loaded, showing start button");
                const interfaceDiv = document.getElementById("quizInterface");
                interfaceDiv.innerHTML = `
                    <div style="text-align: center;">
                        <h2>📝 Ready to Test Your Knowledge?</h2>
                        <p style="margin: 20px 0;">${loadedQuestions.length} questions available</p>
                        <button class="btn btn-success" onclick="startQuiz()">🚀 Start Quiz</button>
                    </div>
                `;
            }
        } else {
            debug("Failed to initialize Firebase");
        }
    }
    
    // Start the app
    init();
</script>
</body>
</html>
