<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Player - LMS</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
}

/* TOP NAV */
.top-nav {
    background: #1a1a2e;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back-btn {
    background: #667eea;
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    text-decoration: none;
    margin-right: 10px;
}

.logout {
    background: crimson;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* LAYOUT */
.container {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 280px;
    background: white;
    border-right: 1px solid #ddd;
    padding: 15px;
    overflow-y: auto;
}

.lesson {
    padding: 12px;
    margin-bottom: 10px;
    background: #f0f0f0;
    border-radius: 8px;
    cursor: pointer;
}

.lesson.active {
    background: #667eea;
    color: white;
}

.content {
    flex: 1;
    padding: 30px;
}

.lesson-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

button {
    margin-top: 20px;
    padding: 10px 16px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN PROTECTION -->
<script>
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "login.html";
}
</script>

<!-- TOP NAV -->
<div class="top-nav">
    <div>
        <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
        🎓 LMS Course Player
    </div>

    <div>
        Welcome, <b id="userName"></b>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</div>

<!-- MAIN -->
<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Lessons</h3>
        <div id="lessonList"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div class="lesson-box">
            <h2 id="lessonTitle">Welcome</h2>
            <p id="lessonContent">Select a lesson</p>

            <button onclick="nextLesson()">Next Lesson</button>
        </div>
    </div>

</div>

<script>
document.getElementById("userName").innerText = user.name || "Student";

/* COURSE DATA */
const course = {
    lessons: [
        {
            title: "Introduction to Computer",
            content: "A computer is an electronic device that processes data into information..."
        },
        {
            title: "Input Devices",
            content: "Input devices include keyboard, mouse, scanner..."
        },
        {
            title: "Output Devices",
            content: "Output devices include monitor, printer, speakers..."
        },
        {
            title: "Storage Devices",
            content: "Storage devices include RAM, ROM, Hard Disk, Flash Drive..."
        }
    ]
};

let currentIndex = 0;

/* LOAD LESSONS */
function loadLessons(){
    const list = document.getElementById("lessonList");
    list.innerHTML = "";

    course.lessons.forEach((l, i) => {
        list.innerHTML += `
            <div class="lesson" onclick="openLesson(${i})">
                ${i + 1}. ${l.title}
            </div>
        `;
    });
}

/* OPEN LESSON */
function openLesson(i){
    currentIndex = i;

    document.getElementById("lessonTitle").innerText = course.lessons[i].title;
    document.getElementById("lessonContent").innerText = course.lessons[i].content;

    highlight(i);
}

/* HIGHLIGHT */
function highlight(i){
    document.querySelectorAll(".lesson").forEach((el, index) => {
        el.classList.toggle("active", index === i);
    });
}

/* NEXT */
function nextLesson(){
    if(currentIndex < course.lessons.length - 1){
        currentIndex++;
        openLesson(currentIndex);
    } else {
        alert("🎉 Course Completed!");
    }
}

/* LOGOUT */
function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

/* INIT */
loadLessons();
openLesson(0);
</script>

</body>
</html>
