<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Ernest Embassy LMS</title>

    <!-- Use Modular Firebase SDK (CDN version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
        
        nav { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #ffd700; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.3rem; font-weight: bold; color: #ffd700; text-decoration: none; letter-spacing: 1px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .nav-links a, .dropbtn { color: white; text-decoration: none; font-weight: 500; font-size: 0.85rem; background: none; border: none; cursor: pointer; padding: 8px 0; font-family: inherit; transition: color 0.3s; }
        .nav-links a:hover, .dropdown:hover .dropbtn { color: #ffd700; }
        
        .dropdown { position: relative; }
        .dropdown-content { display: none; position: absolute; background: #16213e; min-width: 180px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); overflow: hidden; top: 100%; left: 0; z-index: 1001; }
        .dropdown-content a { display: block; padding: 10px 15px; color: white; width: 100%; text-align: left; }
        .dropdown-content a:hover { background: #1a1a2e; color: #ffd700; }
        .dropdown:hover .dropdown-content { display: block; }

        .hero { background: linear-gradient(135deg, #111 0%, #1c1a12 100%); border-bottom: 1px solid #222; text-align: center; padding: 50px 20px; }
        .hero h1 { font-size: 2rem; color: #ffd700; margin-bottom: 15px; }
        .hero p { color: #aaa; font-size: 1rem; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        .quiz-section { background: #111; border: 1px solid #222; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .quiz-header h2 { font-size: 1.6rem; color: #ffd700; margin-bottom: 10px; }
        
        .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 1px solid #222; color: #888; font-size: 0.9rem; }
        .question-text { font-size: 1.25rem; line-height: 1.5; margin-bottom: 25px; color: #fff; font-weight: 500; }
        
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item { background: #1a1a1a; border: 1px solid #333; padding: 15px 20px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 1rem; color: #ddd; transition: all 0.2s ease; width: 100%; font-family: inherit; }
        .option-item:hover:not([disabled]) { background: #222; border-color: #ffd700; color: #fff; }
        
        .option-item.correct { background: rgba(40, 167, 69, 0.2) !important; border-color: #28a745 !important; color: #28a745 !important; font-weight: bold; }
        .option-item.incorrect { background: rgba(220, 53, 69, 0.2) !important; border-color: #dc3545 !important; color: #dc3545 !important; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 1rem; transition: 0.2s; font-family: inherit; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-primary:hover { background: #e6c200; }
        .btn-secondary { background: #444; color: white; }
        .btn-secondary:hover { background: #555; }
        
        .payment-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .payment-content { background: #151515; border: 2px solid #ffd700; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        .payment-amount { font-size: 2.5rem; color: #28a745; margin: 15px 0; font-weight: bold; }
        .payment-details { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left; font-size: 0.9rem; line-height: 1.6; }
        
        .status-message { text-align: center; font-size: 1.2rem; color: #aaa; padding: 40px 0; }
        .loading-spinner { border: 4px solid rgba(255,215,0,0.1); border-top: 4px solid #ffd700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 15px; text-align: center; }
            .nav-links { justify-content: center; gap: 12px; }
            .dropdown-content { left: 50%; transform: translateX(-50%); }
            .hero h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="dashboard.html" class="logo">⚡ Ernest Embassy LMS</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="courses.html">Courses</a>
            <a href="resources.html">Resources</a>
            
            <div class="dropdown">
                <button class="dropbtn">🎓 Education ▼</button>
                <div class="dropdown-content">
                    <a href="education.html">🎓 Education Hub</a>
                    <a href="teaching.html">📚 Teaching Notes</a>
                    <a href="tutoring.html">💻 Online Tutoring</a>
                    <a href="class.html">🏫 Virtual Class</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="hero">
    <h1 id="quizTitle">Live Database Challenge Arena</h1>
    <p id="quizSubtitle">Complete consecutive stages to top the leaderboard metrics</p>
</div>

<div class="container">
    <div class="quiz-section" id="quizInterface">
        <div class="status-message">
            <div class="loading-spinner"></div>
            Syncing collection files with server database...
        </div>
    </div>
</div>

<script>
    // ========== YOUR FIREBASE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
        authDomain: "ernest-embassy-lms.firebaseapp.com",
        projectId: "ernest-embassy-lms",
        storageBucket: "ernest-embassy-lms.firebasestorage.app",
        messagingSenderId: "204896421221",
        appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
    };
    
    // Initialize Firebase (Modular SDK)
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);
    
    // Payment details
    const PAYMENT_DETAILS = {
        opayNumber: "08032607809",
        bankName: "First Bank Plc",
        bankAccountNumber: "3113254386",
        accountName: "Damian Anielozie Okafor"
    };

    // Global variables
    let currentSubjectId = "";
    let currentQuizMode = "free";
    let loadedQuestions = [];
    let activeQuestionIndex = 0;
    let usersAccumulatedScore = 0;

    // Parse URL parameters
    function getUrlParameters() {
        const params = new URLSearchParams(window.location.search);
        currentSubjectId = params.get('subject') || 'mathematics-ss1';
        currentQuizMode = params.get('mode') || 'free';
    }

    function formatSubjectTitle(id) {
        return id.split('-')
                 .map(word => word.toUpperCase() === 'SS1' ? 'SS1' : word.charAt(0).toUpperCase() + word.slice(1))
                 .join(' ');
    }

    // ========== CREATE SAMPLE QUESTIONS IN FIRESTORE ==========
    async function createSampleQuestions() {
        const sampleQuestions = [
            {
                question: "What is the value of x in the equation 2x + 5 = 15?",
                optionA: "3",
                optionB: "5",
                optionC: "8",
                optionD: "10",
                answer: "B"
            },
            {
                question: "Solve: 3(x - 2) = 12",
                optionA: "4",
                optionB: "6",
                optionC: "8",
                optionD: "10",
                answer: "B"
            },
            {
                question: "If a = 3 and b = 4, what is a² + b²?",
                optionA: "12",
                optionB: "16",
                optionC: "25",
                optionD: "7",
                answer: "C"
            },
            {
                question: "Simplify: 5a + 3b - 2a + b",
                optionA: "3a + 4b",
                optionB: "7a + 2b",
                optionC: "3a + 2b",
                optionD: "7a + 4b",
                answer: "A"
            },
            {
                question: "What is 20% of 250?",
                optionA: "25",
                optionB: "50",
                optionC: "75",
                optionD: "100",
                answer: "B"
            },
            {
                question: "Solve for y: 2y - 7 = 11",
                optionA: "7",
                optionB: "8",
                optionC: "9",
                optionD: "10",
                answer: "C"
            },
            {
                question: "What is the square root of 144?",
                optionA: "10",
                optionB: "11",
                optionC: "12",
                optionD: "13",
                answer: "C"
            },
            {
                question: "If x = 5, what is 3x²?",
                optionA: "15",
                optionB: "45",
                optionC: "75",
                optionD: "225",
                answer: "C"
            },
            {
                question: "What is 7 × 8?",
                optionA: "48",
                optionB: "54",
                optionC: "56",
                optionD: "64",
                answer: "C"
            },
            {
                question: "Simplify: (x + 2)(x + 3)",
                optionA: "x² + 5x + 6",
                optionB: "x² + 6x + 5",
                optionC: "x² + 5x + 5",
                optionD: "x² + 6x + 6",
                answer: "A"
            }
        ];
        
        try {
            await db.collection("questions").doc(currentSubjectId).set({
                questions: sampleQuestions,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                totalQuestions: sampleQuestions.length
            });
            console.log("✅ Sample questions created successfully!");
            alert("Sample questions have been added to your database! Click OK to refresh and start the quiz.");
            location.reload();
        } catch (error) {
            console.error("Error creating sample questions:", error);
            alert("Error: " + error.message + "\n\nMake sure Firestore is enabled in your Firebase console and security rules allow write access.");
        }
    }

    // Initialize quiz
    async function initQuizArena() {
        getUrlParameters();
        
        const titleText = formatSubjectTitle(currentSubjectId);
        document.getElementById("quizTitle").innerText = `${titleText} Challenge Arena`;
        
        if (currentQuizMode === "paid") {
            showPremiumGate(titleText);
        } else {
            await fetchQuestionsFromFirestore();
        }
    }

    // Fetch questions from Firestore
    async function fetchQuestionsFromFirestore() {
        const interfaceDiv = document.getElementById("quizInterface");
        
        try {
            const docRef = db.collection("questions").doc(currentSubjectId);
            const docSnap = await docRef.get();

            if (!docSnap.exists) {
                interfaceDiv.innerHTML = `
                    <div class="status-message" style="text-align: center;">
                        <h2>📚 Database Empty</h2>
                        <p style="margin: 20px 0; color: #aaa;">No questions found for "${formatSubjectTitle(currentSubjectId)}".</p>
                        <button class="btn btn-success" onclick="createSampleQuestions()" style="width: auto; padding: 12px 25px; margin: 10px;">
                            📝 Create Sample Questions (10)
                        </button>
                        <p style="margin-top: 20px; font-size: 0.8rem; color: #666;">
                            Click the button above to automatically add sample math questions to your Firestore database.
                        </p>
                    </div>
                `;
                return;
            }

            const data = docSnap.data();
            loadedQuestions = data.questions || [];

            if (loadedQuestions.length === 0) {
                interfaceDiv.innerHTML = `
                    <div class="status-message">
                        <h2>📖 No Questions Available</h2>
                        <button class="btn btn-primary" onclick="createSampleQuestions()" style="width: auto; margin-top: 20px;">Add Sample Questions</button>
                    </div>
                `;
                return;
            }

            interfaceDiv.innerHTML = `
                <div class="quiz-header" style="text-align: center;">
                    <h2>📝 Practice Framework Ready</h2>
                    <p style="margin-top:15px; color:#aaa; margin-bottom: 25px;">
                        Subject contains <strong>${loadedQuestions.length}</strong> questions ready for assessment.
                    </p>
                    <button class="btn btn-success" style="width: auto; padding: 12px 30px;" onclick="startQuizEngine()">🚀 Start Challenge</button>
                </div>
            `;

        } catch (error) {
            console.error("Firestore error:", error);
            interfaceDiv.innerHTML = `
                <div class="status-message" style="color: #ff4d4d;">
                    <strong>⚠️ Connection Error</strong><br>
                    ${error.message}<br><br>
                    <button class="btn btn-secondary" onclick="location.reload()" style="width: auto;">Retry</button>
                </div>
            `;
        }
    }

    function showPremiumGate(title) {
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div class="quiz-header" style="text-align: center;">
                <h2>🔒 Premium ${title} Entry</h2>
                <p style="margin-top:10px; color:#aaa; margin-bottom: 25px;">Unlock full access to premium assessment content.</p>
                <button class="btn btn-success" style="font-size:1.1rem; padding:15px; width: auto;" onclick="showPaymentModal()">🎟️ Unlock (₦100)</button>
            </div>
        `;
    }

    function startQuizEngine() {
        activeQuestionIndex = 0;
        usersAccumulatedScore = 0;
        renderQuestion();
    }

    function renderQuestion() {
        const interfaceDiv = document.getElementById("quizInterface");
        const q = loadedQuestions[activeQuestionIndex];
        
        interfaceDiv.innerHTML = `
            <div class="quiz-meta">
                <span>${currentSubjectId.toUpperCase()}</span>
                <span>${activeQuestionIndex + 1} / ${loadedQuestions.length}</span>
            </div>
            <div class="question-text">${q.question}</div>
            <div class="options-list">
                <button class="option-item" onclick="checkAnswer(this, 'A')"><strong>A.</strong> ${q.optionA}</button>
                <button class="option-item" onclick="checkAnswer(this, 'B')"><strong>B.</strong> ${q.optionB}</button>
                <button class="option-item" onclick="checkAnswer(this, 'C')"><strong>C.</strong> ${q.optionC}</button>
                <button class="option-item" onclick="checkAnswer(this, 'D')"><strong>D.</strong> ${q.optionD}</button>
            </div>
            <div id="nextBtn" style="display:none; margin-top:20px;">
                <button class="btn btn-primary" onclick="nextQuestion()">Next →</button>
            </div>
        `;
    }

    function checkAnswer(btn, selected) {
        const q = loadedQuestions[activeQuestionIndex];
        const correct = q.answer;
        
        const allBtns = document.querySelectorAll('.option-item');
        allBtns.forEach(b => b.disabled = true);
        
        if (selected === correct) {
            btn.classList.add('correct');
            usersAccumulatedScore++;
        } else {
            btn.classList.add('incorrect');
            allBtns.forEach(b => {
                if (b.getAttribute('onclick')?.includes(`'${correct}'`)) {
                    b.classList.add('correct');
                }
            });
        }
        
        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        activeQuestionIndex++;
        if (activeQuestionIndex < loadedQuestions.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        const percent = Math.round((usersAccumulatedScore / loadedQuestions.length) * 100);
        let grade = percent >= 75 ? 'Excellent!' : percent >= 50 ? 'Good!' : 'Keep Practicing!';
        let color = percent >= 75 ? '#28a745' : percent >= 50 ? '#ffd700' : '#dc3545';
        
        document.getElementById("quizInterface").innerHTML = `
            <div style="text-align:center; padding:20px;">
                <h2 style="color:#ffd700;">🏁 Quiz Complete!</h2>
                <div style="font-size:4rem; color:${color}; margin:20px;">${percent}%</div>
                <p>Score: ${usersAccumulatedScore}/${loadedQuestions.length}</p>
                <p style="margin:20px 0; color:#aaa;">${grade}</p>
                <button class="btn btn-success" onclick="startQuizEngine()">Restart</button>
                <a href="dashboard.html" class="btn btn-secondary" style="display:inline-block; margin-top:10px; text-decoration:none;">Exit</a>
            </div>
        `;
    }

    function showPaymentModal() {
        const modal = document.createElement('div');
        modal.className = 'payment-modal';
        modal.innerHTML = `
            <div class="payment-content">
                <h2>💰 Payment Required</h2>
                <div class="payment-amount">₦100</div>
                <div class="payment-details">
                    <p><strong>Opay/Palmpay:</strong> ${PAYMENT_DETAILS.opayNumber}</p>
                    <p><strong>Bank:</strong> ${PAYMENT_DETAILS.bankName}</p>
                    <p><strong>Account:</strong> ${PAYMENT_DETAILS.bankAccountNumber}</p>
                    <p><strong>Name:</strong> ${PAYMENT_DETAILS.accountName}</p>
                </div>
                <button class="btn btn-success" onclick="confirmPayment()">✅ I Have Paid</button>
                <button class="btn btn-secondary" onclick="this.closest('.payment-modal').remove()">Cancel</button>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function confirmPayment() {
        alert("Payment verification submitted. Access granted!");
        document.querySelector('.payment-modal')?.remove();
        fetchQuestionsFromFirestore();
    }

    // Start the app
    initQuizArena();
</script>
</body>
</html>
