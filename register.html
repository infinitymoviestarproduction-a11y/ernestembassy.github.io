<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - LMS</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e9ecef);
    margin: 0;
}

nav {
    background: #1a1a2e;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

.container {
    max-width: 450px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #1a1a2e;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #5a67d8;
}

.error, .success {
    display: none;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

.error {
    background: #ffdddd;
    color: red;
}

.success {
    background: #ddffdd;
    color: green;
}

a {
    color: #667eea;
}
</style>
</head>

<body>

<nav>🔐 LMS Registration</nav>

<div class="container">

<h1>Create Account</h1>

<div id="errorBox" class="error"></div>
<div id="successBox" class="success"></div>

<form id="registerForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="tel" id="phone" placeholder="Phone Number">
    <input type="password" id="password" placeholder="Password (min 6 chars)" required>
    <input type="password" id="confirm" placeholder="Confirm Password" required>

    <button type="submit" id="btn">Create Account</button>
</form>

<p style="text-align:center;margin-top:15px;">
    Already have account? <a href="login.html">Login</a>
</p>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
/* =========================
   FIREBASE INIT
========================= */
const firebaseConfig = {
    apiKey: "AIzaSyD6xpH_zLnoJP2PTSMHg80R94_Vd-fUZSA",
    authDomain: "ernest-embassy-travel-website.firebaseapp.com",
    projectId: "ernest-embassy-travel-website",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   REGISTER HANDLER
========================= */

document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const btn = document.getElementById("btn");

    errorBox.style.display = "none";
    successBox.style.display = "none";

    if (password !== confirm) {
        errorBox.innerText = "Passwords do not match";
        errorBox.style.display = "block";
        return;
    }

    if (password.length < 6) {
        errorBox.innerText = "Password must be at least 6 characters";
        errorBox.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Creating account...";

    try {

        // 1. CREATE AUTH USER
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const user = result.user;

        // 2. UPDATE DISPLAY NAME
        await user.updateProfile({
            displayName: name
        });

        // 3. CREATE LMS USER PROFILE (IMPORTANT)
        const lmsUser = {
            uid: user.uid,
            name: name,
            email: email,
            phone: phone || "",
            role: "student",
            createdAt: new Date()
        };

        await db.collection("users").doc(user.uid).set(lmsUser);

        // 4. SAVE SESSION (USED ACROSS LMS)
        localStorage.setItem("currentUser", JSON.stringify(lmsUser));

        successBox.innerText = "Account created successfully! Redirecting...";
        successBox.style.display = "block";

        // 5. REDIRECT TO DASHBOARD
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 2000);

    } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = "block";
    }

    btn.disabled = false;
    btn.innerText = "Create Account";
});
</script>

</body>
</html>
