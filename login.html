<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ernest Embassy LMS Login</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:35px;
border-radius:18px;
width:360px;
box-shadow:0 15px 30px rgba(0,0,0,0.25);
text-align:center;
}

h2{
color:#333;
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
cursor:pointer;
font-size:15px;
margin-top:8px;
transition:0.3s;
}

button:hover{
background:#5a67d8;
transform:scale(1.02);
}

.secondary{
background:black;
}

p{
color:red;
margin-top:10px;
font-size:13px;
}

.small{
font-size:12px;
color:#777;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>🎓 Ernest Embassy LMS</h2>

<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button class="secondary" onclick="signup()">Create Account</button>

<p id="msg"></p>

<div class="small">
Secure Firebase Authentication System
</div>
</div>

<script>

/* =========================
   FIREBASE CONFIG
========================= */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   LOGIN FUNCTION
========================= */
function login(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

document.getElementById("msg").innerText = "Logging in...";

auth.signInWithEmailAndPassword(email,password)
.then(()=>{

window.location.href = "class.html";

})
.catch(err=>{
document.getElementById("msg").innerText = err.message;
});

}

/* =========================
   SIGNUP + PROFILE CREATE
========================= */
function signup(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

document.getElementById("msg").innerText = "Creating account...";

auth.createUserWithEmailAndPassword(email,password)
.then(async (userCredential)=>{

let user = userCredential.user;

/* CREATE USER PROFILE IN FIRESTORE */
await db.collection("users").doc(user.uid).set({
email: user.email,
name: email.split("@")[0],
score: 0,
role: "student",
createdAt: new Date()
});

window.location.href = "class.html";

})
.catch(err=>{
document.getElementById("msg").innerText = err.message;
});

}

</script>

</body>
</html>
