<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student LMS Quiz - Firebase Powered</title>

<!-- ✅ FIREBASE COMPAT SDK (IMPORTANT FIX) -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
}

.header{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
text-align:center;
padding:20px;
font-weight:bold;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.question{
font-weight:bold;
margin-bottom:10px;
font-size:18px;
}

.option{
background:#f1f1f1;
padding:12px;
margin:6px 0;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#ddd;
}

.correct{
background:#c8f7c5 !important;
border:2px solid green;
}

.wrong{
background:#ffcccc !important;
border:2px solid red;
}

.explanation{
margin-top:10px;
padding:10px;
background:#f9f9f9;
border-left:4px solid #667eea;
display:none;
}

.nav{
display:flex;
justify-content:space-between;
margin-top:20px;
gap:10px;
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
flex:1;
}

.next{background:#667eea;color:white;}
.back{background:#555;color:white;}
.home{background:black;color:white;}

.score{
text-align:center;
font-size:20px;
margin-bottom:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
🎓 Student Quiz (Firebase Powered LMS)
</div>

<div class="container">

<div class="score">
Score: <span id="score">0</span>
</div>

<div id="quiz"></div>

<div class="nav">
<button class="back" onclick="prevPage()">⬅ Back</button>
<button class="home" onclick="goHome()">🏠 Home</button>
<button class="next" onclick="nextPage()">Next ➡</button>
</div>

</div>

<script>

/* =========================
   FIREBASE CONFIG
   (REPLACE WITH YOUR OWN)
========================= */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   STATE MANAGEMENT
========================= */
let questions = [];
let page = 0;
let perPage = 5;
let score = 0;

/* RESET SCORE ON LOAD */
function reset(){
score = 0;
document.getElementById("score").innerText = score;
}

/* =========================
   LOAD QUESTIONS
========================= */
async function loadQuestions(){

try{

const snap = await db.collection("questions").get();

questions = [];

snap.forEach(doc=>{
questions.push(doc.data());
});

render();

}catch(err){
console.log("Error loading questions:", err);
document.getElementById("quiz").innerHTML =
"<p style='color:red'>Failed to load questions. Check Firebase connection.</p>";
}

}

/* =========================
   RENDER QUESTIONS (5 per page)
========================= */
function render(){

let start = page * perPage;
let end = start + perPage;

let slice = questions.slice(start,end);

let html = "";

slice.forEach((q)=>{

html += `
<div class="card">
<div class="question">${q.q}</div>
`;

q.o.forEach((opt,oi)=>{

html += `
<div class="option"
onclick="check(this,${oi},${q.a},'${q.exp.replace(/'/g,"")}')">
${opt}
</div>
`;

});

html += `<div class="explanation"></div></div>`;

});

document.getElementById("quiz").innerHTML = html;
}

/* =========================
   CHECK ANSWER
========================= */
function check(el,selected,correct,exp){

let parent = el.parentElement;

if(parent.classList.contains("done")) return;
parent.classList.add("done");

let options = parent.querySelectorAll(".option");
let explanation = parent.querySelector(".explanation");

/* show correct answer */
options.forEach((o,i)=>{
if(i === correct){
o.classList.add("correct");
}
});

if(selected === correct){
el.classList.add("correct");
score++;
document.getElementById("score").innerText = score;
}else{
el.classList.add("wrong");
}

explanation.innerHTML = "📖 " + exp;
explanation.style.display = "block";
}

/* =========================
   PAGINATION
========================= */
function nextPage(){
if((page+1)*perPage < questions.length){
page++;
render();
}
}

function prevPage(){
if(page > 0){
page--;
render();
}
}

/* =========================
   NAVIGATION
========================= */
function goHome(){
window.location.href = "class.html";
}

/* =========================
   INIT
========================= */
reset();
loadQuestions();

</script>

</body>
</html>
