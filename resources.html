<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Resource Portal</title>
    <style>
        /* This fixes the plain background issue */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: #1e3a8a;
            color: white;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        /* Grid layout to give students distinct choices */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .subject-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .subject-card:hover {
            transform: translateY(-5px);
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Welcome to the Student Resource Portal</h1>
        <p>Select a subject below to access your termly lesson materials.</p>
    </div>

    <div class="subject-grid">
        <div class="subject-card">
            <div class="icon">💻</div>
            <h3>Digital Technology</h3>
            <p>SS1 Curriculum (35 Lessons)</p>
            <a href="digital_tech_ss1.html" class="btn">Open Materials</a>
        </div>

        <div class="subject-card">
            <div class="icon">📊</div>
            <h3>Data Processing</h3>
            <p>SS1 Curriculum (35 Lessons)</p>
            <a href="data_processing_ss1.html" class="btn">Open Materials</a>
        </div>
    </div>
</div>

</body>
</html>
