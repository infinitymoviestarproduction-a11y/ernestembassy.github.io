<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ernest Embassy LMS Quiz Engine</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
}

.header{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:950px;
margin:auto;
padding:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
flex-wrap:wrap;
}

.score-box,
.timer-box{
background:white;
padding:15px;
border-radius:12px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.timer-box{
color:#dc3545;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.question{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.option{
background:#f1f1f1;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#ddd;
}

.correct{
background:#c8f7c5 !important;
border:2px solid green;
}

.wrong{
background:#ffcccc !important;
border:2px solid red;
}

.explanation{
margin-top:10px;
padding:10px;
background:#f9f9f9;
border-left:4px solid #667eea;
display:none;
}

.nav{
display:flex;
justify-content:space-between;
margin-top:20px;
flex-wrap:wrap;
gap:10px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.next{
background:#667eea;
color:white;
}

.back{
background:#555;
color:white;
}

.home{
background:black;
color:white;
}

.submit{
background:#28a745;
color:white;
}

.result-box{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

@media(max-width:768px){

.top-bar{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<body>

<div class="header" id="title">
🎓 Ernest Embassy LMS Quiz Engine
</div>

<div class="container">

<div class="top-bar">

<div class="score-box">
Score: <span id="score">0</span>
</div>

<div class="timer-box">
⏰ Time Left:
<span id="timer">30:00</span>
</div>

</div>

<div id="quiz"></div>

<div class="nav">
<button class="back" onclick="prevPage()">⬅ Back</button>

<button class="home" onclick="goHome()">🏠 Dashboard</button>

<button class="submit" onclick="submitQuiz()">
✅ Submit Quiz
</button>

<button class="next" onclick="nextPage()">Next ➡</button>
</div>

</div>

<script>

/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_PROJECT.firebaseapp.com",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_PROJECT.appspot.com",

messagingSenderId: "XXXX",

appId: "XXXX"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* =========================
MODE SYSTEM
========================= */

const urlParams =
new URLSearchParams(window.location.search);

let mode =
urlParams.get("mode") || "free";

/* =========================
QUIZ SETTINGS
========================= */

let questions = [];
let page = 0;
let perPage = 5;
let score = 0;

let answeredQuestions = {};

let totalTime = mode === "paid" ? 1800 : 999999;

/* 30 mins paid mode */

/* =========================
TITLE
========================= */

if(mode === "paid"){

document.getElementById("title").innerText =
"🔴 Paid Challenge Quiz";

}else{

document.getElementById("title").innerText =
"🟢 Free Test Mode";

document.querySelector(".timer-box").style.display =
"none";

}

/* =========================
LOAD QUESTIONS
========================= */

async function loadQuestions(){

const snap =
await db.collection("questions").get();

questions = [];

snap.forEach(doc=>{

questions.push({
id: doc.id,
...doc.data()
});

});

/* randomize paid mode */

if(mode === "paid"){

questions =
questions.sort(()=>Math.random()-0.5);

}

render();

}

/* =========================
RENDER
========================= */

function render(){

let start = page * perPage;
let end = start + perPage;

let slice =
questions.slice(start,end);

let html = "";

slice.forEach((q,index)=>{

html += `
<div class="card">

<div class="question">
${start + index + 1}. ${q.q}
</div>
`;

q.o.forEach((opt,oi)=>{

html += `
<div class="option"
onclick="check(this,
${start+index},
${oi},
${q.a},
'${q.exp}')">

${opt}

</div>
`;

});

html += `
<div class="explanation"></div>
</div>
`;

});

document.getElementById("quiz").innerHTML =
html;

}

/* =========================
CHECK ANSWER
========================= */

function check(el,qIndex,selected,correct,exp){

if(answeredQuestions[qIndex]) return;

answeredQuestions[qIndex] = true;

let parent = el.parentElement;

let options =
parent.querySelectorAll(".option");

let explanation =
parent.querySelector(".explanation");

options.forEach((o,i)=>{

o.style.pointerEvents = "none";

if(i === correct){

o.classList.add("correct");

}

});

if(selected === correct){

el.classList.add("correct");

score++;

document.getElementById("score").innerText =
score;

}else{

el.classList.add("wrong");

}

/* explanation only in free mode */

if(mode === "free"){

explanation.innerHTML =
"📖 " + exp;

explanation.style.display = "block";

}

}

/* =========================
PAGINATION
========================= */

function nextPage(){

if((page+1)*perPage < questions.length){

page++;

render();

}

}

function prevPage(){

if(mode === "paid"){

alert("Back navigation disabled in paid mode.");

return;

}

if(page > 0){

page--;

render();

}

}

/* =========================
TIMER SYSTEM
========================= */

if(mode === "paid"){

const timer =
setInterval(()=>{

let minutes =
Math.floor(totalTime / 60);

let seconds =
totalTime % 60;

seconds =
seconds < 10 ? "0"+seconds : seconds;

document.getElementById("timer").innerText =
minutes + ":" + seconds;

if(totalTime <= 0){

clearInterval(timer);

submitQuiz();

}

totalTime--;

},1000);

}

/* =========================
SUBMIT QUIZ
========================= */

async function submitQuiz(){

let user =
auth.currentUser;

if(user){

await db.collection("users")
.doc(user.uid)
.update({

score: score

});

}

document.querySelector(".container").innerHTML = `

<div class="result-box">

<h1>🎉 Quiz Submitted</h1>

<h2>Your Score: ${score}</h2>

<p>
Thank you for participating in the
Ernest Embassy LMS Challenge.
</p>

<br>

<button class="home"
onclick="goHome()">

🏠 Return Dashboard

</button>

</div>
`;

}

/* =========================
HOME
========================= */

function goHome(){

window.location.href = "class.html";

}

/* =========================
ANTI REFRESH SECURITY
========================= */

if(mode === "paid"){

window.onbeforeunload = function(){

return "Quiz in progress.";

};

}

/* =========================
INIT
========================= */

loadQuestions();

</script>

</body>
</html>
