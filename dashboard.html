<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Ernest Embassy LMS</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    
    <!-- Central Auth Script -->
    <script src="auth.js"></script>
    
    <style>
        /* Your styles here */
        .user-area { display: flex; gap: 10px; align-items: center; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🎓 Ernest Embassy LMS</div>
        <div class="user-area">
            <span>Welcome, <span id="userName">Student</span>!</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>
    
    <!-- Rest of your dashboard content -->
    
    <script>
        // No need for additional auth code - auth.js handles everything!
        // Just use the available functions if needed:
        
        // Example: Display user score
        loadUserScore().then(score => {
            console.log("User score:", score);
        });
        
        // Check if admin to show extra features
        isAdmin().then(admin => {
            if (admin) {
                console.log("Admin user detected");
            }
        });
    </script>
</body>
</html>
