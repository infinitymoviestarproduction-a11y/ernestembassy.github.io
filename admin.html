<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMS Admin Panel - Firebase Connected</title>

<!-- FIREBASE COMPAT -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
}

.header{
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
color:#333;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input, textarea, select{
width:100%;
padding:12px;
margin:8px 0 15px 0;
border-radius:10px;
border:1px solid #ddd;
outline:none;
}

textarea{
height:120px;
resize:none;
}

button{
background:#667eea;
color:white;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
width:100%;
font-size:16px;
}

button:hover{
background:#5a67d8;
}

.success{
color:green;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
⚙️ LMS ADMIN PANEL (Firebase Connected)
</div>

<div class="container">

<!-- QUESTION -->
<div class="card">
<h2>➕ Add Question</h2>

<input id="q" placeholder="Enter question">

<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">

<select id="ans">
<option value="0">Correct Answer (0)</option>
<option value="1">Correct Answer (1)</option>
<option value="2">Correct Answer (2)</option>
<option value="3">Correct Answer (3)</option>
</select>

<textarea id="exp" placeholder="Explanation"></textarea>

<button onclick="saveQuestion()">💾 Save Question</button>

<div id="qMsg"></div>
</div>

<!-- LESSON -->
<div class="card">
<h2>📚 Add Lesson</h2>

<input id="title" placeholder="Lesson Title">

<textarea id="content" placeholder="Lesson Content"></textarea>

<button onclick="saveLesson()">💾 Save Lesson</button>

<div id="lMsg"></div>
</div>

</div>

<script>

/* FIREBASE CONFIG (REPLACE WITH YOUR OWN) */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   SAVE QUESTION TO FIREBASE
========================= */
async function saveQuestion(){

let q = document.getElementById("q").value;
let o1 = document.getElementById("o1").value;
let o2 = document.getElementById("o2").value;
let o3 = document.getElementById("o3").value;
let o4 = document.getElementById("o4").value;
let a = Number(document.getElementById("ans").value);
let exp = document.getElementById("exp").value;

if(!q || !o1 || !o2 || !o3 || !o4 || !exp){
document.getElementById("qMsg").innerHTML =
"<p style='color:red'>⚠️ Please fill all fields</p>";
return;
}

try{

await db.collection("questions").add({
q: q,
o: [o1,o2,o3,o4],
a: a,
exp: exp,
createdAt: new Date()
});

/* clear form */
document.getElementById("q").value="";
document.getElementById("o1").value="";
document.getElementById("o2").value="";
document.getElementById("o3").value="";
document.getElementById("o4").value="";
document.getElementById("exp").value="";

document.getElementById("qMsg").innerHTML =
"<p class='success'>✅ Question saved successfully!</p>";

}catch(err){
console.log(err);
document.getElementById("qMsg").innerHTML =
"<p style='color:red'>❌ Error saving question</p>";
}

}

/* =========================
   SAVE LESSON TO FIREBASE
========================= */
async function saveLesson(){

let title = document.getElementById("title").value;
let content = document.getElementById("content").value;

if(!title || !content){
document.getElementById("lMsg").innerHTML =
"<p style='color:red'>⚠️ Fill all fields</p>";
return;
}

try{

await db.collection("lessons").add({
title: title,
content: content,
createdAt: new Date()
});

document.getElementById("title").value="";
document.getElementById("content").value="";

document.getElementById("lMsg").innerHTML =
"<p class='success'>✅ Lesson saved successfully!</p>";

}catch(err){
console.log(err);
document.getElementById("lMsg").innerHTML =
"<p style='color:red'>❌ Error saving lesson</p>";
}

}

</script>

</body>
</html>
