<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMS Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* CARD */
.card{
background:white;
color:#333;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* INPUTS */
input, textarea, select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

textarea{
resize:none;
height:100px;
}

/* BUTTON */
button{
background:#667eea;
color:white;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
width:100%;
font-size:16px;
transition:0.3s;
}

button:hover{
background:#5a67d8;
transform:scale(1.02);
}

h2{
margin-bottom:10px;
color:#444;
}
</style>
</head>

<body>

<div class="header">
⚙️ LMS ADMIN DASHBOARD
</div>

<div class="container">

<!-- ADD QUESTION -->
<div class="card">
<h2>➕ Add Question</h2>

<input id="q" placeholder="Enter question">

<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">

<select id="ans">
<option value="0">Correct Answer Index (0)</option>
<option value="1">Correct Answer Index (1)</option>
<option value="2">Correct Answer Index (2)</option>
<option value="3">Correct Answer Index (3)</option>
</select>

<textarea id="exp" placeholder="Explanation"></textarea>

<button onclick="saveQuestion()">💾 Save Question</button>
</div>

<!-- ADD LESSON -->
<div class="card">
<h2>📚 Add Lesson</h2>

<input id="title" placeholder="Lesson Title">

<textarea id="content" placeholder="Lesson Content"></textarea>

<button onclick="saveLesson()">💾 Save Lesson</button>
</div>

</div>

<script>

/* 🔥 FIREBASE CONFIG - REPLACE WITH YOUR OWN */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
SAVE QUESTION TO FIREBASE
========================= */
function saveQuestion(){

const data = {
q: document.getElementById("q").value,
o: [
document.getElementById("o1").value,
document.getElementById("o2").value,
document.getElementById("o3").value,
document.getElementById("o4").value
],
a: Number(document.getElementById("ans").value),
exp: document.getElementById("exp").value,
createdAt: new Date()
};

db.collection("questions").add(data)
.then(() => {

alert("✅ Question saved successfully!");

document.getElementById("q").value = "";
document.getElementById("o1").value = "";
document.getElementById("o2").value = "";
document.getElementById("o3").value = "";
document.getElementById("o4").value = "";
document.getElementById("exp").value = "";

})
.catch(err => {
alert("❌ Error: " + err.message);
});

}

/* =========================
SAVE LESSON TO FIREBASE
========================= */
function saveLesson(){

const lesson = {
title: document.getElementById("title").value,
content: document.getElementById("content").value,
createdAt: new Date()
};

db.collection("lessons").add(lesson)
.then(() => {

alert("📚 Lesson saved successfully!");

document.getElementById("title").value = "";
document.getElementById("content").value = "";

})
.catch(err => {
alert("❌ Error: " + err.message);
});

}

</script>

</body>
</html>
