<!-- Add this inside admin.html after the existing tabs -->
<div class="card">
    <h2>🔧 Developer Testing Tools</h2>
    <p style="color: #718096; margin-bottom: 15px;">⚠️ These tools are for testing only - Use with caution</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="action-btn" onclick="createTestData()" style="background: #f39c12;">📝 Create Test Data</button>
        <button class="action-btn" onclick="clearTestData()" style="background: #dc3545;">🗑️ Clear Test Data</button>
        <button class="action-btn" onclick="window.location.href='dev-login.html'" style="background: #667eea;">🔧 Dev Login Portal</button>
    </div>
    <div id="testMsg"></div>
</div>

<script>
    async function createTestData() {
        if(!confirm("Create sample test data?")) return;
        // Add test data creation logic here
        document.getElementById('testMsg').innerHTML = '<div class="success">✅ Test data created</div>';
        setTimeout(() => { document.getElementById('testMsg').innerHTML = ''; }, 3000);
    }
    
    async function clearTestData() {
        if(!confirm("⚠️ Clear ALL test data?")) return;
        // Add test data clearing logic here
        document.getElementById('testMsg').innerHTML = '<div class="success">✅ Test data cleared</div>';
        setTimeout(() => { document.getElementById('testMsg').innerHTML = ''; }, 3000);
    }
</script>
