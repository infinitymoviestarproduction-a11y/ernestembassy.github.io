<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy LMS Admin</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#eef2f7;
}

/* =========================
HEADER
========================= */

.header{
background:linear-gradient(135deg,#667eea,#764ba2);
padding:20px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.header-left h1{
font-size:26px;
}

.header-left p{
font-size:14px;
opacity:0.9;
margin-top:5px;
}

.header-right{
display:flex;
gap:10px;
margin-top:10px;
}

.header button{
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.home-btn{
background:white;
color:#333;
}

.back-btn{
background:#222;
color:white;
}

.logout-btn{
background:red;
color:white;
}

.header button:hover{
transform:scale(1.05);
}

/* =========================
CONTAINER
========================= */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* =========================
STATS
========================= */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.stat-card h2{
font-size:28px;
color:#667eea;
}

.stat-card p{
color:#777;
margin-top:5px;
}

/* =========================
GRID
========================= */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.header{
flex-direction:column;
align-items:flex-start;
}

}

/* =========================
CARD
========================= */

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card h2{
margin-bottom:15px;
color:#333;
}

/* =========================
INPUTS
========================= */

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
outline:none;
}

textarea{
resize:none;
height:120px;
}

/* =========================
BUTTONS
========================= */

.action-btn{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:13px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
width:100%;
transition:0.3s;
}

.action-btn:hover{
transform:scale(1.02);
opacity:0.95;
}

/* =========================
MESSAGES
========================= */

.success{
background:#d4edda;
color:#155724;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.error{
background:#f8d7da;
color:#721c24;
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* =========================
FOOTER
========================= */

.footer{
text-align:center;
padding:20px;
color:#666;
font-size:14px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="header-left">
<h1>⚙️ Ernest Embassy LMS Admin</h1>
<p>Professional Firebase Learning Management System</p>
</div>

<div class="header-right">

<button class="home-btn" onclick="goHome()">
🏠 Home
</button>

<button class="back-btn" onclick="goBack()">
⬅ Back
</button>

<button class="logout-btn" onclick="logout()">
🚪 Logout
</button>

</div>

</div>

<!-- MAIN CONTAINER -->
<div class="container">

<!-- STATS -->
<div class="stats">

<div class="stat-card">
<h2 id="questionCount">0</h2>
<p>Total Questions</p>
</div>

<div class="stat-card">
<h2 id="lessonCount">0</h2>
<p>Total Lessons</p>
</div>

<div class="stat-card">
<h2>ONLINE</h2>
<p>Firebase Status</p>
</div>

</div>

<!-- GRID -->
<div class="grid">

<!-- QUESTION SECTION -->
<div class="card">

<h2>➕ Add Question</h2>

<input id="q" placeholder="Enter Question">

<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">

<select id="ans">
<option value="">Select Correct Answer</option>
<option value="0">Option 1</option>
<option value="1">Option 2</option>
<option value="2">Option 3</option>
<option value="3">Option 4</option>
</select>

<textarea id="exp" placeholder="Answer Explanation"></textarea>

<button class="action-btn" onclick="saveQuestion()">
💾 Save Question
</button>

<div id="qMsg"></div>

</div>

<!-- LESSON SECTION -->
<div class="card">

<h2>📚 Add Lesson</h2>

<input id="title" placeholder="Lesson Title">

<textarea id="content"
placeholder="Lesson Content"></textarea>

<button class="action-btn" onclick="saveLesson()">
💾 Save Lesson
</button>

<div id="lMsg"></div>

</div>

</div>

</div>

<!-- FOOTER -->
<div class="footer">
Ernest Embassy LMS Admin Dashboard © 2026
</div>

<script>

/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",

authDomain: "ernest-embassy-lms.firebaseapp.com",

projectId: "ernest-embassy-lms",

storageBucket: "ernest-embassy-lms.firebasestorage.app",

messagingSenderId: "204896421221",

appId: "1:204896421221:web:9407b523da68c3e5b88d8c"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* =========================
AUTH PROTECTION
========================= */

auth.onAuthStateChanged((user)=>{

if(!user){

window.location.href = "login.html";

}

});

/* =========================
SAVE QUESTION
========================= */

async function saveQuestion(){

let q =
document.getElementById("q").value;

let o1 =
document.getElementById("o1").value;

let o2 =
document.getElementById("o2").value;

let o3 =
document.getElementById("o3").value;

let o4 =
document.getElementById("o4").value;

let a =
document.getElementById("ans").value;

let exp =
document.getElementById("exp").value;

if(!q || !o1 || !o2 || !o3 || !o4 || !exp){

document.getElementById("qMsg").innerHTML =
`<div class="error">
⚠️ Please fill all fields
</div>`;

return;

}

try{

await db.collection("questions").add({

q:q,

o:[o1,o2,o3,o4],

a:Number(a),

exp:exp,

createdAt:new Date()

});

document.getElementById("q").value="";
document.getElementById("o1").value="";
document.getElementById("o2").value="";
document.getElementById("o3").value="";
document.getElementById("o4").value="";
document.getElementById("exp").value="";

document.getElementById("qMsg").innerHTML =
`<div class="success">
✅ Question saved successfully
</div>`;

loadStats();

}catch(err){

document.getElementById("qMsg").innerHTML =
`<div class="error">
❌ Error saving question
</div>`;

}

}

/* =========================
SAVE LESSON
========================= */

async function saveLesson(){

let title =
document.getElementById("title").value;

let content =
document.getElementById("content").value;

if(!title || !content){

document.getElementById("lMsg").innerHTML =
`<div class="error">
⚠️ Fill all lesson fields
</div>`;

return;

}

try{

await db.collection("lessons").add({

title:title,

content:content,

createdAt:new Date()

});

document.getElementById("title").value="";
document.getElementById("content").value="";

document.getElementById("lMsg").innerHTML =
`<div class="success">
✅ Lesson saved successfully
</div>`;

loadStats();

}catch(err){

document.getElementById("lMsg").innerHTML =
`<div class="error">
❌ Error saving lesson
</div>`;

}

}

/* =========================
LOAD STATS
========================= */

async function loadStats(){

const qSnap =
await db.collection("questions").get();

document.getElementById("questionCount")
.innerText = qSnap.size;

const lSnap =
await db.collection("lessons").get();

document.getElementById("lessonCount")
.innerText = lSnap.size;

}

loadStats();

/* =========================
NAVIGATION
========================= */

function goHome(){

window.location.href = "class.html";

}

function goBack(){

window.history.back();

}

/* =========================
LOGOUT
========================= */

function logout(){

auth.signOut().then(()=>{

window.location.href = "login.html";

});

}

</script>

</body>
</html>
