<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ernest Embassy LMS</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .floating-home {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 24px;
            border: none;
            text-decoration: none;
        }
        .floating-home:hover { transform: scale(1.1); }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; font-size: 3rem; margin-bottom: 10px; }
        h1 { color: #667eea; text-align: center; margin-bottom: 10px; font-size: 1.8rem; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-google { background: #db4437; margin-top: 10px; }
        .message { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
        .error { background: #fee; color: #eb3349; display: block; }
        .success { background: #e8f5e9; color: #11998e; display: block; }
        .nav-links { text-align: center; margin-top: 20px; }
        .nav-links a { color: #667eea; text-decoration: none; margin: 0 10px; }
        .divider { text-align: center; margin: 20px 0; color: #718096; position: relative; }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #e2e8f0;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        @media (max-width: 768px) {
            .floating-home { width: 50px; height: 50px; font-size: 20px; bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

<a href="index.html" class="floating-home" title="Go to Home">🏠</a>

<div class="container">
    <div class="logo">🎓</div>
    <h1>Ernest Embassy LMS</h1>
    <p class="subtitle">Sign in to continue learning</p>
    
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    
    <button class="btn" onclick="loginStudent()">🔐 Login</button>
    
    <div class="nav-links">
        <a href="#" onclick="goToRegister()">📝 Create New Account</a>
        <a href="index.html">🏠 Home</a>
    </div>
    
    <div class="divider">or</div>
    
    <button class="btn btn-google" onclick="loginWithGoogle()">G Continue with Google</button>
    
    <div id="message"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
        authDomain: "ernest-embassy-lms.firebaseapp.com",
        projectId: "ernest-embassy-lms",
        storageBucket: "ernest-embassy-lms.firebasestorage.app",
        messagingSenderId: "204896421221",
        appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerHTML = msg;
        msgDiv.className = `message ${type}`;
        setTimeout(() => {
            msgDiv.style.display = 'none';
            msgDiv.className = 'message';
        }, 4000);
    }
    
    async function loginStudent() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            showMessage('Please enter email and password', 'error');
            return;
        }
        
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;
            
            const studentDoc = await db.collection('students').doc(user.uid).get();
            if (!studentDoc.exists) {
                await db.collection('students').doc(user.uid).set({
                    email: email,
                    fullName: email.split('@')[0],
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
                    paidQuizzes: [],
                    quizScores: {}
                });
            }
            
            // Check if user is admin or teacher
            const adminDoc = await db.collection('admins').doc(user.uid).get();
            if (adminDoc.exists && adminDoc.data().isAdmin === true) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
            
        } catch (error) {
            if (error.code === 'auth/user-not-found') {
                showMessage('No account found. Please register.', 'error');
            } else if (error.code === 'auth/wrong-password') {
                showMessage('Incorrect password.', 'error');
            } else {
                showMessage(error.message, 'error');
            }
        }
    }
    
    async function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            
            const studentDoc = await db.collection('students').doc(user.uid).get();
            if (!studentDoc.exists) {
                await db.collection('students').doc(user.uid).set({
                    email: user.email,
                    fullName: user.displayName || user.email.split('@')[0],
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
                    paidQuizzes: [],
                    quizScores: {}
                });
            }
            
            window.location.href = 'dashboard.html';
        } catch (error) {
            showMessage(error.message, 'error');
        }
    }
    
    function goToRegister() {
        window.location.href = 'register.html';
    }
    
    auth.onAuthStateChanged(user => {
        if (user) {
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
