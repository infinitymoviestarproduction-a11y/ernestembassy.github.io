<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ernest Embassy LMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:linear-gradient(135deg,#f5f7fa,#e9ecef);
}

/* NAV */
nav{
    background:#1a1a2e;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.nav-left{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    color:white;
}

.home{ background:#667eea; }
.register{ background:#28a745; }

/* LOGIN BOX */
.container{
    max-width:450px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1a1a2e;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#5a67d8;
}

.error{
    display:none;
    background:#ffdddd;
    color:red;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.footer-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.footer-text a{
    color:#667eea;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav>
    <div class="nav-left">
        <a class="btn home" href="index.html">🏠 Home</a>
        <a class="btn register" href="register.html">📝 Register</a>
    </div>

    <div>
        🔐 Ernest Embassy LMS
    </div>
</nav>

<!-- LOGIN CONTAINER -->
<div class="container">

    <h1>Welcome Back</h1>
    <p>Login to continue learning</p>

    <div id="errorBox" class="error"></div>

    <form id="loginForm">

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="footer-text">
        Don’t have an account?
        <a href="register.html">Create one</a>
    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
/* =========================
   FIREBASE INIT
========================= */
const firebaseConfig = {
    apiKey: "AIzaSyD6xpH_zLnoJP2PTSMHg80R94_Vd-fUZSA",
    authDomain: "ernest-embassy-travel-website.firebaseapp.com",
    projectId: "ernest-embassy-travel-website",
    storageBucket: "ernest-embassy-travel-website.firebasestorage.app",
    messagingSenderId: "831442789419",
    appId: "1:831442789419:web:1845791aafb7ac9d31366e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* =========================
   SESSION BUILDER
========================= */
function createSessionUser(user){
    return {
        uid: user.uid,
        email: user.email,
        name: user.displayName || user.email.split("@")[0],
        role: "student",
        loginTime: new Date().toISOString()
    };
}

/* =========================
   LOGIN HANDLER
========================= */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("errorBox");

    errorBox.style.display = "none";

    try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        const user = result.user;

        if (!user.emailVerified) {
            errorBox.innerText = "Please verify your email before login.";
            errorBox.style.display = "block";
            await auth.signOut();
            return;
        }

        const sessionUser = createSessionUser(user);

        localStorage.setItem("currentUser", JSON.stringify(sessionUser));
        localStorage.setItem("userLoggedIn", "true");

        window.location.href = "dashboard.html";

    } catch (error) {
        errorBox.innerText = error.message;
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
