<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Room - Ernest Embassy LMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
}

/* NAV */
nav{
    background:#1a1a2e;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.home-btn{ background:#667eea; }
.back-btn{ background:#28a745; }
.logout-btn{ background:#dc3545; }

/* CONTAINER */
.container{
    max-width:1000px;
    margin:auto;
    padding:25px;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:30px;
    border-radius:15px;
    margin-top:20px;
}

.header h1{
    margin-bottom:10px;
}

/* LESSON BOX */
.lesson-box{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.lesson-title{
    font-size:22px;
    margin-bottom:10px;
    color:#1a1a2e;
}

.lesson-content{
    line-height:1.7;
    color:#555;
}

/* NAV LESSON */
.lesson-nav{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.lesson-nav button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    background:#667eea;
    color:white;
}

.lesson-nav button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px;
    margin-top:40px;
    background:#1a1a2e;
    color:white;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="nav-left">
        <a class="btn home-btn" href="index.html">🏠 Home</a>
        <a class="btn back-btn" href="dashboard.html">⬅ Back</a>
    </div>

    <div class="nav-right">
        <span id="userName"></span>
        <button class="btn logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- CONTENT -->
<div class="container">

    <div class="header">
        <h1 id="courseTitle">Loading Course...</h1>
        <p>Welcome to your learning class</p>
    </div>

    <div class="lesson-box">
        <div class="lesson-title" id="lessonTitle">Lesson Loading...</div>
        <div class="lesson-content" id="lessonContent">
            Please wait while we load your lesson content.
        </div>

        <div class="lesson-nav">
            <button id="prevBtn" onclick="prevLesson()">⬅ Previous</button>
            <button id="nextBtn" onclick="nextLesson()">Next ➡</button>
        </div>
    </div>

</div>

<footer>
    © 2026 Ernest Embassy LMS - Class Room
</footer>

<script>
/* =========================
   SESSION CHECK
========================= */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "login.html";
}

document.getElementById("userName").innerText = user.name || "Student";

/* =========================
   GET COURSE FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const course = params.get("subject") || params.get("course");

/* =========================
   SAMPLE LESSON DATA (TEMP)
   (Later replace with Firebase)
========================= */
const lessons = {
    "digital-technology": [
        {
            title: "Introduction to Computer",
            content: "A computer is an electronic device that processes data..."
        },
        {
            title: "Types of Computer",
            content: "There are analog, digital and hybrid computers..."
        }
    ],
    "mathematics": [
        {
            title: "Algebra Basics",
            content: "Algebra involves variables and equations..."
        }
    ],
    "english": [
        {
            title: "Grammar Basics",
            content: "Grammar is the structure of language..."
        }
    ]
};

let currentIndex = 0;

/* =========================
   LOAD COURSE
========================= */
function loadLesson(){
    const courseData = lessons[course];

    if(!courseData){
        document.getElementById("courseTitle").innerText = "Course Not Found";
        return;
    }

    document.getElementById("courseTitle").innerText = course.replace("-", " ");

    const lesson = courseData[currentIndex];

    document.getElementById("lessonTitle").innerText = lesson.title;
    document.getElementById("lessonContent").innerText = lesson.content;

    document.getElementById("prevBtn").disabled = currentIndex === 0;
    document.getElementById("nextBtn").disabled = currentIndex === courseData.length - 1;
}

/* =========================
   NAVIGATION
========================= */
function nextLesson(){
    const courseData = lessons[course];
    if(currentIndex < courseData.length - 1){
        currentIndex++;
        loadLesson();
    }
}

function prevLesson(){
    if(currentIndex > 0){
        currentIndex--;
        loadLesson();
    }
}

/* =========================
   LOGOUT
========================= */
function logout(){
    localStorage.removeItem("currentUser");
    localStorage.removeItem("userLoggedIn");
    window.location.href = "login.html";
}

/* INIT */
loadLesson();
</script>

</body>
</html>
