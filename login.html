<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication Portal - Ernest Embassy LMS</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<script src="auth.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .box {
        background: white;
        padding: 40px;
        border-radius: 20px;
        width: 400px;
        max-width: 90%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        text-align: center;
    }

    h2 {
        color: #1a1a2e;
        margin-bottom: 10px;
        font-size: 28px;
    }

    .subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: 12px;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }

    .secondary {
        background: #1a1a2e;
    }

    .secondary:hover {
        background: #16213e;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .msg {
        margin-top: 15px;
        font-size: 13px;
        min-height: 40px;
    }

    .error {
        color: #dc3545;
        background: #f8d7da;
        padding: 10px;
        border-radius: 8px;
    }

    .success {
        color: #155724;
        background: #d4edda;
        padding: 10px;
        border-radius: 8px;
    }

    .small {
        font-size: 12px;
        color: #888;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #eee;
    }

    .loading {
        opacity: 0.7;
        pointer-events: none;
    }
</style>
</head>

<body>

<div class="box">
    <h2 id="authTitle">🎓 Ernest Embassy LMS</h2>
    <div id="authSubtitle" class="subtitle">Login to continue learning</div>

    <div id="nameInputContainer" style="display: none;">
        <input id="fullName" type="text" placeholder="Full Student Name" autocomplete="name">
    </div>
    
    <input id="email" type="email" placeholder="Email Address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginBtn" onclick="executeLogin()">🔐 Login</button>
    <button id="toggleModeBtn" class="secondary" onclick="toggleAuthViewMode()">📝 Create New Account</button>

    <div id="msg" class="msg"></div>

    <div class="small">
        🔒 Secure Firebase Authentication<br>
        Your data is protected
    </div>
</div>

<script>
/* ====================================
   GLOBAL STATE CONFIGURATION
==================================== */
let isSignupMode = false;

/* ====================================
   EXECUTE ACCOUNT SIGNUP ROUTINE
==================================== */
async function executeSignup() {
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgDiv = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    
    msgDiv.innerHTML = "";
    msgDiv.className = "msg";
    
    if (!name || !email || !password) {
        msgDiv.innerHTML = '<div class="error">⚠️ Please fill in all registration fields</div>';
        return;
    }
    
    const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
    if (!emailRegex.test(email)) {
        msgDiv.innerHTML = '<div class="error">⚠️ Please enter a valid email address</div>';
        return;
    }
    
    if (password.length < 6) {
        msgDiv.innerHTML = '<div class="error">⚠️ Password must be at least 6 characters</div>';
        return;
    }
    
    msgDiv.innerHTML = '<div class="success">🔄 Creating your account profile...</div>';
    loginBtn.classList.add("loading");
    loginBtn.disabled = true;
    
    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Structure the database records under central users collections
        await db.collection("users").doc(user.uid).set({
            uid: user.uid,
            email: user.email,
            name: name,
            score: 0,
            role: "student",
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Cache basic attributes locally for immediate interface reads
        localStorage.setItem("currentUser", JSON.stringify({
            uid: user.uid,
            name: name,
            email: user.email,
            role: "student",
            score: 0
        }));
        
        msgDiv.innerHTML = '<div class="success">✅ Account verified! Preparing workspace...</div>';
        
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1200);
        
    } catch (error) {
        console.error("Signup context exception:", error);
        let errorMessage = "";
        
        switch (error.code) {
            case 'auth/email-already-in-use':
                errorMessage = "❌ Email is registered. Flip back to Login panel.";
                break;
            case 'auth/invalid-email':
                errorMessage = "❌ Invalid format string patterns assigned.";
                break;
            case 'auth/weak-password':
                errorMessage = "❌ Security rule constraint: Weak string signature used.";
                break;
            default:
                errorMessage = `❌ Process Exception: ${error.message}`;
        }
        msgDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
        loginBtn.classList.remove("loading");
        loginBtn.disabled = false;
    }
}

/* ====================================
   EXECUTE ACCOUNT LOGIN ROUTINE
==================================== */
async function executeLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msgDiv = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    
    msgDiv.innerHTML = "";
    msgDiv.className = "msg";
    
    if (!email || !password) {
        msgDiv.innerHTML = '<div class="error">⚠️ Please fill in email and password fields</div>';
        return;
    }
    
    msgDiv.innerHTML = '<div class="success">🔄 Authenticating security credentials...</div>';
    loginBtn.classList.add("loading");
    loginBtn.disabled = true;
    
    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        const userDoc = await db.collection("users").doc(user.uid).get();
        const userData = userDoc.exists ? userDoc.data() : {};
        
        localStorage.setItem("currentUser", JSON.stringify({
            uid: user.uid,
            name: userData.name || email.split('@')[0],
            email: user.email,
            role: userData.role || "student",
            score: userData.score || 0
        }));
        
        window.location.href = "dashboard.html";
        
    } catch (error) {
        console.error("Login authorization exception:", error);
        let errorMessage = "";
        
        switch (error.code) {
            case 'auth/user-not-found':
            case 'auth/wrong-password':
                errorMessage = "❌ Invalid authentication matching logs found.";
                break;
            case 'auth/too-many-requests':
                errorMessage = "❌ Service blocked due to burst requests. Try later.";
                break;
            default:
                errorMessage = `❌ Gateway Failure: ${error.message}`;
        }
        msgDiv.innerHTML = `<div class="error">${errorMessage}</div>`;
    } finally {
        loginBtn.classList.remove("loading");
        loginBtn.disabled = false;
    }
}

/* ====================================
   TOGGLE SYSTEM INTERFACE MODAL VIEW
==================================== */
function toggleAuthViewMode() {
    const loginBtn = document.getElementById("loginBtn");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const nameContainer = document.getElementById("nameInputContainer");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const msgDiv = document.getElementById("msg");
    
    // Wipe runtime error logs on screen flip
    msgDiv.innerHTML = "";
    
    if (!isSignupMode) {
        authTitle.innerText = "📝 Register Account";
        authSubtitle.innerText = "Join the online student academy space";
        nameContainer.style.display = "block";
        loginBtn.innerText = "🚀 Register & Verify";
        loginBtn.onclick = executeSignup;
        toggleModeBtn.innerText = "🔐 Back to Login";
        isSignupMode = true;
    } else {
        authTitle.innerText = "🎓 Ernest Embassy LMS";
        authSubtitle.innerText = "Login to continue learning";
        nameContainer.style.display = "none";
        loginBtn.innerText = "🔐 Login";
        loginBtn.onclick = executeLogin;
        toggleModeBtn.innerText = "📝 Create New Account";
        isSignupMode = false;
    }
}

/* ====================================
   KEYBOARD NAVIGATION MAPS
==================================== */
document.getElementById("email").addEventListener("keypress", (event) => {
    if (event.key === "Enter") {
        document.getElementById("password").focus();
    }
});

document.getElementById("password").addEventListener("keypress", (event) => {
    if (event.key === "Enter") {
        if (isSignupMode) {
            executeSignup();
        } else {
            executeLogin();
        }
    }
});

/* ====================================
   SECURE AUTOMATIC ROUTE BALANCERS
==================================== */
async function runPortalInit() {
    // Rely on centralized library verification engine cleanly
    await initAuth(false);
    
    // Redirect cleanly if user session exists natively
    if (currentUser) {
        window.location.href = "dashboard.html";
    }
}

// Attach listeners safely
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runPortalInit);
} else {
    runPortalInit();
}
</script>

</body>
</html>
