<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert English Questions to JSON (With Explanations)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        h1 { color: #667eea; }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            margin: 10px 0;
            background: #f7fafc;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .result {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #00ff88;
        }
        .preview-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .explanation-highlight {
            background: #e8f5e9;
            padding: 5px;
            border-left: 3px solid #4caf50;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 English Language Converter (With Explanations)</h1>
        <p>Paste your English questions below. The converter extracts questions, options, answers, AND explanations.</p>
        
        <textarea id="input" rows="15" placeholder="Paste English questions here..."></textarea>
        
        <div>
            <button onclick="convertToJSON()">🔄 Convert to JSON</button>
            <button onclick="copyJSON()" id="copyBtn" style="display:none;">📋 Copy JSON</button>
            <button onclick="previewSample()">👁️ Preview Sample (Shows Explanations)</button>
        </div>
        
        <h2>JSON Output (Ready to Upload):</h2>
        <div class="result" id="output"></div>
        
        <div id="preview" class="preview-box" style="display:none;"></div>
    </div>

    <script>
        function convertToJSON() {
            const text = document.getElementById('input').value;
            const lines = text.split('\n');
            const questions = [];
            
            let currentQuestion = null;
            let currentOptions = [];
            let currentAnswer = '';
            let currentExplanation = '';
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                // Match question pattern: "1." or "**1.**" or "1."
                let qMatch = line.match(/^(\d+)\.\s+(.+)/);
                if (!qMatch) qMatch = line.match(/^\*\*(\d+)\.\*\*\s+(.+)/);
                
                if (qMatch) {
                    // Save previous question
                    if (currentQuestion && currentOptions.length === 4) {
                        questions.push({
                            question: currentQuestion,
                            optionA: currentOptions[0] || "",
                            optionB: currentOptions[1] || "",
                            optionC: currentOptions[2] || "",
                            optionD: currentOptions[3] || "",
                            answer: currentAnswer,
                            explanation: currentExplanation
                        });
                    }
                    currentQuestion = qMatch[2];
                    currentOptions = [];
                    currentAnswer = '';
                    currentExplanation = '';
                }
                
                // Match options: A) Text or A. Text
                let optMatch = line.match(/^([A-D])[\.\)]\s+(.+)/);
                if (optMatch && currentOptions.length < 4) {
                    currentOptions.push(optMatch[2]);
                }
                
                // Match answer and explanation - THIS CAPTURES THE EXPLANATION
                // Pattern: **Answer: X** (explanation text)
                let ansMatch = line.match(/\*\*Answer:\s*([A-D])\*\*\s*\(?(.*?)\)?\s*$/i);
                if (ansMatch) {
                    currentAnswer = ansMatch[1].toUpperCase();
                    let expText = ansMatch[2].trim();
                    // Remove any leftover parentheses
                    expText = expText.replace(/^[\(（]/, '').replace(/[\)）]$/, '');
                    currentExplanation = expText;
                    console.log(`Captured Answer: ${currentAnswer}, Explanation: ${currentExplanation}`);
                }
                
                // Pattern: Answer: X (explanation) - without bold
                if (!currentAnswer) {
                    let ansMatch2 = line.match(/Answer:\s*([A-D])\s*\(?(.*?)\)?\s*$/i);
                    if (ansMatch2) {
                        currentAnswer = ansMatch2[1].toUpperCase();
                        let expText = ansMatch2[2].trim();
                        expText = expText.replace(/^[\(（]/, '').replace(/[\)）]$/, '');
                        currentExplanation = expText;
                        console.log(`Captured (no bold): Answer: ${currentAnswer}, Explanation: ${currentExplanation}`);
                    }
                }
            }
            
            // Save last question
            if (currentQuestion && currentOptions.length === 4) {
                questions.push({
                    question: currentQuestion,
                    optionA: currentOptions[0] || "",
                    optionB: currentOptions[1] || "",
                    optionC: currentOptions[2] || "",
                    optionD: currentOptions[3] || "",
                    answer: currentAnswer,
                    explanation: currentExplanation
                });
            }
            
            if (questions.length === 0) {
                document.getElementById('output').innerHTML = '❌ No questions found! Please check your format.';
                return;
            }
            
            const jsonOutput = JSON.stringify(questions, null, 2);
            document.getElementById('output').innerHTML = jsonOutput;
            document.getElementById('copyBtn').style.display = 'inline-block';
            window.currentJSON = jsonOutput;
            
            let withExplanations = questions.filter(q => q.explanation && q.explanation.length > 0).length;
            document.getElementById('output').innerHTML += `\n\n✅ Converted ${questions.length} English questions!`;
            document.getElementById('output').innerHTML += `\n📝 ${withExplanations} questions have explanations ✓`;
            document.getElementById('output').innerHTML += `\n⚠️ ${questions.length - withExplanations} questions need explanations added.`;
        }
        
        function previewSample() {
            if (!window.currentJSON) {
                alert("Please convert the questions first!");
                return;
            }
            
            const questions = JSON.parse(window.currentJSON);
            const previewDiv = document.getElementById('preview');
            previewDiv.style.display = 'block';
            
            let html = '<h3>📋 Sample Preview (First 5 Questions with Explanations):</h3>';
            for (let i = 0; i < Math.min(5, questions.length); i++) {
                const q = questions[i];
                html += `
                    <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; background: white;">
                        <strong>Q${i+1}:</strong> ${q.question}<br>
                        <strong>A:</strong> ${q.optionA} | <strong>B:</strong> ${q.optionB} | <strong>C:</strong> ${q.optionC} | <strong>D:</strong> ${q.optionD}<br>
                        <strong style="color: #11998e;">Answer: ${q.answer}</strong><br>
                        <div class="explanation-highlight">
                            <strong>📖 Explanation:</strong> ${q.explanation || "(No explanation provided in document)"}
                        </div>
                    </div>
                `;
            }
            previewDiv.innerHTML = html;
        }
        
        function copyJSON() {
            if (window.currentJSON) {
                navigator.clipboard.writeText(window.currentJSON);
                alert("✅ JSON copied! Now go to Bulk Uploader, select 'English', paste and upload.");
            }
        }
    </script>
</body>
</html>
