<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ernest Embassy LMS Quiz Engine</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
text-align:center;
padding:20px;
font-weight:bold;
}

/* CONTAINER */
.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* QUESTION */
.question{
font-weight:bold;
margin-bottom:10px;
}

/* OPTIONS */
.option{
background:#f1f1f1;
padding:10px;
margin:5px 0;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.option:hover{background:#ddd;}

.correct{
background:#c8f7c5 !important;
border:2px solid green;
}

.wrong{
background:#ffcccc !important;
border:2px solid red;
}

/* EXPLANATION */
.explanation{
margin-top:10px;
padding:10px;
background:#f9f9f9;
border-left:4px solid #667eea;
display:none;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
margin-top:20px;
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.next{background:#667eea;color:white;}
.back{background:#555;color:white;}
.home{background:black;color:white;}

.score{
text-align:center;
font-size:20px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header" id="title">
🎓 LMS Quiz Engine
</div>

<div class="container">

<div class="score">
Score: <span id="score">0</span>
</div>

<div id="quiz"></div>

<div class="nav">
<button class="back" onclick="prevPage()">⬅ Back</button>
<button class="home" onclick="goHome()">🏠 Home</button>
<button class="next" onclick="nextPage()">Next ➡</button>
</div>

</div>

<script>

/* =========================
   FIREBASE CONFIG
========================= */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   MODE SYSTEM
========================= */
const urlParams = new URLSearchParams(window.location.search);
let mode = urlParams.get("mode") || "free";

/* UI TITLE */
if(mode === "paid"){
document.getElementById("title").innerText =
"🔴 Paid Challenge Quiz (₦100 Entry)";
}else{
document.getElementById("title").innerText =
"🟢 Free Test Mode";
}

/* =========================
   STATE
========================= */
let questions = [];
let page = 0;
let perPage = 5;
let score = 0;

/* =========================
   LOAD QUESTIONS
========================= */
async function loadQuestions(){

const snap = await db.collection("questions").get();

questions = [];

snap.forEach(doc=>{
questions.push(doc.data());
});

/* PAID MODE RANDOMIZATION */
if(mode === "paid"){
questions = questions.sort(()=>Math.random()-0.5);
}

render();
}

/* =========================
   RENDER
========================= */
function render(){

let start = page * perPage;
let end = start + perPage;

let slice = questions.slice(start,end);

let html = "";

slice.forEach((q)=>{

html += `<div class="card">
<div class="question">${q.q}</div>`;

q.o.forEach((opt,oi)=>{
html += `
<div class="option"
onclick="check(this,${oi},${q.a},'${q.exp}')">
${opt}
</div>`;
});

html += `<div class="explanation"></div></div>`;
});

document.getElementById("quiz").innerHTML = html;
}

/* =========================
   ANSWER CHECK
========================= */
function check(el,selected,correct,exp){

let parent = el.parentElement;
let options = parent.querySelectorAll(".option");
let explanation = parent.querySelector(".explanation");

if(parent.classList.contains("done")) return;
parent.classList.add("done");

options.forEach((o,i)=>{
if(i === correct){
o.classList.add("correct");
}
});

if(selected === correct){
el.classList.add("correct");
score++;
document.getElementById("score").innerText = score;
}else{
el.classList.add("wrong");
}

explanation.innerHTML = "📖 " + exp;
explanation.style.display = "block";
}

/* =========================
   NAVIGATION
========================= */
function nextPage(){
if((page+1)*perPage < questions.length){
page++;
render();
}
}

function prevPage(){
if(page>0){
page--;
render();
}
}

function goHome(){
window.location.href = "class.html";
}

/* INIT */
loadQuestions();

</script>

</body>
</html>
