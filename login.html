<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ernest Embassy Digital Solutions</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
    margin: 0;
}

nav {
    background: #1a1a2e;
    padding: 15px;
    color: white;
}

.container {
    max-width: 450px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #1a1a2e;
}

p {
    text-align: center;
    color: #666;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #5a67d8;
}

.error {
    background: #ffdddd;
    color: red;
    padding: 10px;
    margin-bottom: 10px;
    display: none;
    border-radius: 8px;
}

.link {
    text-align: center;
    margin-top: 15px;
}

.link a {
    color: #667eea;
    text-decoration: none;
}
</style>
</head>

<body>

<nav>
🔐 Ernest Embassy Digital Solutions - Login
</nav>

<div class="container">

<h1>Welcome Back</h1>
<p>Login to access your learning dashboard</p>

<div id="errorBox" class="error"></div>

<form id="loginForm">
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<div class="link">
    <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD6xpH_zLnoJP2PTSMHg80R94_Vd-fUZSA",
    authDomain: "ernest-embassy-travel-website.firebaseapp.com",
    projectId: "ernest-embassy-travel-website",
    storageBucket: "ernest-embassy-travel-website.firebasestorage.app",
    messagingSenderId: "831442789419",
    appId: "1:831442789419:web:1845791aafb7ac9d31366e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* =========================
   GLOBAL LMS SESSION FORMAT
   ========================= */
function createSessionUser(user) {
    return {
        uid: user.uid,
        email: user.email,
        name: user.displayName || user.email.split("@")[0],
        loginTime: new Date().toISOString()
    };
}

/* =========================
   AUTO LOGIN CHECK
   ========================= */
auth.onAuthStateChanged((user) => {
    if (user) {
        const sessionUser = createSessionUser(user);
        localStorage.setItem("currentUser", JSON.stringify(sessionUser));
        window.location.href = "dashboard.html";
    }
});

/* =========================
   LOGIN HANDLER
   ========================= */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("errorBox");

    errorBox.style.display = "none";

    try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        if (!user.emailVerified) {
            errorBox.innerText = "Please verify your email before login.";
            errorBox.style.display = "block";
            await auth.signOut();
            return;
        }

        // 🔐 IMPORTANT LMS SESSION (USED BY CLASS.HTML + COURSE.HTML)
        const sessionUser = createSessionUser(user);

        localStorage.setItem("currentUser", JSON.stringify(sessionUser));

        // OPTIONAL FLAG (used by some of your pages)
        localStorage.setItem("userLoggedIn", "true");

        // 🚀 REDIRECT
        window.location.href = "dashboard.html";

    } catch (error) {
        errorBox.innerText = error.message;
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
