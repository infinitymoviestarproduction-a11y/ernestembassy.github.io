<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete All Questions - Fixed</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #eb3349; }
        button {
            padding: 15px 25px;
            font-size: 16px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-danger { background: #eb3349; color: white; }
        .btn-success { background: #11998e; color: white; }
        .btn-info { background: #3498db; color: white; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #1a1a2e;
            color: #00ff88;
            border-radius: 10px;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 25px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            width: 0%;
            transition: width 0.3s;
            border-radius: 12px;
        }
        .stats {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Delete 9,262 Documents</h1>
        <p>This will delete ALL individual question documents (9,261 of them)</p>
        
        <div class="stats" id="stats">
            <strong>📊 Current Status:</strong><br>
            Click "Start Deletion" to begin...
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div>
            <button class="btn-info" onclick="countOnly()">📊 Count Only</button>
            <button class="btn-danger" onclick="startDeletion()">🗑️ START DELETION (9,261 docs)</button>
            <button class="btn-success" onclick="keepOnlySubject()">📁 Keep Only Subject Docs</button>
        </div>
        
        <div id="result" class="result">
            Ready. Click "Start Deletion" to delete 9,261 individual question documents.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
            authDomain: "ernest-embassy-lms.firebaseapp.com",
            projectId: "ernest-embassy-lms",
            storageBucket: "ernest-embassy-lms.firebasestorage.app",
            messagingSenderId: "204896421221",
            appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const resultDiv = document.getElementById('result');
        const statsDiv = document.getElementById('stats');
        const progressFill = document.getElementById('progressFill');
        
        let isDeleting = false;
        
        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            resultDiv.innerHTML += `<div>[${timestamp}] ${msg}</div>`;
            resultDiv.scrollTop = resultDiv.scrollHeight;
            console.log(msg);
        }
        
        function clearLog() {
            resultDiv.innerHTML = '';
        }
        
        async function countOnly() {
            clearLog();
            log("📊 Counting documents...");
            
            try {
                const snapshot = await db.collection("questions").get();
                let subjectCount = 0;
                let individualCount = 0;
                let subjectIds = [];
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    if (data.questions && Array.isArray(data.questions)) {
                        subjectCount++;
                        subjectIds.push(doc.id);
                    } else {
                        individualCount++;
                    }
                }
                
                log(`✅ Total documents: ${snapshot.size}`);
                log(`📁 Subject documents (KEEP): ${subjectCount} - ${subjectIds.join(', ')}`);
                log(`⚠️ Individual question docs (DELETE): ${individualCount}`);
                
                statsDiv.innerHTML = `
                    <strong>📊 Current Status:</strong><br>
                    Total: ${snapshot.size} documents<br>
                    ✅ Keep: ${subjectCount} subject document(s)<br>
                    🗑️ Delete: ${individualCount} individual questions<br>
                    ${individualCount > 0 ? `⚠️ Need to delete ${individualCount} documents` : '✅ Database is clean!'}
                `;
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        }
        
        async function keepOnlySubject() {
            if (isDeleting) {
                log("⚠️ Deletion already in progress. Please wait.");
                return;
            }
            
            clearLog();
            log("🎯 Starting deletion of individual question documents only...");
            log("📁 Subject documents will be KEPT.");
            
            try {
                const snapshot = await db.collection("questions").get();
                
                // Collect individual question docs
                const individualDocs = [];
                let subjectDocs = [];
                
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    if (data.questions && Array.isArray(data.questions)) {
                        subjectDocs.push(doc.id);
                    } else {
                        individualDocs.push(doc);
                    }
                }
                
                log(`📊 Found ${individualDocs.length} individual question documents to delete.`);
                log(`📁 Keeping ${subjectDocs.length} subject document(s): ${subjectDocs.join(', ')}`);
                
                if (individualDocs.length === 0) {
                    log("✅ No individual documents found! Database is clean.");
                    return;
                }
                
                await deleteInBatches(individualDocs, "individual question documents");
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        }
        
        async function startDeletion() {
            if (isDeleting) {
                log("⚠️ Deletion already in progress. Please wait.");
                return;
            }
            
            if (!confirm("⚠️⚠️⚠️ DANGER: This will delete ALL 9,261 individual question documents!\n\nThe subject document 'mathematics-ss1' will be KEPT.\n\nContinue?")) {
                log("Deletion cancelled.");
                return;
            }
            
            clearLog();
            await keepOnlySubject();
        }
        
        async function deleteInBatches(docsToDelete, type) {
            isDeleting = true;
            const BATCH_SIZE = 100; // Delete 100 at a time
            const totalDocs = docsToDelete.length;
            let deleted = 0;
            let failedBatches = 0;
            
            progressFill.style.width = '0%';
            log(`🔄 Starting deletion of ${totalDocs} ${type}...`);
            log(`📦 Batch size: ${BATCH_SIZE} documents per batch`);
            log(`⏱️ This may take a few minutes...`);
            
            for (let i = 0; i < totalDocs; i += BATCH_SIZE) {
                const batch = db.batch();
                const batchDocs = docsToDelete.slice(i, i + BATCH_SIZE);
                
                batchDocs.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                try {
                    await batch.commit();
                    deleted += batchDocs.length;
                    const percent = (deleted / totalDocs) * 100;
                    progressFill.style.width = `${percent}%`;
                    log(`✅ Batch ${Math.floor(i/BATCH_SIZE) + 1}: Deleted ${batchDocs.length} docs (Total: ${deleted}/${totalDocs} - ${Math.round(percent)}%)`);
                } catch (error) {
                    failedBatches++;
                    log(`❌ Batch ${Math.floor(i/BATCH_SIZE) + 1} failed: ${error.message} - retrying...`);
                    // Retry this batch
                    i -= BATCH_SIZE;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            isDeleting = false;
            
            if (failedBatches === 0) {
                log(`✅✅✅ COMPLETE! Successfully deleted ${deleted} ${type}!`);
                log(`💡 Your database is now clean!`);
            } else {
                log(`⚠️ Completed with ${failedBatches} failed batches. Some documents may remain.`);
            }
            
            // Final count
            await countOnly();
        }
        
        // Auto-run count on page load
        countOnly();
    </script>
</body>
</html>
