<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMS Admin Panel - Firebase Connected</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
}

.header{
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
color:#333;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

input, textarea, select{
width:100%;
padding:12px;
margin:8px 0 15px 0;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;
}

textarea{
height:120px;
resize:none;
}

button{
background:#667eea;
color:white;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
width:100%;
font-size:16px;
transition:0.3s;
}

button:hover{
background:#5a67d8;
transform:scale(1.02);
}

.success{
color:green;
font-weight:bold;
margin-top:10px;
}

.error{
color:red;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
⚙️ LMS ADMIN PANEL (Firebase Engine)
</div>

<div class="container">

<!-- QUESTION SECTION -->
<div class="card">
<h2>➕ Add Question</h2>

<input id="q" placeholder="Enter question">

<input id="o1" placeholder="Option 1">
<input id="o2" placeholder="Option 2">
<input id="o3" placeholder="Option 3">
<input id="o4" placeholder="Option 4">

<select id="ans">
<option value="">Select Correct Answer Index</option>
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>

<textarea id="exp" placeholder="Explanation"></textarea>

<button onclick="saveQuestion()">💾 Save Question</button>

<div id="qMsg"></div>
</div>

<!-- LESSON SECTION -->
<div class="card">
<h2>📚 Add Lesson</h2>

<input id="title" placeholder="Lesson Title">

<textarea id="content" placeholder="Lesson Content"></textarea>

<button onclick="saveLesson()">💾 Save Lesson</button>

<div id="lMsg"></div>
</div>

</div>

<script>

/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",

authDomain: "ernest-embassy-lms.firebaseapp.com",

projectId: "ernest-embassy-lms",

storageBucket: "ernest-embassy-lms.firebasestorage.app",

messagingSenderId: "204896421221",

appId: "1:204896421221:web:9407b523da68c3e5b88d8c"

};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= SAVE QUESTION ================= */

async function saveQuestion(){

let q = document.getElementById("q").value.trim();
let o1 = document.getElementById("o1").value.trim();
let o2 = document.getElementById("o2").value.trim();
let o3 = document.getElementById("o3").value.trim();
let o4 = document.getElementById("o4").value.trim();
let a = document.getElementById("ans").value;
let exp = document.getElementById("exp").value.trim();

if(!q || !o1 || !o2 || !o3 || !o4 || !exp || a === ""){
document.getElementById("qMsg").innerHTML =
"<p class='error'>⚠️ Please fill all fields properly</p>";
return;
}

try{

await db.collection("questions").add({
q,
o:[o1,o2,o3,o4],
a:Number(a),
exp,
createdAt:new Date()
});

/* reset */
document.getElementById("q").value="";
document.getElementById("o1").value="";
document.getElementById("o2").value="";
document.getElementById("o3").value="";
document.getElementById("o4").value="";
document.getElementById("exp").value="";
document.getElementById("ans").value="";

document.getElementById("qMsg").innerHTML =
"<p class='success'>✅ Question saved successfully!</p>";

}catch(err){
console.error(err);
document.getElementById("qMsg").innerHTML =
"<p class='error'>❌ Failed to save question</p>";
}

}

/* ================= SAVE LESSON ================= */

async function saveLesson(){

let title = document.getElementById("title").value.trim();
let content = document.getElementById("content").value.trim();

if(!title || !content){
document.getElementById("lMsg").innerHTML =
"<p class='error'>⚠️ Fill all fields properly</p>";
return;
}

try{

await db.collection("lessons").add({
title,
content,
createdAt:new Date()
});

/* reset */
document.getElementById("title").value="";
document.getElementById("content").value="";

document.getElementById("lMsg").innerHTML =
"<p class='success'>✅ Lesson saved successfully!</p>";

}catch(err){
console.error(err);
document.getElementById("lMsg").innerHTML =
"<p class='error'>❌ Failed to save lesson</p>";
}

}

</script>

</body>
</html>
