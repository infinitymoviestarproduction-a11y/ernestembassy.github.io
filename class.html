<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Classroom - Ernest Embassy Digital Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
        }

        nav {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 0.65rem;
            color: rgba(255, 215, 0, 0.8);
            display: block;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 0;
            font-size: 0.8rem;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .auth-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #f0f0f5;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .auth-form {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .dashboard-section {
            display: none;
        }

        .dashboard-section.active {
            display: block;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .resource-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .resource-card:hover {
            transform: translateY(-5px);
        }

        .resource-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge-free {
            background: #28a745;
            color: white;
        }

        .badge-premium {
            background: #ffc107;
            color: #1a1a2e;
        }

        .resource-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin-left: 15px;
        }

        footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<!-- NAVIGATION -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <span class="logo-icon">🎓</span>
            <div>
                <span class="logo-text">Ernest Embassy</span>
                <span class="logo-sub">Digital Solutions</span>
            </div>
        </div>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <h1>🎓 Online Classroom</h1>
    <p>Access free educational resources, practice questions, and premium learning materials</p>
</div>

<div class="container">

    <!-- AUTH SECTION -->
    <div id="authSection">
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="showTab('login')">🔐 Login</button>
            <button class="tab-btn" onclick="showTab('register')">📝 Register</button>
        </div>

        <!-- LOGIN -->
        <div id="loginForm" class="auth-form active">
            <form onsubmit="loginUser(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button class="btn-primary">Login</button>
            </form>
        </div>

        <!-- REGISTER -->
        <div id="registerForm" class="auth-form">
            <form onsubmit="registerUser(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button class="btn-primary">Register</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="dashboard-section">

        <div class="welcome-banner">
            <h2>Welcome <span id="userName"></span></h2>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="resources-grid">

            <div class="resource-card">
                <h3>Digital Technology</h3>
                <a href="senior-secondary-resources/digital-technology/index.html">Start</a>
            </div>

            <div class="resource-card">
                <h3>Mathematics</h3>
                <a href="senior-secondary-resources/mathematics/index.html">Start</a>
            </div>

            <div class="resource-card">
                <h3>English</h3>
                <a href="senior-secondary-resources/english-language/index.html">Start</a>
            </div>

            <div class="resource-card">
                <h3>Igbo</h3>
                <a href="senior-secondary-resources/igbo-language/index.html">Start</a>
            </div>

        </div>
    </div>

</div>

<!-- 🔐 LOGIN PROTECTION ADDED HERE -->
<script>
if (localStorage.getItem('currentUser') === null) {
    window.location.href = "login.html";
}
</script>

<script>
let currentUser = JSON.parse(localStorage.getItem('currentUser'));

function showTab(tab){
    document.getElementById('loginForm').classList.toggle('active', tab==='login');
    document.getElementById('registerForm').classList.toggle('active', tab==='register');
}

function registerUser(e){
    e.preventDefault();
    const user = {
        name: regName.value,
        email: regEmail.value,
        password: regPassword.value
    };
    localStorage.setItem('currentUser', JSON.stringify(user));
    location.reload();
}

function loginUser(e){
    e.preventDefault();
    localStorage.setItem('currentUser', JSON.stringify({
        name: loginEmail.value,
        email: loginEmail.value
    }));
    location.reload();
}

function logout(){
    localStorage.removeItem('currentUser');
    location.reload();
}

document.getElementById('userName').innerText = currentUser?.name || '';
</script>

</body>
</html>
