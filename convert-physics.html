<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Physics Questions to JSON</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        h1, h2 { color: #667eea; }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            margin: 10px 0;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .result {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: #11998e; }
        .error { color: #eb3349; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Physics Questions Converter</h1>
        <p>Paste your Physics questions text below and click "Convert to JSON"</p>
        
        <h2>1. Paste Physics Questions Here:</h2>
        <textarea id="input" rows="15" placeholder="Paste your Physics questions with format:
### 1. Which of the following is a vector quantity?
A. Distance
B. Speed
C. Velocity
D. Density

**Answer: C. Velocity**
**Explanation:** Velocity has both magnitude and direction..."></textarea>
        
        <button onclick="convertToJSON()">🔄 Convert to JSON</button>
        <button onclick="copyJSON()" id="copyBtn" style="display:none;">📋 Copy JSON</button>
        
        <h2>2. JSON Output (Copy this to Bulk Uploader):</h2>
        <div class="result" id="output">
            Waiting for conversion...
        </div>
    </div>

    <script>
        function convertToJSON() {
            const inputText = document.getElementById('input').value;
            if (!inputText.trim()) {
                alert("Please paste your Physics questions first!");
                return;
            }
            
            const questions = [];
            const lines = inputText.split('\n');
            
            let currentQuestion = null;
            let currentOptions = [];
            let currentAnswer = '';
            let currentExplanation = '';
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                // Match question number format: "### 1." or "### 1." or just "1."
                const questionMatch = line.match(/^#{0,3}\s*(\d+)\.\s*(.+)/);
                if (questionMatch) {
                    // Save previous question
                    if (currentQuestion && currentOptions.length === 4) {
                        questions.push({
                            question: currentQuestion,
                            optionA: currentOptions[0] || "",
                            optionB: currentOptions[1] || "",
                            optionC: currentOptions[2] || "",
                            optionD: currentOptions[3] || "",
                            answer: currentAnswer,
                            explanation: currentExplanation
                        });
                    }
                    
                    // Start new question
                    currentQuestion = questionMatch[2];
                    currentOptions = [];
                    currentAnswer = '';
                    currentExplanation = '';
                }
                
                // Match options: "A. Text" or "A. Text"
                const optionMatch = line.match(/^([A-D])\.\s+(.+)/);
                if (optionMatch && currentOptions.length < 4) {
                    currentOptions.push(optionMatch[2]);
                }
                
                // Match answer: "**Answer: C. Velocity**" or "Answer: C"
                const answerMatch = line.match(/\*\*Answer:\s*([A-D])/i);
                if (answerMatch) {
                    currentAnswer = answerMatch[1].toUpperCase();
                }
                
                // Match explanation
                const explanationMatch = line.match(/\*\*Explanation:\*\*\s*(.+)/i);
                if (explanationMatch) {
                    currentExplanation = explanationMatch[1];
                }
            }
            
            // Save last question
            if (currentQuestion && currentOptions.length === 4) {
                questions.push({
                    question: currentQuestion,
                    optionA: currentOptions[0] || "",
                    optionB: currentOptions[1] || "",
                    optionC: currentOptions[2] || "",
                    optionD: currentOptions[3] || "",
                    answer: currentAnswer,
                    explanation: currentExplanation
                });
            }
            
            if (questions.length === 0) {
                document.getElementById('output').innerHTML = '<span class="error">No questions found! Please check your format.</span>';
                return;
            }
            
            // Display JSON
            const jsonOutput = JSON.stringify(questions, null, 2);
            document.getElementById('output').innerHTML = `<pre style="margin:0; white-space:pre-wrap; word-wrap:break-word;">${jsonOutput}</pre>`;
            document.getElementById('copyBtn').style.display = 'inline-block';
            
            // Store for copying
            window.currentJSON = jsonOutput;
            
            document.getElementById('output').innerHTML += `<br><span class="success">✅ Successfully converted ${questions.length} questions!</span>`;
        }
        
        function copyJSON() {
            if (window.currentJSON) {
                navigator.clipboard.writeText(window.currentJSON);
                alert("JSON copied to clipboard! Now go to Bulk Uploader and paste it.");
            }
        }
    </script>
</body>
</html>
