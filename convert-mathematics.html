<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Mathematics Questions to JSON (with Explanations)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        h1 { color: #667eea; }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: monospace;
            font-size: 13px;
            margin: 10px 0;
            background: #f7fafc;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .result {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #00ff88;
        }
        .success { color: #00ff88; }
        .preview-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Mathematics Converter (With Explanations)</h1>
        <p>Paste your Mathematics questions below. The converter extracts questions, options, answers, AND explanations.</p>
        
        <textarea id="input" rows="15" placeholder="Paste Mathematics questions here..."></textarea>
        
        <div>
            <button onclick="convertToJSON()">🔄 Convert to JSON</button>
            <button onclick="copyJSON()" id="copyBtn" style="display:none;">📋 Copy JSON</button>
            <button onclick="previewSample()">👁️ Preview Sample</button>
        </div>
        
        <h2>JSON Output (Ready to Upload):</h2>
        <div class="result" id="output"></div>
        
        <div id="preview" class="preview-box" style="display:none;"></div>
    </div>

    <script>
        function convertToJSON() {
            const text = document.getElementById('input').value;
            const lines = text.split('\n');
            const questions = [];
            
            let currentQuestion = null;
            let currentOptions = [];
            let currentAnswer = '';
            let currentExplanation = '';
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                // Match question number: "1." or "**1.**"
                let qMatch = line.match(/^(\d+)\.\s+(.+)/);
                if (!qMatch) qMatch = line.match(/^\*\*(\d+)\.\*\*\s+(.+)/);
                
                if (qMatch) {
                    // Save previous question
                    if (currentQuestion && currentOptions.length === 4) {
                        questions.push({
                            question: currentQuestion,
                            optionA: currentOptions[0] || "",
                            optionB: currentOptions[1] || "",
                            optionC: currentOptions[2] || "",
                            optionD: currentOptions[3] || "",
                            answer: currentAnswer,
                            explanation: currentExplanation
                        });
                    }
                    currentQuestion = qMatch[2];
                    currentOptions = [];
                    currentAnswer = '';
                    currentExplanation = '';
                }
                
                // Match options: A) Text or A. Text
                let optMatch = line.match(/^([A-D])[\.\)]\s+(.+)/);
                if (optMatch && currentOptions.length < 4) {
                    currentOptions.push(optMatch[2]);
                }
                
                // Match answer and explanation - Multiple patterns
                // Pattern 1: **Answer: B** (explanation)
                let ansMatch = line.match(/\*\*Answer:\s*([A-D])\*\*\s*\(?(.*?)\)?\s*$/i);
                if (ansMatch) {
                    currentAnswer = ansMatch[1].toUpperCase();
                    currentExplanation = ansMatch[2].trim();
                    // Clean up explanation
                    currentExplanation = currentExplanation.replace(/^[\(（]/, '').replace(/[\)）]$/, '');
                }
                
                // Pattern 2: **Answer: B** explanation (no parentheses)
                if (!currentAnswer) {
                    let ansMatch2 = line.match(/\*\*Answer:\s*([A-D])\*\*\s+(.+)/i);
                    if (ansMatch2) {
                        currentAnswer = ansMatch2[1].toUpperCase();
                        currentExplanation = ansMatch2[2].trim();
                    }
                }
                
                // Pattern 3: Answer: B (explanation) - no bold
                if (!currentAnswer) {
                    let ansMatch3 = line.match(/Answer:\s*([A-D])\s*\(?(.*?)\)?\s*$/i);
                    if (ansMatch3) {
                        currentAnswer = ansMatch3[1].toUpperCase();
                        currentExplanation = ansMatch3[2].trim();
                    }
                }
                
                // Also capture explanation that might be on next line
                if (currentAnswer && !currentExplanation && i + 1 < lines.length) {
                    let nextLine = lines[i + 1].trim();
                    if (nextLine.startsWith('(') || nextLine.includes('explanation')) {
                        currentExplanation = nextLine.replace(/[\(\)]/g, '');
                    }
                }
            }
            
            // Save last question
            if (currentQuestion && currentOptions.length === 4) {
                questions.push({
                    question: currentQuestion,
                    optionA: currentOptions[0] || "",
                    optionB: currentOptions[1] || "",
                    optionC: currentOptions[2] || "",
                    optionD: currentOptions[3] || "",
                    answer: currentAnswer,
                    explanation: currentExplanation
                });
            }
            
            if (questions.length === 0) {
                document.getElementById('output').innerHTML = '❌ No questions found! Please check your format.';
                return;
            }
            
            const jsonOutput = JSON.stringify(questions, null, 2);
            document.getElementById('output').innerHTML = jsonOutput;
            document.getElementById('copyBtn').style.display = 'inline-block';
            window.currentJSON = jsonOutput;
            
            let withExplanations = questions.filter(q => q.explanation && q.explanation.length > 0).length;
            document.getElementById('output').innerHTML += `\n\n✅ Converted ${questions.length} Mathematics questions!`;
            document.getElementById('output').innerHTML += `\n📝 ${withExplanations} have explanations, ${questions.length - withExplanations} need explanations added.`;
        }
        
        function previewSample() {
            if (!window.currentJSON) {
                alert("Please convert the questions first!");
                return;
            }
            
            const questions = JSON.parse(window.currentJSON);
            const previewDiv = document.getElementById('preview');
            previewDiv.style.display = 'block';
            
            let html = '<h3>📋 Sample Preview (First 3 Questions):</h3>';
            for (let i = 0; i < Math.min(3, questions.length); i++) {
                const q = questions[i];
                html += `
                    <div style="border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px;">
                        <strong>Q${i+1}:</strong> ${q.question}<br>
                        <strong>A:</strong> ${q.optionA} | <strong>B:</strong> ${q.optionB} | <strong>C:</strong> ${q.optionC} | <strong>D:</strong> ${q.optionD}<br>
                        <strong>Answer:</strong> ${q.answer}<br>
                        <strong>Explanation:</strong> ${q.explanation || "(No explanation)"}
                    </div>
                `;
            }
            previewDiv.innerHTML = html;
        }
        
        function copyJSON() {
            if (window.currentJSON) {
                navigator.clipboard.writeText(window.currentJSON);
                alert("✅ JSON copied! Now go to Bulk Uploader, select 'Mathematics', paste and upload.");
            }
        }
    </script>
</body>
</html>
