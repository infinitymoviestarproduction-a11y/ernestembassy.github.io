<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Ernest Embassy LMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:linear-gradient(135deg,#f5f7fa,#e9ecef);
}

/* NAV */
nav{
    background:#1a1a2e;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.nav-left{
    display:flex;
    gap:10px;
}

.btn{
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    color:white;
}

.home{ background:#667eea; }
.login{ background:#28a745; }

/* REGISTER CARD */
.container{
    max-width:500px;
    margin:70px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1a1a2e;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#667eea;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#5a67d8;
}

.error{
    display:none;
    background:#ffdddd;
    color:red;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.success{
    display:none;
    background:#ddffdd;
    color:green;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.footer-text{
    text-align:center;
    margin-top:15px;
}

.footer-text a{
    color:#667eea;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="nav-left">
        <a class="btn home" href="index.html">🏠 Home</a>
        <a class="btn login" href="login.html">🔐 Login</a>
    </div>

    <div>
        🎓 Ernest Embassy LMS
    </div>
</nav>

<!-- REGISTER -->
<div class="container">

    <h1>Create Account</h1>
    <p>Join the learning platform today</p>

    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <form id="registerForm">

        <input type="text" id="fullName" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="tel" id="phone" placeholder="Phone Number">

        <input type="password" id="password" placeholder="Password (min 6 chars)" required>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Create Account</button>

    </form>

    <div class="footer-text">
        Already have an account?
        <a href="login.html">Login here</a>
    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
/* =========================
   FIREBASE INIT
========================= */
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* =========================
   REGISTER HANDLER
========================= */
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    errorBox.style.display = "none";
    successBox.style.display = "none";

    if (password !== confirmPassword) {
        errorBox.innerText = "Passwords do not match!";
        errorBox.style.display = "block";
        return;
    }

    if (password.length < 6) {
        errorBox.innerText = "Password must be at least 6 characters!";
        errorBox.style.display = "block";
        return;
    }

    try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        const user = result.user;

        await user.updateProfile({
            displayName: fullName
        });

        await db.collection("users").doc(user.uid).set({
            fullName,
            email,
            phone,
            role: "student",
            createdAt: new Date()
        });

        await user.sendEmailVerification();

        successBox.innerText = "Account created successfully! Please verify your email.";
        successBox.style.display = "block";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 3000);

    } catch (error) {
        errorBox.innerText = error.message;
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
