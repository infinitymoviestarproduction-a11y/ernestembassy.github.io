<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Player - LMS</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #1a1a2e;
    color: white;
    padding: 20px;
    text-align: center;
}

/* TOP USER BAR (Udemy-style) */
.user-bar {
    background: #fff;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
    font-size: 14px;
}

.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 25%;
    background: white;
    padding: 20px;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

.lesson {
    padding: 12px;
    margin-bottom: 10px;
    background: #f0f0f0;
    cursor: pointer;
    border-radius: 8px;
}

.lesson:hover {
    background: #ddd;
}

.lesson.active {
    background: #667eea;
    color: white;
}

/* Content */
.content {
    flex: 1;
    padding: 30px;
}

.lesson-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.logout {
    background: crimson;
    margin-left: 10px;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN PROTECTION (REQUIRED) -->
<script>
const user = JSON.parse(localStorage.getItem("currentUser"));
if (!user) {
    window.location.href = "login.html";
}
</script>

<!-- HEADER -->
<header>
    <h1>🎓 LMS Course Player</h1>
</header>

<!-- USER BAR (Udemy style) -->
<div class="user-bar">
    <div>
        Logged in as: <b id="userName"></b>
    </div>
    <div>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Lessons</h3>
        <div id="lessonList"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div class="lesson-box">
            <h2 id="lessonTitle">Welcome</h2>
            <p id="lessonContent">Select a lesson to begin learning.</p>

            <button onclick="nextLesson()">Next Lesson</button>
        </div>
    </div>

</div>

<script>
document.getElementById("userName").innerText = user.name || "Student";

// COURSE DATA (later upgrade to JSON / Firestore)
const course = {
    title: "Digital Technology SS1",
    lessons: [
        {
            title: "Introduction to Computer",
            content: "A computer is an electronic device that processes data into information."
        },
        {
            title: "Input Devices",
            content: "Input devices include keyboard, mouse, scanner."
        },
        {
            title: "Output Devices",
            content: "Output devices include monitor, printer, speakers."
        }
    ]
};

let currentIndex = 0;

function loadLessons() {
    const list = document.getElementById("lessonList");
    list.innerHTML = "";

    course.lessons.forEach((lesson, index) => {
        list.innerHTML += `
            <div class="lesson" onclick="openLesson(${index})">
                ${index + 1}. ${lesson.title}
            </div>
        `;
    });
}

function openLesson(index) {
    currentIndex = index;

    document.getElementById("lessonTitle").innerText = course.lessons[index].title;
    document.getElementById("lessonContent").innerText = course.lessons[index].content;

    highlightLesson(index);
}

function highlightLesson(index){
    const items = document.querySelectorAll(".lesson");
    items.forEach((el, i) => {
        el.classList.toggle("active", i === index);
    });
}

function nextLesson() {
    if (currentIndex < course.lessons.length - 1) {
        currentIndex++;
        openLesson(currentIndex);
    } else {
        alert("🎉 Course Completed!");
    }
}

function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}

loadLessons();
openLesson(0);
</script>

</body>
</html>
