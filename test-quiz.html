<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LMS Quiz Engine - Secure Exam Mode</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef2f7;
user-select:none;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
text-align:center;
padding:20px;
font-weight:bold;
}

/* TIMER */
.timer{
text-align:center;
font-size:22px;
font-weight:bold;
color:#dc3545;
margin-top:10px;
}

/* CONTAINER */
.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* QUESTION */
.question{
font-weight:bold;
margin-bottom:10px;
}

/* OPTIONS */
.option{
background:#f1f1f1;
padding:10px;
margin:5px 0;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.option:hover{background:#ddd;}

.correct{
background:#c8f7c5 !important;
border:2px solid green;
}

.wrong{
background:#ffcccc !important;
border:2px solid red;
}

/* EXPLANATION */
.explanation{
margin-top:10px;
padding:10px;
background:#f9f9f9;
border-left:4px solid #667eea;
display:none;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
margin-top:20px;
}

button{
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.next{background:#667eea;color:white;}
.back{background:#555;color:white;}
.home{background:black;color:white;}

.score{
text-align:center;
font-size:20px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">
🎓 LMS Secure Quiz Engine (Paid + Free Mode)
</div>

<div class="timer">
⏱ Time Left: <span id="time">10:00</span>
</div>

<div class="container">

<div class="score">
Score: <span id="score">0</span>
</div>

<div id="quiz"></div>

<div class="nav">
<button class="back" onclick="prevPage()">⬅ Back</button>
<button class="home" onclick="goHome()">🏠 Exit</button>
<button class="next" onclick="nextPage()">Next ➡</button>
</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* MODE */
const urlParams = new URLSearchParams(window.location.search);
let mode = urlParams.get("mode") || "free";

/* TIMER SETTINGS */
let totalTime = mode === "paid" ? 600 : 1200; // 10 min paid, 20 min free
let timeLeft = totalTime;

/* SECURITY FLAGS */
let examLocked = false;
let tabSwitchCount = 0;

/* QUESTIONS */
let questions = [];
let page = 0;
let perPage = 5;
let score = 0;

/* TIMER */
function startTimer(){

let timer = setInterval(()=>{

if(examLocked) return;

let min = Math.floor(timeLeft / 60);
let sec = timeLeft % 60;

document.getElementById("time").innerText =
`${min}:${sec < 10 ? "0"+sec : sec}`;

timeLeft--;

if(timeLeft < 0){
clearInterval(timer);
lockExam();
}

},1000);

}

/* LOCK EXAM */
function lockExam(){
examLocked = true;
alert("⛔ Time is up! Exam submitted automatically.");
window.location.href = "class.html";
}

/* SECURITY: TAB SWITCH DETECTION */
document.addEventListener("visibilitychange", ()=>{
if(document.hidden && mode === "paid"){
tabSwitchCount++;

if(tabSwitchCount >= 3){
alert("🚫 Suspicious activity detected. Exam locked.");
lockExam();
}else{
alert("⚠ Warning: Do not leave the exam tab!");
}
}
});

/* LOAD QUESTIONS */
async function loadQuestions(){

const snap = await db.collection("questions").get();

questions = [];

snap.forEach(doc=>{
questions.push(doc.data());
});

/* shuffle in paid mode */
if(mode === "paid"){
questions.sort(()=>Math.random()-0.5);
}

render();
startTimer();
}

/* RENDER */
function render(){

let start = page * perPage;
let end = start + perPage;

let slice = questions.slice(start,end);

let html = "";

slice.forEach(q=>{

html += `<div class="card">
<div class="question">${q.q}</div>`;

q.o.forEach((opt,oi)=>{
html += `
<div class="option"
onclick="check(this,${oi},${q.a},'${q.exp}')">
${opt}
</div>`;
});

html += `<div class="explanation"></div></div>`;
});

document.getElementById("quiz").innerHTML = html;
}

/* CHECK ANSWER */
function check(el,selected,correct,exp){

if(examLocked) return;

let parent = el.parentElement;
let options = parent.querySelectorAll(".option");
let explanation = parent.querySelector(".explanation");

if(parent.classList.contains("done")) return;
parent.classList.add("done");

options.forEach((o,i)=>{
if(i === correct){
o.classList.add("correct");
}
});

if(selected === correct){
el.classList.add("correct");
score++;
document.getElementById("score").innerText = score;
}else{
el.classList.add("wrong");
}

explanation.innerHTML = "📖 " + exp;
explanation.style.display = "block";
}

/* NAV */
function nextPage(){
if((page+1)*perPage < questions.length){
page++;
render();
}
}

function prevPage(){
if(page>0){
page--;
render();
}
}

function goHome(){
window.location.href = "class.html";
}

loadQuestions();

</script>

</body>
</html>
