<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy LMS Quiz Engine</title>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>

<script src="auth.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0a0a0a;
        color: #fff;
    }

    nav {
        background: #000000;
        padding: 1rem 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 2px solid #ffd700;
    }

    .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
        color: #ffd700;
    }

    .user-info {
        background: rgba(255,255,255,0.1);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        border: 1px solid rgba(255,255,255,0.2);
    }

    .container {
        max-width: 850px;
        margin: auto;
        padding: 30px 20px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        gap: 15px;
        flex-wrap: wrap;
    }

    .score-box, .timer-box {
        background: #111;
        padding: 15px 25px;
        border-radius: 12px;
        font-weight: bold;
        border: 1px solid #222;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .timer-box {
        color: #ff4d4d;
        border-color: #ff4d4d;
    }

    .card {
        background: #111;
        padding: 25px;
        border-radius: 16px;
        margin-bottom: 25px;
        border: 1px solid #222;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .question {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 20px;
        line-height: 1.5;
        color: #ffd700;
    }

    .option {
        background: #1a1a1a;
        padding: 14px 18px;
        margin: 10px 0;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s ease;
        border: 1px solid #333;
        color: #ddd;
    }

    .option:hover {
        background: #252525;
        border-color: #ffd700;
        color: #fff;
    }

    .option.selected {
        background: #333;
        border-color: #ffd700;
    }

    /* Challenge Mode Review Classes */
    .correct {
        background: #1b4332 !important;
        border-color: #52b788 !important;
        color: #d8f3dc !important;
    }

    .wrong {
        background: #4a121a !important;
        border-color: #ba181b !important;
        color: #f5cbcb !important;
    }

    .explanation {
        margin-top: 15px;
        padding: 15px;
        background: #161616;
        border-left: 4px solid #ffd700;
        border-radius: 0 8px 8px 0;
        font-size: 14px;
        line-height: 1.6;
        color: #ccc;
    }

    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        flex-wrap: wrap;
        gap: 15px;
    }

    button {
        padding: 14px 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        transition: 0.2s;
    }

    .next { background: #ffd700; color: #000; }
    .next:hover { background: #ffea70; }
    .back { background: #333; color: #fff; }
    .back:hover { background: #444; }
    .home { background: #222; color: #fff; border: 1px solid #444; }
    .home:hover { background: #333; }
    .submit { background: #2b9348; color: white; }
    .submit:hover { background: #007f5f; }

    .result-box {
        background: #111;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        border: 1px solid #222;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .result-box h1 { color: #ffd700; margin-bottom: 15px; }

    .reward-card {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        margin: 20px 0;
        border: 1px solid #ffd700;
    }

    @media(max-width:768px) {
        .top-bar { flex-direction: column; align-items: stretch; }
        button { width: 100%; }
        .nav-buttons { flex-direction: column-reverse; }
    }
</style>
</head>

<body>

<nav>
    <div class="nav-container">
        <div class="logo" id="title">🎓 Ernest Embassy LMS</div>
        <div class="user-info" id="userInfo">👤 Loading Profile...</div>
    </div>
</nav>

<div class="container">
    <div class="top-bar">
        <div class="score-box" id="scoreWrapper">
            Target Milestone: <span id="score">0</span> Answers Logged
        </div>
        <div class="timer-box" id="timerBox" style="display: none;">
            ⏰ Time Remaining: <span id="timer">30:00</span>
        </div>
    </div>

    <div id="quiz"></div>

    <div class="nav-buttons">
        <div style="display: flex; gap: 10px; width: 100%; max-width: 400px;" class="mobile-stack">
            <button class="back" onclick="prevPage()">⬅ Back</button>
            <button class="home" onclick="goHome()">🏠 Dashboard</button>
        </div>
        <div style="display: flex; gap: 10px; width: 100%; max-width: 400px; justify-content: flex-end;" class="mobile-stack">
            <button class="submit" id="submitBtn" onclick="submitQuiz()">✅ Submit Quiz</button>
            <button class="next" onclick="nextPage()">Next ➡</button>
        </div>
    </div>
</div>

<script>
/* ====================================
   SYSTEM GLOBAL METRICS MATRIX
==================================== */
const urlParams = new URLSearchParams(window.location.search);
let mode = urlParams.get("mode") || "free";
let targetSubject = urlParams.get("subject") || "general"; 

let questions = [];
let page = 0;
let perPage = 5;
let answeredQuestions = {}; // Format: { globalIndex: selectedOptionIndex }
let totalTime = mode === "paid" ? 1800 : 999999; 
let timerInterval = null;

/* ====================================
   UI ROUTING STYLES MAP
==================================== */
if (mode === "paid") {
    document.getElementById("title").innerHTML = "🔴 Paid Challenge Quiz (₦100)";
    document.getElementById("timerBox").style.display = "block";
    document.getElementById("scoreWrapper").style.display = "none"; // Hide progress to secure evaluation
} else {
    document.getElementById("title").innerHTML = "🟢 Free Test Workspace";
    document.getElementById("timerBox").style.display = "none";
}

/* ====================================
   FETCH & FILTER QUESTIONS QUERY
==================================== */
async function loadQuestions() {
    const container = document.getElementById("quiz");
    container.innerHTML = '<div style="text-align:center; padding:40px; color:#ffd700;">📚 Sifting curated curriculum queries...</div>';
    
    try {
        // Query backend database with content target profiles
        const snap = await db.collection("questions")
                             .where("subject", "==", targetSubject)
                             .get();
        questions = [];
        
        snap.forEach(doc => {
            const data = doc.data();
            questions.push({
                id: doc.id,
                q: data.q,
                o: data.o || [],
                a: parseInt(data.a) || 0,
                exp: data.exp || "Review notes regarding target syllabus frameworks."
            });
        });
        
        // Fallback catch block for blank categories
        if (questions.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; padding:40px; border: 1px dashed #333; border-radius:12px;">
                    <p style="color:#ffd700; font-size:18px;">⚠️ Subject Channel Empty</p>
                    <p style="color:#888; margin: 10px 0 20px;">No active assessments registered for: <strong>${escapeHtml(targetSubject)}</strong>.</p>
                    <button class="home" onclick="goHome()">🏠 Return to Dashboard</button>
                </div>
            `;
            return;
        }
        
        // Randomize questions for paid challenge modes
        if (mode === "paid") {
            questions = questions.sort(() => Math.random() - 0.5);
        }
        
        render();
        
    } catch (error) {
        console.error("Critical Firestore extraction failure:", error);
        container.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <p style="color:#ff4d4d;">⚠️ Failed to load questionnaire records.</p>
                <button class="next" onclick="location.reload()" style="margin-top:20px;">🔄 Reload Interface</button>
            </div>
        `;
    }
}

/* ====================================
   COMPILE PAGINATED INTERFACE MARKUP
==================================== */
function render() {
    let start = page * perPage;
    let end = start + perPage;
    let slice = questions.slice(start, end);
    const container = document.getElementById("quiz");
    
    if (slice.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <p style="font-size:18px; margin-bottom:20px;">All academic inquiries answered! Verify choices and tap submit.</p>
                <button class="submit" onclick="submitQuiz()">✅ Finalize & Submit Quiz</button>
            </div>
        `;
        return;
    }
    
    let htmlMarkup = "";
    
    slice.forEach((q, idx) => {
        const globalIndex = start + idx;
        const savedAnswer = answeredQuestions[globalIndex];
        const isAnswered = savedAnswer !== undefined;
        
        htmlMarkup += `
        <div class="card" id="card-${globalIndex}">
            <div class="question">${globalIndex + 1}. ${escapeHtml(q.q)}</div>
        `;
        
        q.o.forEach((opt, optIdx) => {
            let stateClass = "";
            
            if (isAnswered) {
                if (mode === "free") {
                    // Show immediate coloring only in Free practice mode
                    if (optIdx === q.a) stateClass = "correct";
                    else if (savedAnswer === optIdx) stateClass = "wrong";
                } else {
                    // Paid challenge mode: simply highlight selected option without confirming answer
                    if (savedAnswer === optIdx) stateClass = "selected";
                }
            }
            
            htmlMarkup += `
            <div class="option ${stateClass}" 
                 onclick="recordChoice(this, ${globalIndex}, ${optIdx}, ${q.a})"
                 style="${(isAnswered && mode === 'free') ? 'pointer-events:none;' : ''}">
                ${escapeHtml(opt)}
            </div>
            `;
        });
        
        // Explanations show immediately only during Free practice mode sessions
        if (isAnswered && mode === "free") {
            htmlMarkup += `
            <div class="explanation">
                <strong>📖 Syllabus Breakdown:</strong> ${escapeHtml(q.exp)}
            </div>
            `;
        }
        
        htmlMarkup += `</div>`;
    });
    
    container.innerHTML = htmlMarkup;
    
    // Track count values on the public dashboard header link 
    document.getElementById("score").innerText = Object.keys(answeredQuestions).length;
}

/* ====================================
   PROCESS & STORE USER SELECTION
==================================== */
function recordChoice(element, qIndex, selectedIdx, correctIdx) {
    // In free mode, lock options down after an answer is recorded
    if (mode === "free" && answeredQuestions[qIndex] !== undefined) return;
    
    // Log selected answer index
    answeredQuestions[qIndex] = selectedIdx;
    
    if (mode === "free") {
        const parent = element.parentElement;
        const options = parent.querySelectorAll(".option");
        
        options.forEach((o, i) => {
            o.style.pointerEvents = "none";
            if (i === correctIdx) o.classList.add("correct");
        });
        
        if (selectedIdx !== correctIdx) {
            element.classList.add("wrong");
        }
        
        render(); // Re-render to safely append explanation strings down the pipeline
    } else {
        // Paid challenge mode: change highlighting seamlessly across options
        const parent = element.parentElement;
        parent.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        element.classList.add("selected");
    }
}

/* ====================================
   PAGINATION MANAGEMENT
==================================== */
function nextPage() {
    if ((page + 1) * perPage < questions.length) {
        page++;
        render();
    }
}

function prevPage() {
    if (mode === "paid") {
        alert("⚠️ Back navigation is disabled in paid challenge mode to preserve evaluation integrity.");
        return;
    }
    if (page > 0) {
        page--;
        render();
    }
}

/* ====================================
   CHALLENGE MODE TIMER ENGINE
==================================== */
function startTimer() {
    if (mode !== "paid") return;
    
    timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;
        seconds = seconds < 10 ? "0" + seconds : seconds;
        document.getElementById("timer").innerText = `${minutes}:${seconds}`;
        
        if (totalTime <= 0) {
            clearInterval(timerInterval);
            alert("⏰ Assessment duration target exceeded! Running autocommit protocol...");
            submitQuiz();
        }
        totalTime--;
    }, 1000);
}

/* ====================================
   SUBMIT & GRADE PROCESS ROUTINE
==================================== */
async function submitQuiz() {
    window.onbeforeunload = null; // Lift navigation interception rule
    if (timerInterval) clearInterval(timerInterval);
    
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "Processing...";

    let trueCorrectCount = 0;
    const totalQuestionsCount = questions.length;
    
    // Evaluate scores against core keys mapping
    questions.forEach((q, idx) => {
        if (answeredQuestions[idx] === q.a) {
            trueCorrectCount++;
        }
    });
    
    let scorePercentage = Math.round((trueCorrectCount / totalQuestionsCount) * 100);
    
    try {
        // Save quiz metrics to user history inside centralized auth.js routines
        if (typeof initAuth === "function") {
            if (mode === "paid") {
                // Challenge run updates primary grade matrices securely
                await db.collection("users").doc(currentUser.uid).update({
                    score: scorePercentage,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            
            // Push tracking log frames onto historical database maps
            await db.collection("quiz_attempts").add({
                uid: currentUser.uid,
                studentName: getUserName(),
                subject: targetSubject,
                correctCount: trueCorrectCount,
                totalCount: totalQuestionsCount,
                percentage: scorePercentage,
                examType: mode,
                completedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
    } catch (e) {
        console.error("Data logging warning: tracking frames failed to pipe natively:", e);
    }

    let reportCardMessage = "";
    if (scorePercentage >= 80) {
        reportCardMessage = "🎉 Outstanding Performance! Your understanding of this syllabus is absolute.";
    } else if (scorePercentage >= 60) {
        reportCardMessage = "👍 Competent Result. Review core problem regions to hit higher brackets.";
    } else {
        reportCardMessage = "📚 Core syllabus structures require active reinforcement. Open class notes and review guidelines.";
    }
    
    document.querySelector(".container").innerHTML = `
        <div class="result-box">
            <h1>🎉 Evaluation Finalized!</h1>
            <h2>Performance Grade: ${trueCorrectCount} / ${totalQuestionsCount}</h2>
            <p style="font-size: 2rem; margin: 15px 0; color:#ffd700;">${scorePercentage}%</p>
            
            <div class="reward-card">
                <p>${reportCardMessage}</p>
            </div>
            
            ${(mode === "paid" && scorePercentage >= 80) ? `
                <div style="background:#1b4332; border:1px solid #52b788; padding:15px; border-radius:8px; margin-bottom:20px; font-size:14px; color:#d8f3dc;">
                    🏆 Milestone Target Achieved! You qualify for the cash reward roster.<br>
                    <span style="font-size:12px; color:#95d5b2;">Submit your registered Opay mobile identifier through official channels to verify your payout.</span>
                </div>
            ` : ''}
            
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:25px;">
                <button class="home" onclick="goHome()">🏠 Workspace Hub</button>
                <button class="next" onclick="location.reload()">🔄 Restart Attempt</button>
            </div>
        </div>
    `;
}

/* ====================================
   ESCAPE STRINGS ESCAPEMENT HOOK
==================================== */
function escapeHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function goHome() { window.location.href = "dashboard.html"; }

/* ====================================
   ANTI-TAMPER NAVIGATION WARNING
==================================== */
if (mode === "paid") {
    window.onbeforeunload = function() {
        return "⚠️ Paid tournament matrix challenge current processing frame is alive! Reloads automatically abort progress logs.";
    };
}

/* ====================================
   PORTAL INITIALIZE LIFE-CYCLE
==================================== */
async function runQuizGatewayInit() {
    // Rely completely on centralized authentication routing engines
    await initAuth(true);
    
    // Update student name signature tag lines natively
    document.getElementById("userInfo").innerText = `👤 ${getUserName()}`;
    
    // Build questionnaire pools
    await loadQuestions();
    
    if (mode === "paid") startTimer();
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runQuizGatewayInit);
} else {
    runQuizGatewayInit();
}
</script>

</body>
</html>
