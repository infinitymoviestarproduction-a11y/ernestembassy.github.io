<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Embassy LMS</title>

<style>
body{font-family:Segoe UI;background:#eef2f7;margin:0}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;text-align:center}
.container{max-width:1000px;margin:auto;padding:20px}

.card{
background:#fff;padding:20px;margin:15px 0;border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);cursor:pointer;
}

.hidden{display:none}

/* quiz */
.option{background:#f1f1f1;padding:10px;margin:5px;border-radius:8px;cursor:pointer}
.correct{background:#c8f7c5}
.wrong{background:#ffcccc}

.nav-btn{padding:10px;margin:5px;border:none;border-radius:8px;cursor:pointer}
.next{background:#667eea;color:#fff}
.back{background:#333;color:#fff}
.home{background:#000;color:#fff}
</style>
</head>

<body>

<div class="header">
<h1>🎓 LMS Student Portal</h1>
<p>Learn • Practice • Compete</p>
</div>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="card" onclick="openResources()">
<h2>📚 Educational Resources</h2>
</div>

<div class="card" onclick="openFreeTest()">
<h2>🟢 Free CBT Mode</h2>
</div>

<div class="card" onclick="openChallenge()">
<h2>🔴 Challenge Quiz (₦100)</h2>
</div>

<div class="card" onclick="goAdmin()">
<h2>⚙️ Admin Panel</h2>
</div>

</div>

<!-- FREE CBT -->
<div id="freeTest" class="hidden"></div>

<!-- RESOURCES -->
<div id="resources" class="hidden"></div>

<script>

/* =========================
STUDENT PROFILE
========================= */
let student = localStorage.getItem("student");
if(!student){
student = prompt("Enter your name:");
localStorage.setItem("student",student);
}

/* =========================
DATABASE (FROM ADMIN)
========================= */
let questions = JSON.parse(localStorage.getItem("questions_db")) || [
{q:"What is CPU?",o:["Brain","Car","Pen","Book"],a:0,exp:"CPU is brain of computer"},
{q:"Keyboard is?",o:["Input","Output","Food","Game"],a:0,exp:"Keyboard inputs data"}
];

let page = 0;
const perPage = 5;

/* =========================
NAVIGATION
========================= */
function show(id){
dashboard.classList.add("hidden");
freeTest.classList.add("hidden");
resources.classList.add("hidden");
document.getElementById(id).classList.remove("hidden");
}

/* =========================
FREE TEST
========================= */
function openFreeTest(){
show("freeTest");
render();
}

function render(){
let start = page*perPage;
let slice = questions.slice(start,start+perPage);

let html = "";

slice.forEach(q=>{
html += `<div>
<h3>${q.q}</h3>`;

q.o.forEach((opt,i)=>{
html += `<div class="option" onclick="check(this,${i},${q.a},'${q.exp}')">${opt}</div>`;
});

html += `</div><hr>`;
});

html += `
<button class="nav-btn back" onclick="prev()">⬅</button>
<button class="nav-btn next" onclick="next()">➡</button>
<button class="nav-btn home" onclick="back()">🏠 Home</button>
`;

freeTest.innerHTML = html;
}

function check(el,i,a,exp){
if(i===a){
el.classList.add("correct");
}else{
el.classList.add("wrong");
}
el.parentElement.innerHTML += `<p>📖 ${exp}</p>`;
}

function next(){ if((page+1)*perPage < questions.length){page++;render();} }
function prev(){ if(page>0){page--;render();} }

/* =========================
RESOURCES (FROM ADMIN)
========================= */
function openResources(){
show("resources");

let lessons = JSON.parse(localStorage.getItem("lessons_db")) || [];

let html = "<h2>📚 Lessons</h2>";

lessons.forEach(l=>{
html += `<div class="card">
<h3>${l.title}</h3>
<p>${l.content}</p>
</div>`;
});

resources.innerHTML = html;
}

/* =========================
CHALLENGE
========================= */
function openChallenge(){
window.location.href="challenge.html";
}

/* =========================
ADMIN
========================= */
function goAdmin(){
window.location.href="admin.html";
}

function back(){
dashboard.classList.remove("hidden");
freeTest.classList.add("hidden");
resources.classList.add("hidden");
}

</script>

</body>
</html>
