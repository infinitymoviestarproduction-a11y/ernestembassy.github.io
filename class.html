<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBXuzYLUALnYVfjdg_JDIUE1zySCAbpkpg",
        authDomain: "ernest-embassy-lms.firebaseapp.com",
        projectId: "ernest-embassy-lms",
        storageBucket: "ernest-embassy-lms.firebasestorage.app",
        messagingSenderId: "204896421221",
        appId: "1:204896421221:web:9407b523da68c3e5b88d8c"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let loadedQuestions = [];
    let randomizedQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentSubject = 'physics';
    let currentUser = null;
    let isQuizStarted = false;
    let timerInterval = null;
    let timeLeft = 10;
    let isAnswered = false;
    let userPaidStatus = {};
    
    // Quiz settings
    const TIME_PER_QUESTION = 10;
    const TOTAL_QUESTIONS_TO_SHOW = 20;
    
    // Premium subjects that require payment
    const premiumSubjects = ['physics', 'mathematics', 'english'];
    const freeSubjects = ['digital-technology', 'igbo'];
    
    const subjectNames = {
        'physics': 'Physics',
        'mathematics': 'Mathematics',
        'english': 'English Language',
        'digital-technology': 'Digital Technology',
        'igbo': 'Igbo Language'
    };
    
    function goToPage(page) {
        window.location.href = page;
    }
    
    function changeSubject() {
        const select = document.getElementById('subjectSelect');
        const subject = select.value;
        localStorage.setItem('selectedSubject', subject);
        window.location.href = `class.html?subject=${subject}`;
    }
    
    function getSubjectFromURL() {
        const params = new URLSearchParams(window.location.search);
        const subject = params.get('subject');
        if (subject) return subject;
        const saved = localStorage.getItem('selectedSubject');
        return saved || 'physics';
    }
    
    function formatSubjectName(subjectId) {
        return subjectNames[subjectId] || subjectId;
    }
    
    function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
    
    function getRandomQuestions(allQuestions, count) {
        const shuffled = shuffleArray(allQuestions);
        return shuffled.slice(0, Math.min(count, shuffled.length));
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        
        timeLeft = TIME_PER_QUESTION;
        isAnswered = false;
        
        const timerElement = document.getElementById('timerDisplay');
        const timerCircle = document.getElementById('timerCircle');
        
        timerInterval = setInterval(() => {
            if (isAnswered) return;
            
            timeLeft--;
            
            if (timerElement) {
                timerElement.textContent = `${timeLeft}s`;
            }
            
            if (timeLeft <= 3 && timerCircle) {
                timerCircle.classList.add('timer-warning');
            } else if (timerCircle) {
                timerCircle.classList.remove('timer-warning');
            }
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (!isAnswered) {
                    handleTimeOut();
                }
            }
        }, 1000);
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function handleTimeOut() {
        isAnswered = true;
        
        const buttons = document.querySelectorAll('.option-item');
        buttons.forEach(btn => btn.disabled = true);
        
        const q = randomizedQuestions[currentIndex];
        const correct = q.answer;
        
        buttons.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${correct}'`)) {
                btn.classList.add('correct');
            }
        });
        
        const explanationBox = document.getElementById('explanationBox');
        const explanationText = document.getElementById('explanationText');
        if (explanationBox && explanationText) {
            explanationBox.style.display = 'block';
            explanationText.innerHTML = `⏰ Time's up! The correct answer was ${correct}. ${q.explanation || ''}`;
            explanationBox.style.background = '#fff3cd';
            explanationBox.style.borderLeftColor = '#f39c12';
        }
        
        document.getElementById('nextBtn').style.display = 'block';
    }
    
    // Payment Modal - Shows when user tries to access premium subject without paying
    function showPaymentModal(subject) {
        const subjectName = formatSubjectName(subject);
        
        const modal = document.createElement('div');
        modal.className = 'payment-modal';
        modal.innerHTML = `
            <div class="payment-content">
                <div class="payment-icon">💰</div>
                <h2 style="color: #667eea; margin: 15px 0;">Unlock ${subjectName}</h2>
                <p style="color: #718096;">Get full access to all questions and explanations</p>
                <div class="payment-amount">₦100</div>
                
                <div class="payment-benefits">
                    <p>✅ <strong>${subjectName} Full Question Bank</strong></p>
                    <p>✅ <strong>Detailed Explanations</strong> for every answer</p>
                    <p>✅ <strong>Timed Quiz Mode</strong> with 10 seconds per question</p>
                    <p>✅ <strong>Randomized Questions</strong> - No repeats</p>
                    <p>✅ <strong>Track Your Progress</strong> and see scores</p>
                    <p>✅ <strong>Lifetime Access</strong> - Pay once, unlock forever</p>
                </div>
                
                <div class="payment-details">
                    <h4 style="margin-bottom: 10px;">📱 Payment Details:</h4>
                    <p><strong>Opay / Palmpay:</strong> 08032607809</p>
                    <p><strong>First Bank:</strong> 3113254386</p>
                    <p><strong>Account Name:</strong> Damian Anielozie Okafor</p>
                    <p style="margin-top: 10px; font-size: 0.75rem; color: #666;">After payment, click "I Have Paid" to unlock instantly</p>
                </div>
                
                <button onclick="confirmPayment('${subject}')" style="background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px;">✅ I Have Paid</button>
                <button onclick="this.parentElement.parentElement.remove(); window.location.href='index.html'" style="background: #e2e8f0; color: #4a5568; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; width: 100%;">🏠 Go to Home</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    async function confirmPayment(subject) {
        if (!currentUser) {
            alert("Please login first to unlock quizzes");
            window.location.href = "login.html";
            return;
        }
        
        try {
            const studentRef = db.collection('students').doc(currentUser.uid);
            const studentDoc = await studentRef.get();
            const studentData = studentDoc.data();
            const paidQuizzes = studentData?.paidQuizzes || [];
            
            if (!paidQuizzes.includes(subject)) {
                paidQuizzes.push(subject);
                await studentRef.update({ 
                    paidQuizzes: paidQuizzes,
                    lastPaymentDate: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`✅ ${formatSubjectName(subject)} unlocked successfully! You can now take the quiz.`);
                userPaidStatus[subject] = true;
            }
            
            document.querySelectorAll('.payment-modal').forEach(m => m.remove());
            // Reload the page to start quiz
            location.reload();
        } catch (error) {
            console.error("Payment confirmation error:", error);
            alert("Error processing payment confirmation. Please contact support.");
        }
    }
    
    // Check if user has paid for a subject
    async function checkPaymentStatus(subject) {
        if (!currentUser) return false;
        
        try {
            const studentDoc = await db.collection('students').doc(currentUser.uid).get();
            const paidQuizzes = studentDoc.data()?.paidQuizzes || [];
            return paidQuizzes.includes(subject);
        } catch (error) {
            console.error("Error checking payment status:", error);
            return false;
        }
    }
    
    // Main access check - shows payment modal for premium subjects without payment
    async function checkAndHandleAccess(subject) {
        // Free subjects - always accessible
        if (freeSubjects.includes(subject)) {
            return true;
        }
        
        // Premium subjects - require login and payment
        if (premiumSubjects.includes(subject)) {
            // Check if user is logged in
            if (!currentUser) {
                const loginChoice = confirm(`${formatSubjectName(subject)} is a premium subject (₦100).\n\nYou need to login or register to access this subject.\n\nClick OK to login, Cancel to go back.`);
                if (loginChoice) {
                    window.location.href = "login.html";
                } else {
                    window.location.href = "index.html";
                }
                return false;
            }
            
            // Check payment status
            const hasPaid = await checkPaymentStatus(subject);
            if (!hasPaid) {
                showPaymentModal(subject);
                return false;
            }
        }
        
        return true;
    }
    
    async function loadQuestions() {
        currentSubject = getSubjectFromURL();
        console.log(`Loading questions for: ${currentSubject}`);
        
        const select = document.getElementById('subjectSelect');
        if (select) select.value = currentSubject;
        
        const interfaceDiv = document.getElementById("quizInterface");
        
        // First check if user can access this subject
        const canAccess = await checkAndHandleAccess(currentSubject);
        if (!canAccess) {
            interfaceDiv.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 4rem; margin: 20px;">🔒</div>
                    <h2 style="color: #667eea;">Access Restricted</h2>
                    <p style="margin: 20px 0; color: #718096;">
                        ${formatSubjectName(currentSubject)} is a <strong>premium subject</strong> (₦100).
                    </p>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="goToPage('login.html')">🔐 Login to Unlock</button>
                        <button class="btn btn-success" onclick="goToPage('register.html')">📝 Register</button>
                        <button class="btn btn-secondary" onclick="goToPage('index.html')">🏠 Home</button>
                    </div>
                </div>
            `;
            return false;
        }
        
        try {
            const docRef = db.collection("questions").doc(currentSubject);
            const docSnap = await docRef.get();
            
            if (!docSnap.exists) {
                interfaceDiv.innerHTML = `
                    <div style="text-align: center;">
                        <div style="font-size: 4rem; margin: 20px;">📚</div>
                        <h2 style="color: #667eea;">No Questions Found</h2>
                        <p style="margin: 20px 0; color: #718096;">
                            No questions available for ${formatSubjectName(currentSubject)}.
                        </p>
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="goToPage('bulk-upload.html')">📤 Go to Bulk Upload</button>
                            <button class="btn btn-warning" onclick="goToPage('education.html')">🎓 Education Hub</button>
                            <button class="btn btn-secondary" onclick="goToPage('index.html')">🏠 Home</button>
                        </div>
                    </div>
                `;
                return false;
            }
            
            const data = docSnap.data();
            const allQuestions = data.questions || [];
            console.log(`Total questions available: ${allQuestions.length}`);
            
            if (allQuestions.length === 0) {
                interfaceDiv.innerHTML = `
                    <div style="text-align: center;">
                        <h2>Empty Question Set</h2>
                        <button class="btn btn-primary" onclick="goToPage('bulk-upload.html')">Upload Questions</button>
                    </div>
                `;
                return false;
            }
            
            randomizedQuestions = getRandomQuestions(allQuestions, TOTAL_QUESTIONS_TO_SHOW);
            console.log(`Selected ${randomizedQuestions.length} random questions for this session`);
            
            const hasPaid = await checkPaymentStatus(currentSubject);
            const isFree = freeSubjects.includes(currentSubject);
            
            document.querySelector('.hero h1').innerHTML = `🎯 ${formatSubjectName(currentSubject)} Quiz`;
            
            interfaceDiv.innerHTML = `
                <div style="text-align: center;">
                    <div style="font-size: 4rem; margin: 20px;">🎯</div>
                    <h2 style="color: #667eea; margin: 20px 0;">Ready to Challenge Yourself?</h2>
                    <p style="margin: 15px 0; color: #718096; font-size: 1.1rem;">
                        📚 ${randomizedQuestions.length} random questions from ${allQuestions.length} total
                    </p>
                    <p style="margin: 10px 0; color: #f39c12; font-size: 0.9rem;">
                        ⏱️ ${TIME_PER_QUESTION} seconds per question
                    </p>
                    ${premiumSubjects.includes(currentSubject) ? 
                        `<p style="margin: 10px 0; font-size: 0.9rem;"><span class="badge-paid">✓ Premium Unlocked</span> You have full access to this subject</p>` : 
                        `<p style="margin: 10px 0; font-size: 0.9rem;"><span class="badge-paid">✓ Free Subject</span> Enjoy unlimited access</p>`
                    }
                    <button class="btn btn-success" onclick="startQuiz()" style="font-size: 1.2rem; padding: 15px 40px;">
                        🚀 Start Quiz
                    </button>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-warning" onclick="goToPage('education.html')">🎓 Education Hub</button>
                    <button class="btn btn-secondary" onclick="goToPage('index.html')">🏠 Home</button>
                </div>
            `;
            return true;
        } catch (error) {
            console.error(`Error: ${error.message}`);
            interfaceDiv.innerHTML = `
                <div class="error-box">
                    <strong>Error loading questions:</strong><br>
                    ${error.message}
                </div>
            `;
            return false;
        }
    }
    
    function startQuiz() {
        if (randomizedQuestions.length === 0) return;
        currentIndex = 0;
        score = 0;
        isQuizStarted = true;
        showQuestion();
    }
    
    function showQuestion() {
        stopTimer();
        
        const q = randomizedQuestions[currentIndex];
        const interfaceDiv = document.getElementById("quizInterface");
        
        interfaceDiv.innerHTML = `
            <div class="quiz-meta">
                <span>📖 ${formatSubjectName(currentSubject)}</span>
                <div class="timer-container" id="timerCircle">
                    ⏱️ Time Left: <span class="timer-number" id="timerDisplay">${TIME_PER_QUESTION}s</span>
                </div>
                <span style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 5px 12px; border-radius: 20px;">⭐ ${currentIndex + 1}/${randomizedQuestions.length}</span>
            </div>
            <div class="question-text">${escapeHtml(q.question)}</div>
            <div class="options-list">
                <button class="option-item" onclick="checkAnswer('A')"><strong>A.</strong> ${escapeHtml(q.optionA)}</button>
                <button class="option-item" onclick="checkAnswer('B')"><strong>B.</strong> ${escapeHtml(q.optionB)}</button>
                <button class="option-item" onclick="checkAnswer('C')"><strong>C.</strong> ${escapeHtml(q.optionC)}</button>
                <button class="option-item" onclick="checkAnswer('D')"><strong>D.</strong> ${escapeHtml(q.optionD)}</button>
            </div>
            <div id="nextBtn" style="display:none; margin-top: 20px; text-align: center;">
                <button class="btn btn-primary" onclick="nextQuestion()">Next Question →</button>
            </div>
            <div id="explanationBox" style="display:none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 10px; border-left: 4px solid #4caf50;">
                <strong>📖 Explanation:</strong> <span id="explanationText"></span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-warning" onclick="goToPage('education.html')">🎓 Education Hub</button>
                <button class="btn btn-secondary" onclick="goToPage('index.html')">🏠 Home</button>
            </div>
        `;
        
        startTimer();
    }
    
    function checkAnswer(selected) {
        if (isAnswered) return;
        
        isAnswered = true;
        stopTimer();
        
        const q = randomizedQuestions[currentIndex];
        const correct = q.answer;
        
        const buttons = document.querySelectorAll('.option-item');
        buttons.forEach(btn => btn.disabled = true);
        
        let isCorrect = false;
        
        buttons.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${correct}'`)) {
                btn.classList.add('correct');
            }
        });
        
        if (selected === correct) {
            const selectedBtn = Array.from(buttons).find(btn => 
                btn.getAttribute('onclick').includes(`'${selected}'`)
            );
            if (selectedBtn) selectedBtn.classList.add('correct');
            score++;
            isCorrect = true;
        } else {
            const selectedBtn = Array.from(buttons).find(btn => 
                btn.getAttribute('onclick').includes(`'${selected}'`)
            );
            if (selectedBtn) selectedBtn.classList.add('incorrect');
        }
        
        const explanationBox = document.getElementById('explanationBox');
        const explanationText = document.getElementById('explanationText');
        if (explanationBox && explanationText) {
            explanationBox.style.display = 'block';
            const resultText = isCorrect ? '✅ Correct! ' : '❌ Incorrect. ';
            explanationText.innerHTML = resultText + (q.explanation || `The correct answer is ${correct}.`);
            if (!isCorrect) {
                explanationBox.style.background = '#fef2f2';
                explanationBox.style.borderLeftColor = '#eb3349';
            }
        }
        
        document.getElementById('nextBtn').style.display = 'block';
    }
    
    function nextQuestion() {
        currentIndex++;
        if (currentIndex < randomizedQuestions.length) {
            isAnswered = false;
            showQuestion();
        } else {
            showResults();
        }
    }
    
    function showResults() {
        stopTimer();
        
        const percent = Math.round((score / randomizedQuestions.length) * 100);
        let gradeMessage = "";
        let emoji = "";
        let gradeColor = "";
        
        if (percent >= 80) {
            gradeMessage = "Outstanding! You're a Star! 🌟";
            emoji = "🏆";
            gradeColor = "#11998e";
        } else if (percent >= 60) {
            gradeMessage = "Great Job! Keep Shining! ⭐";
            emoji = "🎉";
            gradeColor = "#f39c12";
        } else if (percent >= 40) {
            gradeMessage = "Good Effort! Practice Makes Perfect! 💪";
            emoji = "📚";
            gradeColor = "#667eea";
        } else {
            gradeMessage = "Keep Learning! You'll Crush It Next Time! 🚀";
            emoji = "💪";
            gradeColor = "#eb3349";
        }
        
        if (currentUser) {
            const studentRef = db.collection('students').doc(currentUser.uid);
            studentRef.update({
                [`quizScores.${currentSubject}`]: percent
            }).catch(() => {});
        }
        
        const interfaceDiv = document.getElementById("quizInterface");
        interfaceDiv.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <div style="font-size: 5rem;">${emoji}</div>
                <h2 style="color: #667eea; margin: 20px 0;">Quiz Complete!</h2>
                <div style="font-size: 4rem; font-weight: bold; margin: 20px; color: ${gradeColor}">
                    ${percent}%
                </div>
                <p style="font-size: 1.3rem;">Score: ${score}/${randomizedQuestions.length}</p>
                <p style="margin: 20px 0; color: #718096;">${gradeMessage}</p>
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="startQuiz()">🔄 Play Again (New Random Questions)</button>
                    <button class="btn btn-warning" onclick="goToPage('education.html')">🎓 Education Hub</button>
                    <button class="btn btn-secondary" onclick="goToPage('index.html')">🏠 Home</button>
                </div>
            </div>
        `;
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            return m;
        });
    }
    
    // Check authentication state and load
    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        await loadQuestions();
    });
</script>
</body>
</html>
