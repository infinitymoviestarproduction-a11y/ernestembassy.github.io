<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course - Ernest Embassy LMS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
}

/* NAV */
nav{
    background:#1a1a2e;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.home{ background:#667eea; }
.back{ background:#28a745; }
.logout{ background:#dc3545; }

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    padding:40px;
    text-align:center;
}

.header h1{
    font-size:30px;
    margin-bottom:10px;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

/* LESSON GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:10px;
    color:#1a1a2e;
}

.card p{
    color:#666;
    margin-bottom:15px;
}

.start-btn{
    display:inline-block;
    background:#667eea;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.start-btn:hover{
    background:#5a67d8;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px;
    background:#1a1a2e;
    color:white;
    margin-top:40px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="nav-left">
        <a class="btn home" href="index.html">🏠 Home</a>
        <a class="btn back" href="dashboard.html">⬅ Back</a>
    </div>

    <div class="nav-right">
        <span id="userName"></span>
        <button class="btn logout" onclick="logout()">Logout</button>
    </div>
</nav>

<!-- HEADER -->
<div class="header">
    <h1 id="courseTitle">Loading Course...</h1>
    <p>Select a lesson to continue learning</p>
</div>

<!-- CONTENT -->
<div class="container">

    <h2>📚 Lessons</h2>

    <div class="grid" id="lessonGrid">

        <!-- Dynamic lessons will load here -->

    </div>

</div>

<footer>
    © 2026 Ernest Embassy LMS - Course Page
</footer>

<script>
/* =========================
   SESSION CHECK
========================= */
const user = JSON.parse(localStorage.getItem("currentUser"));

if (!user) {
    window.location.href = "login.html";
}

document.getElementById("userName").innerText = user.name || "Student";

/* =========================
   GET COURSE FROM URL
========================= */
const params = new URLSearchParams(window.location.search);
const course = params.get("subject") || params.get("course");

/* =========================
   COURSE DATA (TEMP - Firebase later)
========================= */
const courses = {
    "digital-technology": {
        title: "Digital Technology",
        lessons: [
            { title: "Introduction to Computer", desc: "Basics of ICT and computing." },
            { title: "Computer Hardware", desc: "Learn components of a computer." },
            { title: "Software Types", desc: "System vs Application software." }
        ]
    },
    "mathematics": {
        title: "Mathematics",
        lessons: [
            { title: "Algebra Basics", desc: "Variables and expressions." },
            { title: "Linear Equations", desc: "Solving equations step by step." }
        ]
    },
    "english": {
        title: "English Language",
        lessons: [
            { title: "Grammar Rules", desc: "Parts of speech and structure." }
        ]
    }
};

/* =========================
   LOAD COURSE
========================= */
function loadCourse(){

    const data = courses[course];

    if(!data){
        document.getElementById("courseTitle").innerText = "Course Not Found";
        return;
    }

    document.getElementById("courseTitle").innerText = data.title;

    const grid = document.getElementById("lessonGrid");
    grid.innerHTML = "";

    data.lessons.forEach((lesson, index) => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <h3>Lesson ${index + 1}: ${lesson.title}</h3>
            <p>${lesson.desc}</p>
            <a class="start-btn" href="class.html?course=${course}&lesson=${index}">
                Start Lesson
            </a>
        `;

        grid.appendChild(card);
    });
}

/* =========================
   LOGOUT
========================= */
function logout(){
    localStorage.removeItem("currentUser");
    localStorage.removeItem("userLoggedIn");
    window.location.href = "login.html";
}

/* INIT */
loadCourse();
</script>

</body>
</html>
