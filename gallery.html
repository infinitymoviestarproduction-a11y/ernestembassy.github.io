<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Infinity Movie Star Production</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
        }
        
        /* Copy navigation styles from movie.html */
        
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 { font-size: 2.5rem; }
        .hero h1 span { color: #ffd700; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            color: #1a1a2e;
        }
        .section-title span { border-bottom: 3px solid #ffd700; padding-bottom: 10px; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .gallery-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .gallery-caption {
            padding: 15px;
            text-align: center;
            font-weight: 500;
            color: #1a1a2e;
        }
        
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; }
        .lightbox.show { display: flex; }
        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.8rem; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Copy navigation from movie.html -->

    <div class="hero">
        <h1>📸 <span>Behind the Scenes Gallery</span></h1>
        <p>Exclusive photos from Infinity Movie Star Productions</p>
    </div>

    <div class="container">
        <div class="section-title"><span>🎬 Production Photos</span></div>
        <div class="gallery-grid">
            <!-- All your gallery images here -->
            <div class="gallery-item" onclick="openLightbox('images/young n up doing.jpg')">
                <img src="images/young n up doing.jpg" alt="Young N Up Doing" onerror="this.style.display='none'">
                <div class="gallery-caption">🎬 Young N Up Doing</div>
            </div>
            <div class="gallery-item" onclick="openLightbox('images/2014 then.jpg')">
                <img src="images/2014 then.jpg" alt="2014 Then" onerror="this.style.display='none'">
                <div class="gallery-caption">📸 2014 Then</div>
            </div>
            <!-- Add all other gallery images here -->
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <script>
        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightbox').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
